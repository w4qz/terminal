<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESSEC Terminal — student project · prices, macro, rates, portfolio</title>
<meta name="author" content="Clément Guerin Casal — Master in Finance, ESSEC Business School (Singapore)">
<meta name="description" content="Personal market terminal inspired by Bloomberg: delayed prices, yield curves, macroeconomics, news, comparables and portfolio analytics, updated automatically.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23000'/%3E%3Cpath d='M5 22l7-8 5 5 10-11' fill='none' stroke='%23e8a33d' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
--bg:#000; --surface:#0d0f11; --raised:#15181c; --line:#232830;
--txt:#dde3ea; --txt2:#79838f; --txt3:#4a525c;
--pos:#2fbf6b; --neg:#e04a4a; --hot:#e8a33d; --sel:#1d3a5c;
--mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px;line-height:1.35;
-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
:focus-visible{outline:1px solid #4d8fd6;outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3038}
::-webkit-scrollbar-track{background:transparent}

/* ---------- chrome ---------- */
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:0;height:30px;border-bottom:1px solid var(--line);
background:var(--surface);flex:none;padding-right:10px}
#brand{padding:0 12px;font-weight:700;letter-spacing:2px;font-size:11px;color:var(--txt)}
.navbtn{padding:0 9px;white-space:nowrap;height:30px;font-size:11px;color:var(--txt2);border-right:1px solid var(--line);
display:flex;align-items:center;gap:6px}
.navbtn:first-of-type{border-left:1px solid var(--line)}
.navbtn kbd{font-size:9px;color:var(--txt3);border:1px solid var(--line);padding:0 3px;border-radius:2px}
.navbtn:hover{background:var(--raised);color:var(--txt)}
.navbtn.on{background:var(--raised);color:var(--txt);box-shadow:inset 0 -2px 0 #4d8fd6}
#clocks{margin-left:10px;flex:1;min-width:120px;overflow:hidden;font-size:10px;color:var(--txt2);white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
#clocks .ctrk{display:inline-flex;gap:16px;padding-right:16px;animation:tape 40s linear infinite}
#clocks:hover .ctrk{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){#clocks .ctrk{animation:none}}
@media (max-width:1500px){ .navbtn kbd{display:none} }
#clocks b{color:var(--txt);font-weight:500}
#searchbtn{margin-left:14px;font-size:10px;white-space:nowrap;color:var(--txt3);border:1px solid var(--line);
padding:2px 8px;border-radius:3px}
#searchbtn:hover{color:var(--txt);border-color:#3a424c}

#main{flex:1;overflow:auto;padding:10px}
.view{display:none}
.view.on{display:block}

/* ---------- grid + panels ---------- */
.g{display:grid;gap:9px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.span2{grid-column:span 2}
@media(max-width:1100px){.g2,.g3,.g23{grid-template-columns:1fr}.span2{grid-column:span 1}}

.pnl{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.pnl>h3{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--txt2);padding:6px 9px;
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.pnl>h3 .rt{margin-left:auto;font-weight:400;letter-spacing:0;color:var(--txt3);font-size:9px}
.pbody{padding:8px 9px;overflow:auto}
.pbody.flush{padding:0}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:9px;font-weight:500;color:var(--txt3);text-align:right;padding:4px 9px;
border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);letter-spacing:.5px}
th:first-child{text-align:left}
td{padding:3px 9px;text-align:right;border-bottom:1px solid #14171b;white-space:nowrap}
td:first-child{text-align:left;color:var(--txt)}
th.symh{text-align:left;color:var(--txt);font-weight:600;font-size:12px;padding:3px 9px;
border-bottom:1px solid #14171b;position:static;letter-spacing:normal;background:none}
tbody tr:hover{background:var(--raised)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:focus-within{background:var(--sel)}
tbody tr:last-child td{border-bottom:none}
.sym{font-weight:600}
.mut{color:var(--txt2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--txt2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- data status ---------- */
.st{font-size:8px;letter-spacing:.5px;padding:0 3px;border-radius:2px;border:1px solid;
vertical-align:middle;margin-left:5px;font-weight:600;white-space:nowrap}
.st-REALTIME{color:var(--pos);border-color:#1e5c39;background:#0d2418}
.st-DELAYED_15M{color:#6ba3e0;border-color:#254a70;background:#0d1a26}
.st-EOD{color:var(--txt2);border-color:var(--line);background:var(--raised)}
.st-SNAPSHOT{color:var(--txt2);border-color:var(--line);background:var(--raised)}
.st-INDICATIVE{color:var(--hot);border-color:#6b4a15;background:#241a08}
.st-SIMULATED{color:#bb98e6;border-color:#4a3268;background:#1a1226}
.st-STALE{color:var(--neg);border-color:#5c2020;background:#240d0d}
.st-AGED{color:var(--hot);border-color:#6b4a15;background:#241a08}
.na{color:var(--txt3);font-style:italic}

/* ---------- controls ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:7px 14px;padding:8px 9px;border-bottom:1px solid var(--line);
background:var(--raised)}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f label{font-size:9px;color:var(--txt3);letter-spacing:.5px}
.f input{width:76px;background:var(--bg);border:1px solid var(--line);padding:2px 5px;
font-size:11px;text-align:right;border-radius:2px}
.f input:focus{border-color:#4d8fd6}
.f.w input{width:104px}
.btn{border:1px solid var(--line);padding:3px 11px;font-size:10px;color:var(--txt2);border-radius:2px;
align-self:flex-end;letter-spacing:.5px}
.btn:hover{background:var(--sel);color:var(--txt);border-color:#3a5a7c}
.btn.go{color:var(--txt);border-color:#3a5a7c;background:#132437}

/* ---------- kv rows ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid #14171b}
.kv:last-child{border:none}
.kv .k{color:var(--txt2);font-size:11px}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- big stat ---------- */
.stat{display:flex;flex-direction:column;gap:1px}
.stat .l{font-size:9px;color:var(--txt3);letter-spacing:.5px}
.stat .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .s{font-size:10px;color:var(--txt2)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:14px;
padding:10px 9px;border-bottom:1px solid var(--line)}

/* ---------- news ---------- */
.nw{padding:8px 9px;border-bottom:1px solid #14171b}
.nw:last-child{border:none}
.nw h4{font-size:12px;font-weight:600;margin-bottom:3px}
.nw p{font-size:11px;color:#a4adb8;line-height:1.5;margin-bottom:4px}
.nw .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:9px;color:var(--txt3)}
.nw a{color:#9cc8ff;text-decoration:none}
/* Liens : bleu clair lisible sur fond noir (le bleu par défaut du navigateur était illisible) */
a{color:#9cc8ff;text-decoration:none} a:visited{color:#9cc8ff} a:hover,a:focus-visible{color:#fff;text-decoration:underline}
a:focus-visible{outline:1px solid #4d8fd6;outline-offset:1px}
.mpop a,#g-arts a,#g-res a{color:var(--txt)} .mpop a:hover,#g-arts a:hover,#g-res a:hover{color:#9cc8ff}

.nw a:hover,.nw a:focus-visible{text-decoration:underline}
.tag{font-size:9px;border:1px solid var(--line);padding:0 4px;border-radius:2px;color:var(--txt2);cursor:pointer}
.tag:hover,.tag:focus-visible{background:var(--sel);color:var(--txt)}

/* ---------- canvas ---------- */
canvas{display:block;width:100%}

/* ---------- heat ---------- */
.heat td{text-align:center;font-size:10px;padding:4px 6px}
.heat td:first-child{text-align:left;color:var(--txt2)}

/* ---------- palette ---------- */
#pal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:100;
align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.on{display:flex}
#palbox{width:min(600px,92vw);background:var(--surface);border:1px solid #3a424c;
box-shadow:0 20px 60px rgba(0,0,0,.7)}
#palin{width:100%;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
#palres{max-height:46vh;overflow:auto}
.pr{padding:7px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #14171b}
.pr.sel{background:var(--sel)}
.pr .s{font-weight:700;width:74px;flex:none}
.pr .n{color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .c{font-size:9px;color:var(--txt3);border:1px solid var(--line);padding:0 4px;border-radius:2px}
#palhint{padding:6px 14px;font-size:9px;color:var(--txt3);border-top:1px solid var(--line);
display:flex;gap:14px}

/* ---------- status bar ---------- */
#bot{height:24px;border-top:1px solid var(--line);background:var(--surface);display:flex;
align-items:center;gap:16px;padding:0 12px;font-size:10px;color:var(--txt3);flex:none}
#bot .dot{width:6px;height:6px;border-radius:50%;background:var(--txt2);display:inline-block;margin-right:5px}
#bot .dot.up{background:var(--pos)} #bot .dot.down{background:var(--neg)}
#bot b{color:var(--txt2);font-weight:500}
.note{font-size:10px;color:var(--txt2);line-height:1.55;padding:8px 9px}
.warn{border-left:2px solid var(--hot);background:#1a1408;padding:7px 9px;font-size:10px;
color:#c9b183;line-height:1.5}

/* ---------- recherche ---------- */
#sq{width:100%;padding:9px 11px;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:2px}
#sq:focus{border-color:#4d8fd6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:10px;border:1px solid var(--line);padding:2px 8px;border-radius:2px;color:var(--txt2)}
.chip.on{background:var(--sel);color:var(--txt);border-color:#3a5a7c}
.rng{display:flex;gap:4px}
.rng button{font-size:10px;border:1px solid var(--line);padding:1px 7px;border-radius:2px;color:var(--txt2)}
.rng button.on{background:var(--sel);color:var(--txt)}

/* ---------- accessibility helpers ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0,0,0,0);white-space:nowrap;border:0}
#skiplink{position:fixed;top:-40px;left:6px;z-index:200;background:#132437;color:var(--txt);
border:1px solid #3a5a7c;padding:6px 12px;border-radius:2px;font-size:11px;transition:top .12s ease}
#skiplink:focus{top:6px}
[role="button"]:focus-visible,.tag:focus-visible,.pr:focus-visible{outline:1px solid #4d8fd6;outline-offset:1px}
@media (prefers-reduced-motion: reduce){
*{animation-duration:0.001ms !important;animation-iteration-count:1 !important;
transition-duration:0.001ms !important;scroll-behavior:auto !important}
#skiplink{transition:none}
}

/* ---------- v2 : lisibilité ---------- */
:root{--txt2:#9ba5b1;--txt3:#6c7783}
th{font-size:10px;letter-spacing:.3px}
tbody th{color:var(--txt)}
.stat .l{font-size:10px}
.kv .k{font-size:11.5px}
#main>.view{max-width:1640px;margin:0 auto}
details.nfo{padding:6px 9px;font-size:10px;color:var(--txt2)}
details.nfo summary{cursor:pointer;color:var(--txt3);list-style:none;user-select:none}
details.nfo summary::before{content:'ⓘ ';color:#4d8fd6}
details.nfo[open] summary{margin-bottom:4px}
details.nfo p{line-height:1.55}
#secbar{position:sticky;top:-10px;z-index:20;margin:-10px -10px 9px;padding:7px 12px;background:rgba(13,15,17,.97);
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
#secbar .t{font-weight:700;font-size:15px;color:var(--hot)}
#secbar .px{font-size:15px;font-weight:600}
#secbar .nm{color:var(--txt2);font-size:11px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#secbar nav{margin-left:auto;display:flex;gap:2px}
#secbar nav button{font-size:10px;padding:3px 9px;border:1px solid var(--line);color:var(--txt2);letter-spacing:.5px}
#secbar nav button:hover{background:var(--sel);color:var(--txt);border-color:#3a5a7c}

/* ---------- bandeau défilant des cours ---------- */
#tape{flex:none;height:22px;overflow:hidden;border-bottom:1px solid var(--line);background:#07090b;position:relative;font-size:11px}
#tape .trk{display:inline-flex;white-space:nowrap;animation:tape 90s linear infinite;line-height:22px}
#tape:hover .trk{animation-play-state:paused}
#tape .it{padding:0 14px;cursor:pointer;border-right:1px solid #14171b}
#tape .it:hover{background:var(--raised)}
#tape .it b{color:var(--hot);font-weight:600;margin-right:6px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#tape .trk{animation:none}}
#helpbtn{margin-left:8px;width:20px;height:20px;font-size:11px;color:var(--txt3);border:1px solid var(--line);border-radius:50%;flex:none}
#helpbtn:hover{color:var(--txt)}
#helpm{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center}
#helpm .hbox{background:var(--surface);border:1px solid var(--line);width:min(900px,92vw)}
#helpm h3{display:flex;justify-content:space-between;padding:7px 10px;font-size:11px;letter-spacing:1px;border-bottom:1px solid var(--line)}
#themebtn{margin-left:6px;flex:none;font-size:10px;color:var(--txt3);border:1px solid var(--line);padding:2px 8px;border-radius:3px;white-space:nowrap}
#themebtn:hover{color:var(--txt)}
#langbtn{margin-left:6px;flex:none;font-size:10px;color:var(--txt3);border:1px solid var(--line);padding:2px 8px;border-radius:3px;white-space:nowrap}
#langbtn:hover{color:var(--txt)}#langbtn b{color:var(--txt)}
/* ---------- thème ambre façon Bloomberg ---------- */
/* ---------- thème Bloomberg : noir, orange, ambre, blanc ; police terminal ---------- */
body.bbg{font-family:"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;font-stretch:condensed;font-size:13px;font-variant-numeric:tabular-nums;--bg:#000;--surface:#000;--raised:#1a1a1a;--line:#2e2e2e;--txt:#f2f2f2;--txt2:#ffb000;--txt3:#a87a1e;--sel:#3a2600;--hot:#fb8b1e;--pos:#2ee05f;--neg:#ff433d}
body.bbg #top{background:#000;border-bottom:1px solid #333}
body.bbg #brand{background:#fb8b1e;color:#000;height:30px;display:flex;align-items:center}
body.bbg .navbtn{color:#ffb000}
body.bbg .navbtn kbd{background:#3a3a3a;color:#fff;border-color:#3a3a3a;border-radius:0}
body.bbg .navbtn:hover{background:#1a1a1a;color:#fff}
body.bbg .navbtn.on{background:#fb8b1e;color:#000;box-shadow:none}
body.bbg .navbtn.on kbd{background:#000;color:#fb8b1e;border-color:#000}
body.bbg #searchbtn{background:#ffd200;color:#000;border:none;border-radius:0;font-weight:700;padding:3px 10px}
body.bbg #searchbtn::after{content:' <GO>';color:#000;font-weight:400}
body.bbg #helpbtn,body.bbg #themebtn,body.bbg #langbtn{color:#ffb000;border-radius:0}body.bbg #langbtn b{color:#fff}
body.bbg #clocks b{color:#fff}
body.bbg #tape{background:#000;border-bottom:1px solid #333}
body.bbg #tape .it b{color:#ffb000;font-weight:400}
body.bbg .pnl{background:#000;border-color:#2e2e2e;border-radius:0}
body.bbg .pnl>h3{background:#262626;color:#ffb000;border-bottom:1px solid #3a3a3a;letter-spacing:.5px}
body.bbg .pnl>h3 .rt{color:#9a9a9a}
body.bbg th{background:#000;color:#ffb000;border-bottom-color:#3a3a3a}
body.bbg td,body.bbg .stat .n,body.bbg .kv .v{color:#f2f2f2}
body.bbg .kv .k,body.bbg .stat .l{color:#ffb000}
body.bbg .stat .s{color:#9a9a9a}
body.bbg .pos,body.bbg td.pos,body.bbg .n.pos,body.bbg .v.pos{color:#2ee05f}
body.bbg .neg,body.bbg td.neg,body.bbg .n.neg,body.bbg .v.neg{color:#ff433d}
body.bbg .rng button,body.bbg .chip,body.bbg .btn{border-radius:0;border-color:#3a3a3a;color:#ffb000}
body.bbg .rng button.on,body.bbg .chip.on,body.bbg .btn.go{background:#fb8b1e;border-color:#fb8b1e;color:#000}
body.bbg .ctl{background:#000;border-bottom-color:#2e2e2e}
body.bbg #secbar{background:#c8102e;border-bottom:none;color:#fff}
body.bbg #secbar .t{background:#000;color:#ffb000;padding:0 6px}
body.bbg #secbar .px{color:#fff}
body.bbg #secbar .nm{color:#fff}
body.bbg #secbar nav button{color:#fff;border-color:rgba(255,255,255,.35);border-radius:0}
body.bbg #secbar nav button span{color:#ffd9a0!important}
body.bbg #secbar nav button:hover{background:#000;color:#ffb000}
body.bbg #secbar .pos,body.bbg #secbar .neg{color:#fff}
body.bbg .warn{background:#000;border-left-color:#fb8b1e;color:#ffb000}
body.bbg .note{color:#9a9a9a}
body.bbg a,body.bbg a:visited{color:#ffd200} body.bbg .mpop a,body.bbg #g-arts a,body.bbg #g-res a{color:#f2f2f2}
body.bbg ::-webkit-scrollbar-thumb{background:#3a3a3a}
#msgline{display:none}
body.bbg #msgline{display:block;flex:none;background:#000;color:#2ee05f;padding:2px 10px;font-size:12px;border-bottom:1px solid #222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gph{gap:10px!important}.gph .gpt{font-weight:700}.gph .gpb{font-size:10px;border:1px solid var(--line);padding:0 8px;color:var(--txt2)}
.gph .gpn{margin-left:8px}
.gpp{border-bottom:1px solid var(--line)}
.gpr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 9px}
.gpr label{color:var(--txt2);font-size:11px;margin-left:6px}.gpr label:first-child{margin-left:0}
.gpr input,.gpr select{font:inherit;font-size:11px;background:var(--raised);color:var(--txt);border:1px solid var(--line);padding:1px 6px;height:20px}
.gpr input[type=number]{width:52px}.gpr input[type=date]{width:128px}
body.bbg .gph{background:#c8102e!important;color:#fff!important;border-bottom:none!important}
body.bbg .gph .gpt{background:#000;color:#ffb000;padding:0 6px}
body.bbg .gph .gpb{background:#000;color:#ffb000;border:1px solid #000;border-radius:0}
body.bbg .gph .gpb:hover{color:#fff}
body.bbg .gph .gpn{color:#fff;font-weight:400}
body.bbg .gph .rt{color:#ffd9a0!important}
body.bbg .gpr{background:#000}
body.bbg .gpr label{color:#fff}
body.bbg .gpr input,body.bbg .gpr select{background:#fb8b1e;color:#000;border:none;border-radius:0;font-weight:700;color-scheme:light}

body.bbg #fbar{display:flex}
#fbar{display:none;align-items:center;height:22px;background:#c8102e;color:#fff;padding:0 10px;gap:14px;flex:none;font-weight:700}
#fbar .fc{background:#000;color:#ffb000;padding:0 6px}
#fbar .ft{font-weight:400}
#fbar .fr{margin-left:auto;font-weight:400}
#fbar .fr b{color:#ffd200}
.fag{background:none;border:1px solid var(--line);color:var(--txt3);padding:2px 4px;cursor:pointer;line-height:0;border-radius:2px}
.fag svg{fill:currentColor}.fag:hover{color:var(--txt);border-color:var(--txt3)}.fag.on{color:#000;background:#fb8b1e;border-color:#fb8b1e}
body:not(.bbg) .fag.on{background:var(--acc,#4d8fd6);border-color:var(--acc,#4d8fd6)}
#fbar .fr .buf{background:#ffd200;color:#000;padding:0 6px;margin-left:6px;font-weight:700;display:none}

2b. Adapters HTTP réels — écrits, inertes tant que le proxy n'est pas

rejetterait et §6 interdit d'exposer une clé côté client. Ils visent

───────────────────────────────────────────────────────────────────────*/
class HttpProvider extends MarketDataProvider{
constructor(base='/api'){ super(); this.base=base; this._lat=[]; }
async _get(path, {retries=2, timeoutMs=6000}={}){
let lastErr;
for(let i=0;i<=retries;i++){
const ctrl = new AbortController();
const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
const t0 = performance.now();
try{
const r = await fetch(this.base+path, {signal:ctrl.signal});
clearTimeout(timer);
this._lat.push(performance.now()-t0);
if(r.status===429){ // rate limit → backoff exponentiel
await new Promise(res=>setTimeout(res, 2**i * 800));
lastErr = new Error('rate limit'); continue;
}
if(!r.ok) throw new Error('HTTP '+r.status);
return await r.json();
}catch(e){
clearTimeout(timer);
lastErr = e;
if(i<retries) await new Promise(res=>setTimeout(res, 2**i * 400));
}
}
throw lastErr;
}
async health(){
try{
const h = await this._get('/health',{retries:0,timeoutMs:2500});
const avg = this._lat.length ? this._lat.reduce((a,b)=>a+b,0)/this._lat.length : 0;
return {up:true, latencyMs:Math.round(avg), rateLimitRemaining:h.rateLimitRemaining ?? null};
}catch(e){ return {up:false, latencyMs:null, rateLimitRemaining:null, error:String(e.message)}; }
}
}

const hit = this.cache.get(ck);

}

/*═══════════════════════════════════════════════════════════════════════
4. MOTEUR QUANTITATIF
Tous les calculs sont réels. Aucune valeur affichée dans les vues
Portefeuille n'est codée en dur.
═══════════════════════════════════════════════════════════════════════*/
const Q = {
mean:a=>a.reduce((x,y)=>x+y,0)/a.length,
std(a){ if(a.length<2) return NaN;
const m=Q.mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); },
cov(a,b){ if(a.length<2) return NaN;
const ma=Q.mean(a), mb=Q.mean(b);
return a.reduce((s,_,i)=>s+(a[i]-ma)*(b[i]-mb),0)/(a.length-1); },
corr(a,b){ const s=Q.std(a)*Q.std(b); return s?Q.cov(a,b)/s:NaN; },
beta(r,m){ const v=Q.cov(m,m); return v?Q.cov(r,m)/v:NaN; },

/** Volatilité annualisée à partir de rendements périodiques. */
volAnn(r,ppy=252){ return Q.std(r)*Math.sqrt(ppy); },

/** CAGR depuis une série de valeurs de portefeuille. */
cagr(series,years){
if(series.length<2||years<=0) return NaN;
const tot = series[series.length-1]/series[0];
return tot<=0?NaN:(Math.pow(tot,1/years)-1)*100;
},
sharpe(r,rf=0,ppy=252){
const s=Q.std(r); if(!s) return NaN;
return (Q.mean(r)-rf/ppy)/s*Math.sqrt(ppy);
},
/** Sortino : ne pénalise que la volatilité baissière. */
sortino(r,rf=0,ppy=252){
const t=rf/ppy, dn=r.filter(x=>x<t).map(x=>(x-t)**2);
if(!dn.length) return Infinity;
const dd=Math.sqrt(dn.reduce((a,b)=>a+b,0)/r.length);
return dd?(Q.mean(r)-t)/dd*Math.sqrt(ppy):NaN;
},
maxDD(series){
let peak=series[0], mx=0;
for(const v of series){ if(v>peak) peak=v; const d=(peak-v)/peak; if(d>mx) mx=d; }
return mx*100;
},
/** VaR historique — quantile empirique, pas d'hypothèse de normalité. */
varHist(r,conf=0.95){
const s=[...r].sort((a,b)=>a-b);
return -s[Math.floor((1-conf)*s.length)]*100;
},
/** CVaR : perte moyenne conditionnelle au-delà de la VaR. */
cvarHist(r,conf=0.95){
const s=[...r].sort((a,b)=>a-b), n=Math.max(1,Math.floor((1-conf)*s.length));
return -Q.mean(s.slice(0,n))*100;
},
/** Alpha de Jensen, annualisé, en points de %. */
jensen(rp,rm,rf=0,ppy=252){
const b=Q.beta(rp,rm);
return ((Q.mean(rp)-rf/ppy) - b*(Q.mean(rm)-rf/ppy))*ppy*100;
},
trackingError(rp,rm,ppy=252){ return Q.volAnn(rp.map((x,i)=>x-rm[i]),ppy)*100; },
infoRatio(rp,rm,ppy=252){
const d=rp.map((x,i)=>x-rm[i]), s=Q.std(d);
return s?Q.mean(d)/s*Math.sqrt(ppy):NaN;
},

/** Cholesky sur matrice de corrélation. Retourne null si non définie positive. */
chol(M){
const n=M.length, L=Array.from({length:n},()=>new Float64Array(n));
for(let i=0;i<n;i++) for(let j=0;j<=i;j++){
let s=M[i][j];
for(let k=0;k<j;k++) s-=L[i][k]*L[j][k];
if(i===j){ if(s<=1e-12) return null; L[i][i]=Math.sqrt(s); }
else L[i][j]=s/L[j][j];
}
return L;
},

gauss2(){
let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
const r=Math.sqrt(-2*Math.log(u));
return [r*Math.cos(2*Math.PI*v), r*Math.sin(2*Math.PI*v)];
},
quantile(sorted,p){
const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}

return suf===''?'US':{PA:'FR',DE:'FR',AS:'FR',MI:'FR',MC:'FR',BR:'FR',L:'UK',T:'JP',HK:'HK',SS:'CN',SZ:'CN',SI:'SG',SW:'CH'}[suf]||null; }
function tzParts(t,tz){ const o={}; new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'})
.formatToParts(new Date(t)).forEach(p=>o[p.type]=p.value); return o; }
function nextOpen(m){ const [tz,op,cl]=MKT_HRS[m], now=Date.now(), p=tzParts(now,tz), wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday), mins=+p.hour*60+ +p.minute;
if(wd>=1&&wd<=5&&mins>=op&&mins<cl) return null;          // ouverte
let add=(wd>=1&&wd<=5&&mins<op)?0:1, w=(wd+add)%7; while(w===0||w===6){ add++; w=(wd+add)%7; }
return now+(add*1440+op-mins)*6e4-(now%6e4); }          // ouverture suivante (jours fériés non pris en compte)
function mktAge(sym,ts){ const m=mktOf(sym); if(!m||!MKT_HRS[m]) return ago(ts); const t=nextOpen(m); if(t==null) return ago(ts);
const d=new Date(t), same=d.toDateString()===new Date().toDateString();
return `<span title="Market closed — last price ${ts?ago(ts):'—'}">closed · reopens ${same?'':d.toLocaleDateString(LOC(),{weekday:'short'})+' '}${d.toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'})}</span>`; }

'Consumer Defensive':'Consumer Staples','Industrials':'Industrials','Communication Services':'Communication Services','Energy':'Energy',
'Utilities':'Utilities','Real Estate':'Real Estate','Basic Materials':'Materials'};
function squarify(items,x,y,w,h){
const out=[], tot=items.reduce((a,b)=>a+b.v,0); if(!tot||w<=0||h<=0) return out;
let rest=items.map(o=>({...o,a:o.v*w*h/tot}));
while(rest.length){
const short=Math.min(w,h)||1, worst=row=>{ const s=row.reduce((a,b)=>a+b.a,0); let mx=0, mn=Infinity; row.forEach(r=>{ mx=Math.max(mx,r.a); mn=Math.min(mn,r.a); });
return Math.max(short*short*mx/(s*s), s*s/(short*short*mn)); };
const row=[rest[0]]; let i=1;
while(i<rest.length&&worst([...row,rest[i]])<=worst(row)){ row.push(rest[i]); i++; }
const s=row.reduce((a,b)=>a+b.a,0);
if(w>=h){ const cw=s/h; let yy=y; row.forEach(r=>{ const rh=r.a/cw; out.push({...r,x,y:yy,w:cw,h:rh}); yy+=rh; }); x+=cw; w-=cw; }
else{ const rh=s/w; let xx=x; row.forEach(r=>{ const rw=r.a/rh; out.push({...r,x:xx,y,w:rw,h:rh}); xx+=rw; }); y+=rh; h-=rh; }
rest=rest.slice(i);
}
return out;
}

function pfSeries(sym,base){

if(c===base) return {map:h.map, ccy:c};
const from=c==='USD'?null:fxLookup(await pfHist(`${c}USD=X`)), to=base==='USD'?null:fxLookup(await pfHist(`${base}USD=X`));

const c=res.indicators.quote[0].close, off=(res.meta&&res.meta.gmtoffset)||0, map=new Map();

/** Analyse d'une allocation : risque historique + projection Monte Carlo.
 wmap = {sym: poids}, wc = poids des liquidités. */
async function pfAnalyze(wmap, wc, P, N){
const syms=Object.keys(wmap).filter(s=>wmap[s]>0);
const base=S.pfccy||'USD', hs=await Promise.all([...syms,PF_BENCH].map(s=>pfSeries(s,base)));
const bench=hs.pop();
const dates=[...bench.map.keys()].filter(d=>hs.every(h=>h.map.has(d))).sort();
if(dates.length<60) throw new Error(`common history too short (${dates.length} sessions)`);
const R=hs.map(h=>{ const a=[]; for(let t=1;t<dates.length;t++) a.push(h.map.get(dates[t])/h.map.get(dates[t-1])-1); return a; });
const Rb=[]; for(let t=1;t<dates.length;t++) Rb.push(bench.map.get(dates[t])/bench.map.get(dates[t-1])-1);
const rf=P.rf/100, mub=P.mub/100, T=Rb.length;
const sg=R.map(r=>Q.volAnn(r)), bt=R.map(r=>Q.beta(r,Rb)), sgb=Q.volAnn(Rb);
// Rendement attendu : MEDAF (rf + β × prime de marché), modifiable ligne à ligne.
const mu=syms.map((s,i)=>P.mu[s]!=null?P.mu[s]/100:rf+bt[i]*(mub-rf));
const w=syms.map(s=>wmap[s]);
// Portefeuille historique, rééquilibré quotidiennement aux poids actuels
const rp=Rb.map((_,t)=>w.reduce((a,wi,i)=>a+wi*R[i][t],0)+wc*rf/252);
let v=1; const curve=[1]; rp.forEach(x=>{ v*=1+x; curve.push(v); });
const yrsH=T/252;
const hist={vol:Q.volAnn(rp)*100, ret:(Math.pow(v,1/yrsH)-1)*100, sharpe:Q.sharpe(rp,rf), sortino:Q.sortino(rp,rf),
mdd:Q.maxDD(curve), var95:Q.varHist(rp), cvar95:Q.cvarHist(rp), beta:Q.beta(rp,Rb), alpha:Q.jensen(rp,Rb,rf),
te:Q.trackingError(rp,Rb), ir:Q.infoRatio(rp,Rb), corr:Q.corr(rp,Rb), from:dates[0], to:dates[dates.length-1], n:T};
// Matrice de corrélation (actifs + indice) ; rétrécie vers l'identité si non définie positive.
const all=[...R,Rb], k=all.length, C=all.map(a=>all.map(b=>a===b?1:Q.corr(a,b)));
let L=null, lam=0;
for(;lam<=0.5&&!L;lam+=0.05) L=Q.chol(C.map((row,i)=>row.map((c,j)=>i===j?1:(1-lam)*c)));
if(!L) throw new Error('correlations unusable');
// Monte Carlo hebdomadaire : n actifs + indice, chocs corrélés par Cholesky.
const yrs=P.yrs, ppy=52, dt=1/ppy, sq=Math.sqrt(dt), steps=Math.round(yrs*ppy);
const sgAll=[...sg,sgb], muAll=[...mu,mub], drift=muAll.map((m,i)=>(m-sgAll[i]**2/2)*dt), rcash=Math.exp(rf*dt)-1;
const fin=[], bfin=[], dds=[]; let sample=null, bsample=null, beat=0, loss=0;
const z=new Float64Array(k), e=new Float64Array(k);
for(let n=0;n<N;n++){
let pv=1, bv=1, peak=1, mdd=0; const keep=n===0, ps=keep?[1]:null, bs=keep?[1]:null;
for(let t=0;t<steps;t++){
for(let i=0;i<k;i+=2){ const g=Q.gauss2(); z[i]=g[0]; if(i+1<k) z[i+1]=g[1]; }
for(let i=0;i<k;i++){ let s=0; for(let j=0;j<=i;j++) s+=L[i][j]*z[j]; e[i]=s; }
let r=wc*rcash;
for(let i=0;i<k-1;i++) r+=w[i]*(Math.exp(drift[i]+sgAll[i]*sq*e[i])-1);
pv*=1+r; bv*=Math.exp(drift[k-1]+sgb*sq*e[k-1]);
if(pv>peak) peak=pv; const d=(peak-pv)/peak; if(d>mdd) mdd=d;
if(keep){ ps.push(pv); bs.push(bv); }
}
if(pv>bv) beat++; if(pv<1) loss++;
fin.push(pv); bfin.push(bv); dds.push(mdd*100);
if(keep){ sample=ps; bsample=bs; }
}
fin.sort((a,b)=>a-b); bfin.sort((a,b)=>a-b); dds.sort((a,b)=>a-b);
const qt=p=>Q.quantile(fin,p);
const mc={med:qt(.5), p10:qt(.1), p90:qt(.9), bmed:Q.quantile(bfin,.5), pLoss:loss/N*100, pBeat:beat/N*100,
ddMed:Q.quantile(dds,.5), dd90:Q.quantile(dds,.9), sample, bsample, N, yrs,
expRet:(w.reduce((a,wi,i)=>a+wi*mu[i],0)+wc*rf)*100};
const divRatio=hist.vol?w.reduce((a,wi,i)=>a+wi*sg[i],0)*100/hist.vol:null;
return {syms, sg, bt, mu, w, hist, mc, shrink:lam-0.05>1e-9?lam-0.05:0, C, R, Rb, dates, wc, divRatio, base, ccys:hs.map(h=>h.ccy)};
}

function pfEvents(rows,B){
const now=Date.now()/1000, day=86400, ev=[], none=[]; let inc=0, incN=0;
rows.filter(e=>e.ok).forEach(e=>{ const F=SNAPSHOT.fundamentals[e.sym]||{}, fx=(e.fx||1)/B; let any=false;
const er=[F.earnStart,F.earnTs,F.earnEnd].filter(t=>t&&t>now-day).sort((a,b)=>a-b)[0];
if(er){ any=true; const rng=F.earnStart&&F.earnEnd&&F.earnEnd-F.earnStart>day;
ev.push({t:er, sym:e.sym, k:'Earnings', d:rng?`window ${dShort(F.earnStart)} – ${dShort(F.earnEnd)}`:(F.earnEst?'estimated date':'confirmed date')}); }
const rate=F.div||F.trailDiv;
if(rate){ inc+=rate*e.qty*fx; incN++; }
if(F.exDiv&&F.exDiv>now-day){ any=true; const amt=F.lastDiv||(rate?rate/4:null);
ev.push({t:F.exDiv, sym:e.sym, k:'Ex-dividend date', d:amt?`≈ ${nf(amt,amt<1?3:2)} ${esc(e.ccy)}/share · ≈ ${nf(amt*e.qty*fx,amt*e.qty*fx<10?2:0)} ${PF_CCYS[S.pfccy]||S.pfccy} for the position`:'amount not published'}); }
if(F.divDate&&F.divDate>now-day&&F.divDate!==F.exDiv){ any=true; ev.push({t:F.divDate, sym:e.sym, k:'Dividend payment', d:'paid to the account'}); }
if(!any) none.push(e.sym+(F.earnTs&&F.earnTs<=now?` (last report ${dShort(F.earnTs)})`:Object.keys(F).length<4?' (not covered)':''));
});
return {ev:ev.sort((a,b)=>a.t-b.t), none, inc, incN};
}

const wc=nav?(S.pfCashUSD??S.cash)/nav:1;
let cur=null, err=null;
if(ok.length){ try{ cur=await pfAnalyze(wmap,wc,P,P.N); }catch(e){ err=e.message; } }
else err='no usable position';
if(S.view!=='pf') return;
// ── Profils types
const profs={};
await Promise.all(Object.entries(PROFILES).map(async([k,pr])=>{ try{ profs[k]=await pfAnalyze(pr.w,0,{...P,mu:{}},1500); }catch(e){ profs[k]={err:e.message}; } }));

/** Score 0–24 → profil, avec deux règles bloquantes (horizon court, faible tolérance aux pertes). */
function clientProfile(c){
if(!c||!c.a||c.a.some(x=>x==null)) return null;
const score=c.a.reduce((s,x)=>s+x,0), flags=[];
let prof=score<=8?'Conservative':score<=16?'Balanced':'Growth';
const cap=p=>{ const o=['Conservative','Balanced','Growth']; if(o.indexOf(prof)>o.indexOf(p)) prof=p; };
if(c.a[0]===0){ cap('Conservative'); flags.push('horizon under 2 years: profile capped at Conservative'); }
if(c.a[2]===0){ cap('Conservative'); flags.push('acceptable loss under 5%: profile capped at Conservative'); }
if(c.a[6]===0){ cap('Conservative'); flags.push('liquidity need within 12 months: profile capped at Conservative'); }
if(c.a[3]===0&&prof==='Growth'){ cap('Balanced'); flags.push('sells on a fall: profile capped at Balanced'); }
if(c.a[4]===0) flags.push('no experience: complex products excluded, extra explanation needed');
return {score, prof, maxLoss:LOSS_TOL[c.a[2]], maxVol:PROFILES[prof].maxVol, flags};
}

const ASSET_CLASS={AGG:'bond',BND:'bond',IEF:'bond',TLT:'bond',IEAG:'bond','AGGH.AS':'bond','EUNA.DE':'bond',
GLD:'gold',IAU:'gold','GC=F':'gold','SGLD.L':'gold','4GLD.DE':'gold','SI=F':'gold',BIL:'cash',SHV:'cash',SGOV:'cash','XEON.DE':'cash'};

async function pfApply(name,nav){
const pr=PROFILES[name]; if(!pr||!nav) return;
if(!confirm(`Replace the portfolio with the ${name} allocation (${nf(nav/(S.pfB||1),0)} ${S.pfccy||'USD'} allocated by profile)?`)) return;
const pos=[]; let used=0;
for(const [s,w] of Object.entries(pr.w)){ const h=await pfHist(s).catch(()=>null); if(!h) continue;
const px=h.meta.regularMarketPrice??h.last, fx=await pfFX(h.meta.currency).catch(()=>1), qty=Math.floor(w*nav/(px*fx)); if(qty>0){ pos.push({sym:s,qty,cost:px}); used+=qty*px*fx; } }
if(!pos.length) return alert('Prices unavailable, please try again.');
S.positions=pos; S.cash=Math.round((nav-used)/(S.pfB||1)*100)/100; S.cashCcy=S.pfccy||'USD'; S.pfp.mu={}; pfSave(); viewPortfolio();
}

function drawMC(p,b,yrs,hv){
const cv=document.getElementById('mccv'); if(!cv||!p) return;
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
cv.width=r.width*dpr; cv.height=200*dpr;
const x=cv.getContext('2d'); x.scale(dpr,dpr);
const W=r.width, H=200, pad=30;
x.clearRect(0,0,W,H);
const all=[...p,...b], mn=Math.min(...all), mx=Math.max(...all);
const X=i=>pad+(i/(p.length-1))*(W-pad-8);
const Y=v=>H-18-((v-mn)/(mx-mn||1))*(H-32);
x.strokeStyle=CT().grid; x.lineWidth=1; if(CT().B){ x.fillStyle='#000'; x.fillRect(0,0,W,H); x.setLineDash([2,3]); }
[0,0.5,1].forEach(f=>{ const v=mn+(mx-mn)*f, y=Y(v);
x.beginPath(); x.moveTo(pad,y); x.lineTo(W-8,y); x.stroke();
x.fillStyle=CT().ax; x.font=CT().f9; x.textAlign='right';
x.fillText('×'+v.toFixed(2), pad-4, y+3); });
const line=(s,c,w)=>{ x.strokeStyle=c; x.lineWidth=w; x.beginPath();
s.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.stroke(); };
x.setLineDash([]);
if(CT().B){ bbgFrame(x,pad,14,W-8,H-18); bbgArea(x,p.map((v,i)=>[X(i),Y(v)]),14,H-18); line(b,'#fb8b1e',1.1);
bbgLegend(x,[['Portfolio','×'+p[p.length-1].toFixed(2),'#fff'],['World index ACWI','×'+b[b.length-1].toFixed(2),'#fb8b1e'],['Sample path over '+yrs+' years','','#000']],pad+6,11); }
else { line(b,'#5b6672',1); line(p,'#6ba3e0',1.4);
x.fillStyle=CT().ax; x.font=CT().f9; x.textAlign='left';
x.fillText('Sample path — portfolio (blue) vs world index ACWI (grey) over '+yrs+' years', pad, 11); }
if(hv){ const i=Math.max(0,Math.min(p.length-1,hv.i)), an=i/(p.length-1)*yrs; x.fillStyle='#fff'; x.fillRect(X(i)-3,Y(p[i])-3,6,6); x.fillStyle=CT().B?'#fb8b1e':'#5b6672'; x.fillRect(X(i)-3,Y(b[i])-3,6,6);
hoverAxes(x,{l:pad,t:14,r:W-8,b:H-18,mx:X(i),my:hv.y,val:null,dat:`year ${nf(an,1)}  ·  portfolio ×${p[i].toFixed(2)}  ·  ACWI ×${b[i].toFixed(2)}`,by:H-8});
const v=mn+(1-(hv.y-14)/(H-32))*(mx-mn); if(hv.y>=14&&hv.y<=H-18){ x.font=CT().fb10; const t='×'+v.toFixed(2), w=x.measureText(t).width+8; x.fillStyle=CT().B?'#fb8b1e':CT().fg; x.fillRect(W-8-w,hv.y-8,w,16); x.fillStyle=CT().B?'#000':CT().bg; x.textAlign='left'; x.fillText(t,W-4-w,hv.y+4); x.strokeStyle=CT().B?'rgba(255,255,255,.45)':'rgba(221,227,234,.4)'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(pad,hv.y); x.lineTo(W-8-w,hv.y); x.stroke(); x.setLineDash([]); } }
cv.style.cursor='crosshair';
cv.onmousemove=ev=>{ const rr=cv.getBoundingClientRect(); drawMC(p,b,yrs,{i:Math.round((ev.clientX-rr.left-pad)/(W-pad-8)*(p.length-1)),y:ev.clientY-rr.top}); };
cv.onmouseleave=()=>drawMC(p,b,yrs);
}

let PIPE_STATUS=null;

async function pingRelay(){ if(!WORKER_URL) return RELAY={ok:false,ms:null,t:Date.now(),err:'not configured'};
if(Date.now()-RELAY.t<5*6e4&&RELAY.ok!==null) return RELAY;
const t0=performance.now(); try{ const r=await fetch(WORKER_URL+'/health',{cache:'no-store'}); RELAY={ok:r.ok,ms:Math.round(performance.now()-t0),t:Date.now(),err:r.ok?null:'HTTP '+r.status}; }
catch(e){ RELAY={ok:false,ms:null,t:Date.now(),err:e.message}; } return RELAY; }
function sourceRows(){
const H=36e5, now=Date.now(), age=ts=>ts?(now-Date.parse(ts))/H:null;
const S30=1.5, SLOW=3, DAY=30;   // GitHub décale souvent les passages programmés : robot rapide en retard au-delà d'1 h 30, robot lent au-delà de 3 h, quotidien au-delà de 30 h
const rows=[
['Prices and news','data.json',LIVE&&LIVE.generated_at,S30,true],
['Catalogue and prices','universe.json',UNIV_TS,S30,true],
['Macro: ECO, WIRP, GC US/euro, BTMM','macro.json',MACRO&&MACRO.generated_at,S30,true],

return rows.map(([l,f,ts,max,crit,opt])=>{ const a=age(ts); const st=!ts?(opt?'absent':'missing'):a>max*4?'stale':a>max?'late':'up to date';
return {l,f,ts,a,st,crit,opt}; }); }
function healthLevel(rows){ if(rows.some(r=>r.crit&&(r.st==='missing'||r.st==='stale'))) return 'down';

<div class="note">"Up to date" = file generated less than 1h30 ago for the fast robot (scheduled every 10 min, often delayed by GitHub), 3h for the slow robot, 30h for daily series. A successful step does not guarantee a new observation: at weekends, files are regenerated with the same closes.</div></div></div>`; }

const t=q.trim().toLowerCase().replace(/^economics:/,''), my=++palSeq;
// 1. Catalogue local (instantané) : ~900 actions, indices, devises, matières premières, taux, crypto

.sort((a,b)=>{ const r=x=>x.s.toLowerCase()===t?0:x.s.toLowerCase().startsWith(t)?1:(x.n||'').toLowerCase().startsWith(t)?2:3; return r(a)-r(b); });

{ const up=q.trim().toUpperCase(), c=parseCmd(q);

function resolveTicker(t){
if(ecoGet(t)) return ecoGet(t).code;
const u=UNIV||[]; if(u.find(x=>x.s===t)||SNAPSHOT.quotes[t]) return t;
const m=u.find(x=>x.c==='Action'&&x.s.split('.')[0]===t); return m?m.s:t;

function parseCmd(q){
const tk=q.toUpperCase().replace(/<GO>/g,' ').split(/[\s,]+/).filter(t=>t&&!['EQUITY','INDEX','CURNCY','COMDTY','GO'].includes(t));
if(!tk.length) return null;
if(tk.length===1&&FUNCS[tk[0]]&&!FUNCS[tk[0]].t) return {f:tk[0]};
let f=null;
if(FUNCS[tk[tk.length-1]]&&FUNCS[tk[tk.length-1]].t) f=tk.pop(); else if(tk[0]==='COMP') f=tk.shift();
if(!f||!tk.length) return null;
const syms=[]; for(let i=0;i<tk.length;i++){ const t=tk[i], nx=tk[i+1];
if(nx&&nx in EXCH&&!t.includes('.')){ syms.push(t+EXCH[nx]); i++; } else syms.push(resolveTicker(t)); }
return FUNCS[f].t===1?{f,sym:syms[0]}:{f,syms:[...new Set(syms)]};

async function resolveRemote(t){
if(!WORKER_URL||KNOWN_SYM(t)) return t;
if(RESOLVE_CACHE.has(t)) return RESOLVE_CACHE.get(t);
let out=t;
try{ const r=await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(t)}`); const d=await r.json();
const qs=(d.quotes||[]).filter(x=>x.symbol&&['EQUITY','ETF','INDEX','CURRENCY','FUTURE','CRYPTOCURRENCY','MUTUALFUND'].includes(x.quoteType));
const exact=qs.find(x=>x.symbol===t); out=exact?exact.symbol:qs[0]?qs[0].symbol:t; }catch(e){}
RESOLVE_CACHE.set(t,out); return out;
}

/** Graphique d'évolution d'une ligne du FA : barres par exercice, valeur au-dessus, variation entre exercices. */
function faChart(o,Y,fmt,W=760){ const B=CT().B, v=o.vals.map(x=>x!=null&&isFinite(x)?x:null), n=v.length, ok=v.filter(x=>x!=null);
const mx=Math.max(0,...ok), mn=Math.min(0,...ok), H=220, pl=10, pr=10, pt=36, pb=mn<0?54:34, sp=(mx-mn)||1, ph=H-pt-pb;
const z=pt+(mx/sp)*ph, slot=(W-pl-pr)/n, bw=Math.min(110,slot*0.5), txt=t=>String(t).replace(/<[^>]+>/g,'');
const col=(x,i)=>x<0?(B?'#ff433d':'#e04a4a'):i===n-1?(B?'#ffffff':'#9cc4ef'):(B?'#3a8dde':'#6ba3e0');
const fg=B?'#e6e6e6':'#c9d1da', mut=B?'#8c8c8c':'#6b7480', hot=B?'#ffb000':'#e8a33d';

g+=`<line x1="${pl}" x2="${W-pr}" y1="${z}" y2="${z}" stroke="${B?'#555':'#3a424c'}"/>`;
v.forEach((x,i)=>{ const cx=pl+slot*(i+.5); g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" fill="${fg}" font-size="12">${esc(fyLabel(Y[i]))}</text>`;
if(x==null){ g+=`<text x="${cx}" y="${z-6}" text-anchor="middle" fill="${mut}" font-size="11">n/a</text>`; return; }
const h=Math.max(1,Math.abs(x)/sp*ph), y=x>=0?z-h:z; g+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" fill="${col(x,i)}"><title>${esc(fyLabel(Y[i]))} : ${esc(txt(fmt(o.t,x)))}</title></rect>`;
g+=`<text x="${cx}" y="${x>=0?y-6:y+h+14}" text-anchor="middle" fill="${fg}" font-size="12" font-weight="600">${esc(txt(fmt(o.t,x)))}</text>`;
const p=i>0?v[i-1]:null; if(p!=null){ const neg=x<0&&p<0;   // sorties de trésorerie (capex, dividendes) : variation du montant versé
const d=o.t==='p'||o.t==='x'?x-p:p!==0?(neg?(x/p-1)*100:(x-p)/Math.abs(p)*100):null;
if(d!=null&&isFinite(d)){ const lab=o.t==='p'?(d>=0?'+':'')+nf(d,1)+' pt':o.t==='x'?(d>=0?'+':'')+nf(d,1)+' x':(d>=0?'+':'')+nf(d,1)+'%';

<div class="mut" style="font-size:10px;margin-top:2px">Top: change from one fiscal year to the next${o.t==='p'?' (in points)':''}${mn<0&&mx===0?' (grey: change in the amount paid)':''}. Latest year in ${B?'white':'light'}, negative values in red.</div>`; }

async function dvdRender(sym){
const box=document.getElementById('sec-dvd'); if(!box||!WORKER_URL) return;
let res;
try{ const r=await fetch(`${WORKER_URL}/chart?s=${encodeURIComponent(ySym(sym))}&range=max&ev=div`); const d=await r.json(); res=d.chart&&d.chart.result&&d.chart.result[0]; if(!res) throw new Error('no data'); }
catch(e){ box.innerHTML=`<h3>DVD — Dividends</h3><div class="note">History unavailable (${esc(e.message)}). If this persists, update the Cloudflare relay (worker.js).</div>`; return; }
if(S.focus!==sym) return;
const ev=Object.values((res.events&&res.events.dividends)||{}).map(x=>({t:x.date*1000,a:x.amount})).sort((a,b)=>a.t-b.t);
const px=res.meta.regularMarketPrice, ccy=res.meta.currency||'';
if(!ev.length){ box.innerHTML=`<h3>DVD — Dividends</h3><div class="note" data-keep="1">${esc(sym)} pays no dividend (no payment in the Yahoo history).</div>`; return; }
const curY=new Date().getFullYear(), byY={}; ev.forEach(x=>{ const y=new Date(x.t).getFullYear(); byY[y]=(byY[y]||0)+x.a; });
const years=Object.keys(byY).map(Number).sort(), full=years.filter(y=>y<curY);
const ttm=ev.filter(x=>x.t>Date.now()-365*864e5).reduce((s,x)=>s+x.a,0), yld=px?ttm/px*100:null;
const freq=ev.filter(x=>x.t>Date.now()-400*864e5).length;   // versements sur ~13 mois
// Hausses consécutives : on compare le versement le plus élevé de chaque année (insensible au calendrier
// de paiement, qui peut faire tomber 3 ou 5 versements dans une même année civile).
// Médiane des versements de l'année : insensible à un dividende exceptionnel ou à une ligne erronée de Yahoo.
const pY={}; ev.forEach(x=>{ const y=new Date(x.t).getFullYear(); (pY[y]=pY[y]||[]).push(x.a); });
const mxY={}; for(const [y,a] of Object.entries(pY)){ const v=[...a].sort((p,q)=>p-q); mxY[y]=v.length%2?v[v.length>>1]:(v[v.length/2-1]+v[v.length/2])/2; }
const ys=Object.keys(mxY).map(Number).sort(); let streak=0;
let ups=0; for(let i=ys.length-1;i>0;i--){ if(ys[i]-ys[i-1]!==1) break; const r=mxY[ys[i]]/mxY[ys[i-1]]; if(r<0.995) break; if(ys[i]!==curY){ streak++; if(r>1.001) ups++; } }
// Croissance sur k années civiles réelles (et non k entrées de la liste : une suspension créerait un faux écart)
const cg=k=>{ const b=full[full.length-1], a=b-k; return byY[a]>0&&byY[b]>0?cagrOf(byY[a],byY[b],k):null; };
box.innerHTML=`<h3>DVD — Dividends<span class="rt">${ev.length} payments since ${new Date(ev[0].t).getFullYear()} · ${esc(ccy)} per share</span></h3>
<div class="statrow">
<div class="stat"><span class="l">YIELD (12M)</span><span class="n">${yld!=null?nf(yld,2)+'%':'—'}</span><span class="s">${nf(ttm,2)} ${esc(ccy)} paid</span></div>
<div class="stat"><span class="l">LAST PAYMENT</span><span class="n">${nf(ev[ev.length-1].a,ev[ev.length-1].a<1?3:2)}</span><span class="s">${new Date(ev[ev.length-1].t).toLocaleDateString(LOC())} · ${freq>=3?'quarterly':freq>=2?'semi-annual':freq>=1?'annual':'irregular'}</span></div>
<div class="stat"><span class="l">5-YEAR GROWTH</span><span class="n ${cls(cg(5))}">${cg(5)!=null?pct(cg(5),1)+'/yr':'—'}</span><span class="s">10 years: ${cg(10)!=null?pct(cg(10),1)+'/yr':'—'}</span></div>
<div class="stat"><span class="l">YEARS WITHOUT A CUT</span><span class="n">${streak} yr${streak>1?'s':''}</span><span class="s">incl. ${ups} increase${ups>1?'s':''}${streak>=25&&ups>=streak*0.8?' · "dividend aristocrat"':streak>=10?' · solid track record':''}</span></div></div>
<div class="pbody" style="position:relative"><canvas id="dvdcv" height="170" role="img" aria-label="Dividendes annuels"></canvas></div>
<div class="note" style="padding:4px 9px 8px">Totals by calendar year; ${curY} in progress (light bar). Gross amounts, adjusted for stock splits by Yahoo.</div>${(()=>{ const g=ev.findIndex((x,i)=>i&&x.t-ev[i-1].t>800*864e5); return g>0?`<div class="warn" style="margin:0 9px 8px">Payments interrupted between ${new Date(ev[g-1].t).getFullYear()} and ${new Date(ev[g].t).getFullYear()}: dividend suspended by the company, or a gap in the Yahoo history. Growth is computed on genuinely comparable years.</div>`:''; })()}`;
const draw=hv=>{ const cv=document.getElementById('dvdcv'); if(!cv) return; const yy=years.slice(-20), r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1, W=r.width, H=170;
cv.width=W*dpr; cv.height=H*dpr; const x=cv.getContext('2d'); x.scale(dpr,dpr); const pl=8, pr=56, pt=10, pb=18, mx=Math.max(...yy.map(y=>byY[y]))*1.1||1;
const bw=(W-pl-pr)/yy.length, Y=v=>pt+(1-v/mx)*(H-pt-pb);
const BB=CT().B; if(BB){ x.fillStyle='#000'; x.fillRect(0,0,W,H); x.setLineDash([2,3]); }
x.font=CT().f9; x.fillStyle=CT().ax; x.strokeStyle=CT().grid;
for(let k=0;k<=3;k++){ const v=mx*k/3, y=Y(v); x.beginPath(); x.moveTo(pl,y); x.lineTo(W-pr,y); x.stroke(); x.textAlign='left'; x.fillText(nf(v,2),W-pr+4,y+3); } x.setLineDash([]); if(BB) bbgFrame(x,pl,pt,W-pr,H-pb);
yy.forEach((y,i)=>{ x.fillStyle=BB?(y===curY?'rgba(58,141,222,.35)':i===hv?'#ffffff':'#3a8dde'):y===curY?'rgba(107,163,224,.35)':i===hv?'#9cc4ef':'#6ba3e0'; const bx=pl+i*bw+bw*0.15; x.fillRect(bx,Y(byY[y]),bw*0.7,H-pb-Y(byY[y]));

cv.onmousemove=ev2=>{ const rr=cv.getBoundingClientRect(), i=Math.floor((ev2.clientX-rr.left-pl)/bw); HY.y=ev2.clientY-rr.top; draw(i>=0&&i<yy.length?i:null); }; cv.onmouseleave=()=>draw(null); };

async function eqsRun(){
const F=EQS.f, num=k=>F[k]===''||F[k]==null?null:parseFloat(F[k]);
const U=new Map((UNIV||[]).map(u=>[u.s,u]));
const ccys=[...new Set(Object.values(SNAPSHOT.fundamentals).map(f=>f&&f.ccy).filter(Boolean).map(normCcy))];
const fx={}; await Promise.all(ccys.map(async c=>{ fx[c]=await pfFX(c).catch(()=>null); }));
const list=[], why={noFund:[],noCap:[],crit:0,missing:0}, ages=[];
// Univers de départ : membres de l'indice choisi (ou tout le catalogue d'actions), pour expliquer les exclusions.
const univ=[...new Set([...(UNIV||[]).filter(u=>u.c==='Action'&&(!F.idx||(u.l||[]).includes(F.idx))).map(u=>u.s),...(F.idx?[]:Object.keys(SNAPSHOT.fundamentals))])];
for(const s of univ){ const f=SNAPSHOT.fundamentals[s]; if(!f||Object.keys(f).length<4) why.noFund.push(s); else if(!f.mcap) why.noCap.push(s); }
for(const [s,f] of Object.entries(SNAPSHOT.fundamentals)){ if(!f||!f.mcap) continue; const u=U.get(s)||{};
if(F.idx&&!(u.l||[]).includes(F.idx)) continue; if(F.sec&&f.sector!==F.sec) continue;
const q=SNAPSHOT.quotes[s], px=q&&q.p!=null?q.p:u.p, rate=fx[normCcy(f.ccy||'USD')];
const cap=rate?f.mcap*rate:null, up=f.target&&px?(f.target/px-1)*100:null;
const r={s,n:f.name||u.n||s,sec:SECT_FR[f.sector]||f.sector||'Unclassified',cap,pe:f.pe,fpe:f.fpe,div:f.divYield,om:f.opMargin,gr:f.revGrowth,roe:f.roe,de:f.debtEq,up,pc:q&&q.pct!=null?q.pct:u.pct};
const ok=(v,min,max)=>(min==null||(v!=null&&v>=min))&&(max==null||(v!=null&&v>0&&v<=max));
if(!ok(cap!=null?cap/1e9:null,num('capMin'),null)||!ok(r.pe,null,num('peMax'))||!ok(r.fpe,null,num('fpeMax'))||!ok(r.div,num('divMin'),null)
||!ok(r.om,num('omMin'),null)||!ok(r.gr,num('grMin'),null)||!ok(r.roe,num('roeMin'),null)||!ok(r.de,null,num('deMax'))||!ok(up,num('upMin'),null)){
// donnée absente pour un critère actif, ou critère non rempli
const act=[['peMax',r.pe],['fpeMax',r.fpe],['divMin',r.div],['omMin',r.om],['grMin',r.gr],['roeMin',r.roe],['deMax',r.de],['upMin',up]].filter(([k])=>num(k)!=null);
if(act.some(([,v])=>v==null)) why.missing++; else why.crit++; continue; }
if(f.ts) ages.push(Date.now()-Date.parse(f.ts)); list.push(r); }
const k=EQS.sort, d=EQS.dir; list.sort((a,b)=>{ const x=a[k], y=b[k]; if(x==null) return 1; if(y==null) return -1; return typeof x==='string'?d*x.localeCompare(y):d*(x-y); });
const cols=[['s','Security'],['sec','Sector'],['cap','Mkt cap ($)'],['pe','P/E'],['fpe','Fwd P/E'],['div','Div. yield'],['om','Op. margin'],['gr','Rev. growth'],['roe','ROE'],['de','Debt/Eq.'],['up','Upside'],['pc','Day chg']];
const fm={cap:v=>big(v),pe:v=>nf(v,1),fpe:v=>nf(v,1),div:v=>nf(v,2)+'%',om:v=>nf(v,1)+'%',gr:v=>pct(v,1),roe:v=>nf(v,1)+'%',de:v=>nf(v,0)+'%',up:v=>pct(v,1),pc:v=>pct(v)};
document.getElementById('eqcount').textContent=`${list.length} securit${list.length>1?'ies':'y'}${list.length>200?' (first 200 shown)':''} · click a header to sort`;
ages.sort((a,b)=>a-b); const hAge=v=>LANG==='fr'?(v<36e5?'moins d\'1 h':v<864e5?Math.round(v/36e5)+' h':Math.round(v/864e5)+' j'):(v<36e5?'under 1h':v<864e5?Math.round(v/36e5)+'h':Math.round(v/864e5)+'d');
const ex=document.getElementById('eqexpl'); if(ex) ex.innerHTML=`<b style="color:var(--txt)">${univ.length} securities${F.idx?' in the '+esc(F.idx):' in the catalogue'}${F.sec?' (sector filtered separately)':''} → ${list.length} selected.</b>
${why.noFund.length?` · <span class="neg">${why.noFund.length} without fundamentals</span> (${why.noFund.slice(0,6).map(esc).join(', ')}${why.noFund.length>6?'…':''})`:''}${why.noCap.length?` · ${why.noCap.length} without market cap`:''}${why.missing?` · ${why.missing} excluded for missing data on a criterion (e.g. no P/E)`:''}${why.crit?` · ${why.crit} do not meet the criteria`:''}.

:'<div class="note">No security passes all filters. Relax a criterion.</div>';
box.querySelectorAll('[data-sort]').forEach(h=>h.onclick=()=>{ const c=h.dataset.sort; EQS.dir=EQS.sort===c?-EQS.dir:(c==='s'||c==='sec'?1:-1); EQS.sort=c; eqsRun(); });
wireSymbolClicks(box);
}

/*── Cohérence des données entre les vues (lot « confiance ») ─────────
1. Un seul cours par titre : le relevé le plus précis (data.json, horodaté à la minute) remplace
   celui du catalogue, pour que carte, fiche, recherche et filtre affichent le même chiffre.
2. Statut de fraîcheur calculé sur l'âge réel du relevé, pas seulement sur le type de source.
3. Rendement du dividende recalculé (dividende ÷ cours) quand les deux sont connus. */
const SUBUNIT=c=>['GBp','GBX','ZAc','ILA'].includes(c);
function ageStatus(st0,ts,cls,sym){
if(!ts||!st0||st0==='SIMULATED'||st0==='SNAPSHOT') return st0;
const t=Date.parse(ts.length===10?ts+'T22:00:00Z':ts); if(!isFinite(t)) return st0;
const h=(Date.now()-t)/36e5, crypto=cls==='Crypto'||/^(BTC|ETH)|-USD$/.test(sym||'');
if(crypto) return h>1.5?(h>48?'STALE':'AGED'):st0;     // cote 24 h/24 : un relevé de plus d'1 h 30 est ancien
if(h>24*4.5) return 'STALE';                          // plus de 4,5 jours : au-delà d'un week-end prolongé
if(st0==='DELAYED_15M'&&h>1.5) return 'AGED';         // annoncé différé mais relevé il y a plus d'1 h 30
return st0;
}

/*── Langue : anglais par défaut ; en français, un dictionnaire (fr.json) traduit le rendu ─────────
   Textes, infobulles (title, aria-label, placeholder), libellés des graphiques et boîtes de dialogue.
   Les nombres et codes (tickers, dates) sont des « jetons » : une phrase connue reste traduite quelles que soient les valeurs. */
const I18N_NUM=/[+\-−±×]?\$?\d[\d\u202f\u00a0.,:\/]*(?:\s?%|[A-Za-z]{0,3}\b)?/g, I18N_CAP=/\b[A-Z][A-Z0-9.\-=^&\/]{1,}\b|\^[A-Z0-9]+/g, I18N_ALL=new RegExp(I18N_NUM.source+'|'+I18N_CAP.source,'g');
function i18nKey(t,caps){ const toks=[]; const key=String(t).replace(caps?I18N_ALL:I18N_NUM,m=>{ toks.push(m); return '\u241F'; }); return {key,toks}; }
let I18N=null; const I18N_DONE=new WeakMap();
function i18n(t){ if(!I18N||t==null) return null; const s=String(t); const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/), core=m[2]; if(!core||!/[A-Za-z]/.test(core)) return null;
let r=I18N.x[core]; if(r==null) for(const [caps,T] of [[false,I18N.t||{}],[true,I18N.c||{}]]){ const k=i18nKey(core,caps), tp=T[k.key]; if(tp!=null){ r=tp.replace(/\{(\d+)\}/g,(_,i)=>k.toks[+i]!=null?k.toks[+i]:''); break; } }
return r==null?null:m[1]+r+m[3]; }
function i18nNode(root){ if(!I18N||!root) return;
const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentNode; if(!p||/^(SCRIPT|STYLE|TEXTAREA|CODE)$/.test(p.nodeName)||p.closest&&p.closest('[data-noi18n]')) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_ACCEPT; }});
let n; while((n=w.nextNode())){ const v=n.nodeValue; if(I18N_DONE.get(n)===v) continue; const r=i18n(v); if(r!=null&&r!==v){ n.nodeValue=r; } I18N_DONE.set(n,n.nodeValue); }
(root.querySelectorAll?root:document).querySelectorAll('[title],[aria-label],[placeholder]').forEach(e=>{ for(const a of ['title','aria-label','placeholder']){ const v=e.getAttribute(a); if(v){ const r=i18n(v); if(r!=null&&r!==v) e.setAttribute(a,r); } } }); }
let I18N_RAF=0;
function i18nStart(){ i18nNode(document.body); document.title=i18n(document.title)||document.title;
new MutationObserver(()=>{ if(I18N_RAF) return; I18N_RAF=requestAnimationFrame(()=>{ I18N_RAF=0; i18nNode(document.body); }); }).observe(document.body,{childList:true,subtree:true,characterData:true});
const P=CanvasRenderingContext2D.prototype, ft=P.fillText, mt=P.measureText;
P.fillText=function(t,...a){ const r=i18n(t); return ft.call(this,r!=null?r:t,...a); };
P.measureText=function(t){ const r=i18n(t); return mt.call(this,r!=null?r:t); };
const al=window.alert.bind(window), cf=window.confirm.bind(window);
window.alert=t=>al(i18n(t)||t); window.confirm=t=>cf(i18n(t)||t); }

{ const b=document.getElementById('langbtn'); if(b){ b.innerHTML=LANG==='fr'?'EN | <b>FR</b>':'<b>EN</b> | FR'; b.setAttribute('data-noi18n','1'); b.onclick=()=>setLang(LANG==='fr'?'en':'fr'); } }

/* Cours directs : le navigateur interroge Yahoo via le relais Cloudflare toutes les 60 s,
   sans attendre le robot GitHub (dont le cron « 30 min » part souvent avec 20 à 60 min de retard). */
let RT_TS=null, RT_BUSY=false;
const RT_SYMS=()=>[...Object.keys(YAHOO_OF),'NVDA','ASTS'];
async function rtOne(sym){
const r=await fetch(`${WORKER_URL}/chart?s=${encodeURIComponent(ySym(sym))}&range=1d`); if(!r.ok) return false;
const d=await r.json(), m=d&&d.chart&&d.chart.result&&d.chart.result[0]&&d.chart.result[0].meta; if(!m||m.regularMarketPrice==null) return false;
const p=+m.regularMarketPrice, prev=m.chartPreviousClose??m.previousClose, t=m.regularMarketTime?new Date(m.regularMarketTime*1000):null;
const old=SNAPSHOT.quotes[sym]||{};
if(old.ts&&t&&Date.parse(old.ts)>t.getTime()+60e3) return false;       // le relevé du robot est plus récent
const age=t?(Date.now()-t.getTime())/6e4:1e9;
const st=age<90?'DELAYED_15M':age<60*24*4?'EOD':'STALE';
const q=Object.assign({},old,{p, st, st0:st, src:'Yahoo Finance via relay (live, 60 s)', ts:t?t.toISOString():old.ts});
// Clôture de référence : celle du robot pour la même séance (Yahoo « chartPreviousClose » diffère pour les devises :
// EURUSD -0,67 % dans le bandeau contre -0,82 % dans les tableaux). Nouvelle séance : celle de Yahoo.
const sameDay=old.ts&&t&&old.prev!=null&&String(old.ts).slice(0,10)===t.toISOString().slice(0,10);
const ref=sameDay?+old.prev:prev!=null?+prev:null;
if(ref){ q.prev=ref; q.chg=p-ref; q.pct=Math.round((p/ref-1)*1e4)/100; }
if(m.regularMarketDayHigh) q.hi=m.regularMarketDayHigh; if(m.regularMarketDayLow) q.lo=m.regularMarketDayLow;
if(m.regularMarketVolume) q.vol=m.regularMarketVolume;
if(Array.isArray(q.h)&&q.h.length) q.h=[...q.h.slice(0,-1),p];
SNAPSHOT.quotes[sym]=q; return true;
}

if(n){ RT_TS=new Date(); DATA.cache.clear(); harmonize(); renderTape();
if(S.view==='mkt'||S.view==='wl'){ const mn=document.getElementById('main'), y=mn?mn.scrollTop:0; await RENDER[S.view](); numberRows(S.view); if(mn) mn.scrollTop=y; }
syncBar(); }
}finally{ RT_BUSY=false; }
}
