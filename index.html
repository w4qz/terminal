${Object.entries(FUNCS).map(([k,v])=>`<tr><th scope="row" class="sym" style="text-align:left">${v.t===1?'&lt;titre&gt; ':v.t===2?'&lt;titres&gt; ':''}${k}</th><td style="text-align:left;white-space:normal">${esc(v.d)}</td><td class="mut" style="text-align:left">${v.t===1?`MC FP ${k}`:v.t===2?'MC RMS KER COMP':k}</td></tr>`).join('')}
</tbody></table>
<h4 style="margin:12px 0 4px;font-size:10px;color:var(--hot)">RACCOURCIS CLAVIER</h4>
<table><tbody>${keys.map(([a,b])=>`<tr><th scope="row" class="sym" style="text-align:left">${a}</th><td style="text-align:left;white-space:normal">${b}</td></tr>`).join('')}</tbody></table>
<div class="note" style="padding:8px 0 0">Suffixes de place Bloomberg acceptés : US, FP (Paris), GY (Francfort), LN (Londres), SW (Suisse), NA (Amsterdam), IM (Milan), SM (Madrid), JT (Tokyo), HK… Un nom courant (TSMC, Hermès) est converti en ticker.</div></div></div>`;
document.body.appendChild(m); m.onclick=e=>{ if(e.target===m) m.remove(); }; document.getElementById('helpx').onclick=()=>m.remove();
}

/*── Cohérence des données entre les vues (lot « confiance ») ─────────
1. Un seul cours par titre : le relevé le plus précis (data.json, horodaté à la minute) remplace
   celui du catalogue, pour que carte, fiche, recherche et filtre affichent le même chiffre.
2. Statut de fraîcheur calculé sur l'âge réel du relevé, pas seulement sur le type de source.
3. Rendement du dividende recalculé (dividende ÷ cours) quand les deux sont connus. */
const SUBUNIT=c=>['GBp','GBX','ZAc','ILA'].includes(c);
function ageStatus(st0,ts,cls,sym){
if(!ts||!st0||st0==='SIMULATED'||st0==='SNAPSHOT') return st0;
const t=Date.parse(ts.length===10?ts+'T22:00:00Z':ts); if(!isFinite(t)) return st0;
const h=(Date.now()-t)/36e5, crypto=cls==='Crypto'||/^(BTC|ETH)|-USD$/.test(sym||'');
if(crypto) return h>1.5?(h>48?'STALE':'AGED'):st0;     // cote 24 h/24 : un relevé de plus d'1 h 30 est ancien
if(h>24*4.5) return 'STALE';                          // plus de 4,5 jours : au-delà d'un week-end prolongé
if(st0==='DELAYED_15M'&&h>1.5) return 'AGED';         // annoncé différé mais relevé il y a plus d'1 h 30
return st0;
}
function harmonize(){
const U=new Map((UNIV||[]).map(u=>[u.s,u]));
for(const [s,q] of Object.entries(SNAPSHOT.quotes)){ if(q.st0===undefined) q.st0=q.st;
const u=U.get(s)||U.get(({SPX:'^GSPC',NDX:'^NDX',DJI:'^DJI',EURUSD:'EURUSD=X',XAU:'GC=F',BTC:'BTC-USD'})[s]);
if(u&&q.p!=null&&q.ts){ u.p=q.p; u.pct=q.pct; u.ts=q.ts; u.st0=q.st0; if(q.h) u.h=q.h; }
const sec=SNAPSHOT.securities.find(x=>x.sym===s); q.st=ageStatus(q.st0,q.ts,sec&&sec.cls,s); }
for(const u of UNIV||[]){ if(u.st0===undefined) u.st0=u.st; if(!u.nw) u.st=ageStatus(u.st0,u.ts,u.c,u.s); }
for(const [s,F] of Object.entries(SNAPSHOT.fundamentals)){ if(!F) continue;
const q=SNAPSHOT.quotes[s], u=U.get(s), px=q&&q.p!=null?q.p:u&&u.p!=null?u.p:null;
if(F.div>0&&px>0){ let y=F.div/px*100; if(SUBUNIT(F.ccy)){ if(y<0.05) y*=100; else if(y>40) y/=100; } if(y>0&&y<40) F.divYield=Math.round(y*1000)/1000; }
else if(F.divYield>40) delete F.divYield; }
// Banques centrales : une série officielle arrêtée ne doit pas passer pour la valeur actuelle.
for(const r of SNAPSHOT.rates||[]){ if(!r.ts) continue; const d=(Date.now()-Date.parse(r.ts+'T12:00:00Z'))/864e5;
if(d>120){ r.st='STALE'; if(!/série arrêtée/.test(r.note||'')) r.note=`⚠ Série arrêtée au ${new Date(r.ts+'T12:00:00').toLocaleDateString('fr-FR')} : valeur probablement dépassée. `+(r.note||''); } }
}
/** Âge lisible d'une date, et alerte si une série dépasse l'ancienneté attendue. */
function staleMark(ts,maxDays){ if(!ts) return ''; const d=(Date.now()-Date.parse(String(ts).slice(0,10)+'T12:00:00Z'))/864e5;
return d>maxDays?` <span class="st st-STALE" title="Dernière donnée au ${esc(String(ts).slice(0,10))} : série interrompue ou très en retard">ancienne</span>`:''; }

/*═══════════════════════════════════════════════════════════════════════
14. NAVIGATION
═══════════════════════════════════════════════════════════════════════*/
const RENDER={mkt:viewMarkets, wl:viewWatchlist, pf:viewPortfolio, macro:viewMacro, srch:viewSearch,
sec:viewSecurity, comp:viewComp, eqs:viewEqs, lp:viewLp, news:viewNews, diag:viewDiag};

const VIEW_LABEL={mkt:'Marchés', wl:'Watchlist', pf:'Portefeuille', macro:'Macro', srch:'Recherche',
sec:'Titre', comp:'Comparer', eqs:'Filtre', lp:'Launchpad', news:'News', diag:'Diagnostic'};

async function go(v){
S.view=v;
document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on', e.id==='v-'+v));
document.querySelectorAll('.navbtn').forEach(b=>{
const active=b.dataset.v===v;
b.classList.toggle('on', active);
if(active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
});
await RENDER[v]();
document.getElementById('main').scrollTop=0;
if(EMBED_FOCUS) focusOnly(EMBED_FOCUS);
syncBar();
const live=document.getElementById('live-status');
if(live) live.textContent='Vue '+VIEW_LABEL[v]+' affichée.';
}
function wireSymbolClicks(root){
root.querySelectorAll('[data-sym]').forEach(e=>{
if(e.tagName==='BUTTON') { e.onclick=ev=>{ ev.stopPropagation(); openSym(e.dataset.sym); }; return; }
e.style.cursor='pointer';
e.onclick=ev=>{ ev.stopPropagation(); openSym(e.dataset.sym); };
e.onkeydown=ev=>{
if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); ev.stopPropagation(); openSym(e.dataset.sym); }
};
});
}
async function syncBar(){
const h=await DATA.health();
document.getElementById('hdot').className='dot '+(h.up?'up':'down');
document.getElementById('hprov').textContent=DATA.current.name;
document.getElementById('hup').textContent=h.up?' — disponible':' — indisponible';
document.getElementById('hccy').textContent=S.ccy;
document.getElementById('hstat').textContent=
LIVE ? 'différées — rafraîchies toutes les 30 min' : 'instantané — non rafraîchissable';
document.getElementById('hmsg').textContent=
S.view==='sec' ? S.focus+' — appuyez sur ⌘K pour changer de titre' : '';
}

/*═══════════════════════════════════════════════════════════════════════
15. HORLOGES
═══════════════════════════════════════════════════════════════════════*/
const ZONES=[['Monaco','Europe/Paris'],['Londres','Europe/London'],['New York','America/New_York'],
['Singapour','Asia/Singapore'],['Tokyo','Asia/Tokyo']];
/* Horloges : bandeau qui défile en boucle (comme les cours). Seules les heures sont mises à jour,
   pour ne pas relancer l'animation chaque seconde. */
function tick(){
const el=document.getElementById('clocks');
if(!el.querySelector('.ctrk')){ const one=ZONES.map(([c,tz])=>`<span>${c} <b data-tz="${tz}"></b></span>`).join('');
el.innerHTML=`<div class="ctrk">${one}${one}</div>`; }
el.querySelectorAll('b[data-tz]').forEach(b=>{ b.textContent=new Date().toLocaleTimeString('fr-FR',{timeZone:b.dataset.tz,hour:'2-digit',minute:'2-digit',hour12:false}); });
}

/* Notes explicatives longues repliées derrière ⓘ (lisibilité) */
function collapseNotes(root){ root.querySelectorAll('.note:not([id]):not([data-nfo]):not([data-keep])').forEach(n=>{ const t=n.textContent.trim();
if(t.length<140||n.closest('.statrow,#pal,form')||/Chargement|Calcul/.test(t)) return;
const d=document.createElement('details'); d.className='nfo'; d.dataset.nfo=1;
d.innerHTML=`<summary>Méthode et sources</summary><p>${n.innerHTML}</p>`; n.replaceWith(d); }); if(EMBED_FOCUS) focusOnly(EMBED_FOCUS); }
new MutationObserver(()=>{ clearTimeout(window.__nfoT); window.__nfoT=setTimeout(()=>collapseNotes(document.getElementById('main')),60); }).observe(document.getElementById('main'),{childList:true,subtree:true});
/*═══════════════════════════════════════════════════════════════════════
16. DÉMARRAGE
═══════════════════════════════════════════════════════════════════════*/
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.getElementById('searchbtn').onclick=openPal;
document.getElementById('pal').onclick=e=>{ if(e.target.id==='pal') closePal(); };
document.getElementById('palin').oninput=e=>palSearch(e.target.value);

document.addEventListener('keydown',e=>{
const open=document.getElementById('pal').classList.contains('on');
if(e.key==='Escape'&&document.getElementById('helpm')){ document.getElementById('helpm').remove(); return; }
if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); open?closePal():openPal(); return; }
if(open){
if(e.key==='Escape') closePal();
else if(e.key==='ArrowDown'){ e.preventDefault(); palMove(1); }
else if(e.key==='ArrowUp'){ e.preventDefault(); palMove(-1); }
else if(e.key==='Enter' && palList[palIdx]) palOpen(palList[palIdx]);
return;
}
if(e.target.tagName==='INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
const map={m:'mkt', w:'wl', p:'pf', e:'macro', r:'srch', s:'sec', c:'comp', f:'eqs', l:'lp', n:'news', d:'diag'};
if(e.key==='/'){ e.preventDefault(); openPal(); return; }
if(e.key==='?'){ e.preventDefault(); openHelp(); return; }
const t=map[e.key.toLowerCase()];
if(t){ e.preventDefault(); go(t); }
});
window.addEventListener('resize',()=>{ if(S.view==='pf'&&S.mc){ drawMC(S.mc.p,S.mc.b,S.mc.yrs); pfRenderPerf(); } if(S.view==='mkt') drawHeatmap(); if(S.view==='comp') drawComp(); if(S.view==='macro') viewMacro(); if(S.view==='sec'){ if(ecoGet(S.focus)) drawEco(); else drawCandles(); } });

tick(); setInterval(tick,1000);
/* Bandeau défilant + thème */
const TAPE=['SPX','NDX','DJI','VIX','CAC','DAX','SX5E','UKX','N225','HSI','EURUSD','USDJPY','GBPUSD','DXY','XAU','CL','BRENT','BTC'];
function renderTape(){ const el=document.getElementById('tape'); if(!el) return;
const it=TAPE.map(s=>{ const q=SNAPSHOT.quotes[s]; if(!q||q.p==null) return ''; const nm=(SNAPSHOT.securities.find(x=>x.sym===s)||{}).name||s;
return `<span class="it" data-tsym="${s}" title="${esc(nm)}"><b>${esc(s)}</b>${npx(q.p,s)} <span class="${cls(q.pct)}">${q.pct!=null?pct(q.pct):''}</span></span>`; }).join('')
+(()=>{ const e=ecoGet('US10Y'); return e?`<span class="it" data-tsym="US10Y"><b>US 10A</b>${nf(e.last,2)} %</span>`:''; })();
el.innerHTML=it?`<div class="trk">${it}${it}</div>`:'';
el.querySelectorAll('[data-tsym]').forEach(x=>x.onclick=()=>{ S.focus=x.dataset.tsym; go('sec'); }); }
renderTape(); setInterval(renderTape,60000);
const THEME_KEY='terminal.theme';
function setTheme(t){ document.body.classList.toggle('amber',t==='amber'); const b=document.getElementById('themebtn');
b.textContent='Thème : '+(t==='amber'?'ambre':'bleu'); b.setAttribute('aria-pressed',t==='amber');
try{ localStorage.setItem(THEME_KEY,t); }catch(e){} if(S.view==='sec'&&!ecoGet(S.focus)) drawCandles(); }
setTheme((()=>{ try{ return localStorage.getItem(THEME_KEY)||'blue'; }catch(e){ return 'blue'; } })());
document.getElementById('helpbtn').onclick=openHelp;
document.getElementById('themebtn').onclick=()=>setTheme(document.body.classList.contains('amber')?'blue':'amber');
const EMBED=new URLSearchParams(location.search);
if(EMBED.get('embed')){ document.body.classList.add('embed'); const c=EMBED.get('cmd')||'WEI';
S.view='mkt'; (async()=>{ // catalogue chargé d'abord : « TTE » doit devenir TTE.PA, pas le certificat américain
await Promise.all([loadUniverse(),loadLive(),loadFund(),loadMacro(),loadEcon(),loadCurves(),loadPeers()].map(p=>p.catch(()=>{}))); harmonize();
if(!/^(BLP)$/i.test(c.trim())) runAny(c); else go('mkt'); })(); }
else go('mkt');
const refresh=()=>Promise.all([loadLive(),loadUniverse(),loadFT(),loadMacro(),loadFund(),loadEcon(),loadPeers(),loadCurves()]).then(([a,b,c,d,e,f,g,h])=>{ harmonize(); renderTape(); if(a||b||c||d||e||f||h){ if(S.view==='srch'){ if(b) renderLocal(); } else go(S.view); } });
refresh();
setInterval(refresh, 10*60*1000);
