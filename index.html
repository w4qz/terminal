<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<style>
:root{
--bg:#000; --surface:#0d0f11; --raised:#15181c; --line:#232830;
--txt:#dde3ea; --txt2:#79838f; --txt3:#4a525c;
--pos:#2fbf6b; --neg:#e04a4a; --hot:#e8a33d; --sel:#1d3a5c;
--mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px;line-height:1.35;
-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
:focus-visible{outline:1px solid #4d8fd6;outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3038}
::-webkit-scrollbar-track{background:transparent}

/* ---------- chrome ---------- */
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:0;height:30px;border-bottom:1px solid var(--line);
background:var(--surface);flex:none;padding-right:10px}
#brand{padding:0 12px;font-weight:700;letter-spacing:2px;font-size:11px;color:var(--txt)}
.navbtn{padding:0 12px;height:30px;font-size:11px;color:var(--txt2);border-right:1px solid var(--line);
display:flex;align-items:center;gap:6px}
.navbtn:first-of-type{border-left:1px solid var(--line)}
.navbtn kbd{font-size:9px;color:var(--txt3);border:1px solid var(--line);padding:0 3px;border-radius:2px}
.navbtn:hover{background:var(--raised);color:var(--txt)}
.navbtn.on{background:var(--raised);color:var(--txt);box-shadow:inset 0 -2px 0 #4d8fd6}
#clocks{margin-left:auto;display:flex;gap:14px;font-size:10px;color:var(--txt2)}
#clocks b{color:var(--txt);font-weight:500}
#searchbtn{margin-left:14px;font-size:10px;color:var(--txt3);border:1px solid var(--line);
padding:2px 8px;border-radius:3px}
#searchbtn:hover{color:var(--txt);border-color:#3a424c}

#main{flex:1;overflow:auto;padding:10px}
.view{display:none}
.view.on{display:block}

/* ---------- grid + panels ---------- */
.g{display:grid;gap:9px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.span2{grid-column:span 2}
@media(max-width:1100px){.g2,.g3,.g23{grid-template-columns:1fr}.span2{grid-column:span 1}}

.pnl{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.pnl>h3{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--txt2);padding:6px 9px;
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.pnl>h3 .rt{margin-left:auto;font-weight:400;letter-spacing:0;color:var(--txt3);font-size:9px}
.pbody{padding:8px 9px;overflow:auto}
.pbody.flush{padding:0}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:9px;font-weight:500;color:var(--txt3);text-align:right;padding:4px 9px;
border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);letter-spacing:.5px}
th:first-child{text-align:left}
td{padding:3px 9px;text-align:right;border-bottom:1px solid #14171b;white-space:nowrap}
td:first-child{text-align:left;color:var(--txt)}
th.symh{text-align:left;color:var(--txt);font-weight:600;font-size:12px;padding:3px 9px;
border-bottom:1px solid #14171b;position:static;letter-spacing:normal;background:none}
tbody tr:hover{background:var(--raised)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:focus-within{background:var(--sel)}
tbody tr:last-child td{border-bottom:none}
.sym{font-weight:600}
.mut{color:var(--txt2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--txt2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- data status ---------- */
.st{font-size:8px;letter-spacing:.5px;padding:0 3px;border-radius:2px;border:1px solid;
vertical-align:middle;margin-left:5px;font-weight:600;white-space:nowrap}
.st-REALTIME{color:var(--pos);border-color:#1e5c39;background:#0d2418}
.st-DELAYED_15M{color:#6ba3e0;border-color:#254a70;background:#0d1a26}
.st-EOD{color:var(--txt2);border-color:var(--line);background:var(--raised)}
.st-SNAPSHOT{color:var(--txt2);border-color:var(--line);background:var(--raised)}
.st-INDICATIVE{color:var(--hot);border-color:#6b4a15;background:#241a08}
.st-SIMULATED{color:#bb98e6;border-color:#4a3268;background:#1a1226}
.st-STALE{color:var(--neg);border-color:#5c2020;background:#240d0d}
.na{color:var(--txt3);font-style:italic}

/* ---------- controls ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:7px 14px;padding:8px 9px;border-bottom:1px solid var(--line);
background:var(--raised)}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f label{font-size:9px;color:var(--txt3);letter-spacing:.5px}
.f input{width:76px;background:var(--bg);border:1px solid var(--line);padding:2px 5px;
font-size:11px;text-align:right;border-radius:2px}
.f input:focus{border-color:#4d8fd6}
.f.w input{width:104px}
.btn{border:1px solid var(--line);padding:3px 11px;font-size:10px;color:var(--txt2);border-radius:2px;
align-self:flex-end;letter-spacing:.5px}
.btn:hover{background:var(--sel);color:var(--txt);border-color:#3a5a7c}
.btn.go{color:var(--txt);border-color:#3a5a7c;background:#132437}

/* ---------- kv rows ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid #14171b}
.kv:last-child{border:none}
.kv .k{color:var(--txt2);font-size:11px}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- big stat ---------- */
.stat{display:flex;flex-direction:column;gap:1px}
.stat .l{font-size:9px;color:var(--txt3);letter-spacing:.5px}
.stat .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .s{font-size:10px;color:var(--txt2)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:14px;
padding:10px 9px;border-bottom:1px solid var(--line)}

/* ---------- news ---------- */
.nw{padding:8px 9px;border-bottom:1px solid #14171b}
.nw:last-child{border:none}
.nw h4{font-size:12px;font-weight:600;margin-bottom:3px}
.nw p{font-size:11px;color:#a4adb8;line-height:1.5;margin-bottom:4px}
.nw .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:9px;color:var(--txt3)}
.nw a{color:#6ba3e0;text-decoration:none}
.nw a:hover,.nw a:focus-visible{text-decoration:underline}
.tag{font-size:9px;border:1px solid var(--line);padding:0 4px;border-radius:2px;color:var(--txt2);cursor:pointer}
.tag:hover,.tag:focus-visible{background:var(--sel);color:var(--txt)}

/* ---------- canvas ---------- */
canvas{display:block;width:100%}

/* ---------- heat ---------- */
.heat td{text-align:center;font-size:10px;padding:4px 6px}
.heat td:first-child{text-align:left;color:var(--txt2)}

/* ---------- palette ---------- */
#pal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:100;
align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.on{display:flex}
#palbox{width:min(600px,92vw);background:var(--surface);border:1px solid #3a424c;
box-shadow:0 20px 60px rgba(0,0,0,.7)}
#palin{width:100%;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
#palres{max-height:46vh;overflow:auto}
.pr{padding:7px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #14171b}
.pr.sel{background:var(--sel)}
.pr .s{font-weight:700;width:74px;flex:none}
.pr .n{color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .c{font-size:9px;color:var(--txt3);border:1px solid var(--line);padding:0 4px;border-radius:2px}
#palhint{padding:6px 14px;font-size:9px;color:var(--txt3);border-top:1px solid var(--line);
display:flex;gap:14px}

/* ---------- status bar ---------- */
#bot{height:24px;border-top:1px solid var(--line);background:var(--surface);display:flex;
align-items:center;gap:16px;padding:0 12px;font-size:10px;color:var(--txt3);flex:none}
#bot .dot{width:6px;height:6px;border-radius:50%;background:var(--txt2);display:inline-block;margin-right:5px}
#bot .dot.up{background:var(--pos)} #bot .dot.down{background:var(--neg)}
#bot b{color:var(--txt2);font-weight:500}
.note{font-size:10px;color:var(--txt2);line-height:1.55;padding:8px 9px}
.warn{border-left:2px solid var(--hot);background:#1a1408;padding:7px 9px;font-size:10px;
color:#c9b183;line-height:1.5}

/* ---------- recherche ---------- */
#sq{width:100%;padding:9px 11px;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:2px}
#sq:focus{border-color:#4d8fd6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:10px;border:1px solid var(--line);padding:2px 8px;border-radius:2px;color:var(--txt2)}
.chip.on{background:var(--sel);color:var(--txt);border-color:#3a5a7c}
.rng{display:flex;gap:4px}
.rng button{font-size:10px;border:1px solid var(--line);padding:1px 7px;border-radius:2px;color:var(--txt2)}
.rng button.on{background:var(--sel);color:var(--txt)}

/* ---------- accessibility helpers ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0,0,0,0);white-space:nowrap;border:0}
#skiplink{position:fixed;top:-40px;left:6px;z-index:200;background:#132437;color:var(--txt);
border:1px solid #3a5a7c;padding:6px 12px;border-radius:2px;font-size:11px;transition:top .12s ease}
#skiplink:focus{top:6px}
[role="button"]:focus-visible,.tag:focus-visible,.pr:focus-visible{outline:1px solid #4d8fd6;outline-offset:1px}
@media (prefers-reduced-motion: reduce){
*{animation-duration:0.001ms !important;animation-iteration-count:1 !important;
transition-duration:0.001ms !important;scroll-behavior:auto !important}
#skiplink{transition:none}
}
</style>
</head>

class SnapshotProvider extends MarketDataProvider{
get name(){ return LIVE ? 'Pipeline GitHub Actions (MAJ '+fmtDT(LIVE.generated_at)+')' : 'Snapshot (actualisé 31/10/2026)'; }
async getQuote(sym){
const q = SNAPSHOT.quotes[sym];
if(!q) return NA;
const meta = SNAPSHOT.securities.find(s=>s.sym===sym);
return {
symbol:sym,
price:dp(q.p,{ts:q.ts,source:q.src,status:q.st,currency:meta?meta.ccy:'USD'}),
change:q.chg!=null?dp(q.chg,{ts:q.ts,source:q.src,status:q.st}):NA,
changePct:q.pct!=null
? dp(q.pct,{ts:q.ts,source:q.src,status:q.intraday?STATUS.INDICATIVE:q.st,unit:'%'})
: NA,
prevClose:q.prev!=null?dp(q.prev,{ts:q.ts,source:q.src,status:STATUS.EOD}):NA,
open:q.open!=null?dp(q.open,{ts:q.ts,source:q.src,status:q.st}):NA,
dayLow:q.lo!=null?dp(q.lo,{ts:q.ts,source:q.src,status:q.st}):NA,
dayHigh:q.hi!=null?dp(q.hi,{ts:q.ts,source:q.src,status:q.st}):NA,
volume:q.vol!=null?dp(q.vol,{ts:q.ts,source:q.src,status:q.st}):NA
};
}
async getFundamentals(sym){
const f = SNAPSHOT.fundamentals[sym];
if(!f) return null;
const wrap = {};
for(const k in f){
if(k==='src'||k==='ts') continue;
wrap[k] = f[k]==null ? NA : dp(f[k],{ts:f.ts,source:f.src,status:STATUS.SNAPSHOT});
}
return wrap;
}
async searchSecurity(q){
const s = q.trim().toLowerCase();
if(!s) return SNAPSHOT.securities.slice(0,12);
return SNAPSHOT.securities.filter(x=>
x.sym.toLowerCase().includes(s) || x.name.toLowerCase().includes(s)
).sort((a,b)=>{
const ax = a.sym.toLowerCase().startsWith(s)?0:1, bx = b.sym.toLowerCase().startsWith(s)?0:1;
return ax-bx;
}).slice(0,12);
}
async getMacroSeries(){ return SNAPSHOT.macro; }
async health(){
if(LIVE) return {up:true, latencyMs:0, rateLimitRemaining:Infinity,
note:'data.json généré le '+fmtDT(LIVE.generated_at)+' par GitHub Actions (toutes les 30 minutes). Prix : Yahoo Finance via yfinance, différés. Taux : FRED. News : flux RSS publics. Synthèse : '+(LIVE.summary?LIVE.summary.model:'désactivée')+'. Les titres en échec gardent leur dernière valeur, marquée Périmé.'};
return {up:true, latencyMs:0, rateLimitRemaining:Infinity,
note:'Source locale, actualisée le 31/10 via les newsletters FT du 20 au 30/10. S&P 500 et Nasdaq 100 à la clôture du 29/10. Nikkei, Hang Seng, FTSE, change, pétrole, or et taux 10 ans US au relevé FT du 30/10. NVDA, ASTS, Dow, Russell, VIX, DXY, TOPIX, Shanghai, STI, DAX, CAC et SX5E non couverts par les newsletters : derniers relevés conservés, marqués Périmé.'};
}
}

/*───────────────────────────────────────────────────────────────────────
2b. Adapters HTTP réels — écrits, inertes tant que le proxy n'est pas
lancé. Ils ne sont PAS appelés depuis le navigateur en direct : CORS les
rejetterait et §6 interdit d'exposer une clé côté client. Ils visent
server/proxy.js, qui porte les clés côté serveur.
───────────────────────────────────────────────────────────────────────*/
class HttpProvider extends MarketDataProvider{
constructor(base='/api'){ super(); this.base=base; this._lat=[]; }
async _get(path, {retries=2, timeoutMs=6000}={}){
let lastErr;
for(let i=0;i<=retries;i++){
const ctrl = new AbortController();
const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
const t0 = performance.now();
try{
const r = await fetch(this.base+path, {signal:ctrl.signal});
clearTimeout(timer);
this._lat.push(performance.now()-t0);
if(r.status===429){ // rate limit → backoff exponentiel
await new Promise(res=>setTimeout(res, 2**i * 800));
lastErr = new Error('rate limit'); continue;
}
if(!r.ok) throw new Error('HTTP '+r.status);
return await r.json();
}catch(e){
clearTimeout(timer);
lastErr = e;
if(i<retries) await new Promise(res=>setTimeout(res, 2**i * 400));
}
}
throw lastErr;
}
async health(){
try{
const h = await this._get('/health',{retries:0,timeoutMs:2500});
const avg = this._lat.length ? this._lat.reduce((a,b)=>a+b,0)/this._lat.length : 0;
return {up:true, latencyMs:Math.round(avg), rateLimitRemaining:h.rateLimitRemaining ?? null};
}catch(e){ return {up:false, latencyMs:null, rateLimitRemaining:null, error:String(e.message)}; }
}
}

/*───────────────────────────────────────────────────────────────────────
2c. Façade — routing, cache TTL, health. L'UI ne parle qu'à ceci.
───────────────────────────────────────────────────────────────────────*/
class ProviderRouter{
constructor(){
this.providers = {snapshot:new SnapshotProvider()};
this.active = 'snapshot';
this.cache = new Map();
this.ttl = {quote:15000, fundamentals:3600000, search:300000};
}
get current(){ return this.providers[this.active]; }
register(key, provider){ this.providers[key] = provider; }
async _cached(kind, key, fn){
const ck = `${this.active}:${kind}:${key}`, now = Date.now();
const hit = this.cache.get(ck);
if(hit && now - hit.t < (this.ttl[kind]||30000)) return hit.v;
const v = await fn();
this.cache.set(ck,{t:now, v});
return v;
}
getQuote(s){ return this._cached('quote', s, ()=>this.current.getQuote(s)); }
getFundamentals(s){ return this._cached('fundamentals', s, ()=>this.current.getFundamentals(s)); }
searchSecurity(q){ return this._cached('search', q, ()=>this.current.searchSecurity(q)); }
health(){ return this.current.health(); }
}
const DATA = new ProviderRouter();

<script>

/*═══════════════════════════════════════════════════════════════════════
3. FORMATAGE
Rend un DataPoint. Une valeur absente s'affiche "n/d" — jamais une
estimation. Un statut absent n'affiche aucun badge.
═══════════════════════════════════════════════════════════════════════*/
const nf = (v,d=2)=>v==null||!isFinite(v)?'—':v.toLocaleString('fr-FR',
{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=2)=>v==null||!isFinite(v)?'—':(v>=0?'+':'')+nf(v,d)+' %';

if(v==null||!isFinite(v)) return '—';
const a=Math.abs(v);
if(a>=1e12) return nf(v/1e12,2)+' T';
if(a>=1e9) return nf(v/1e9,2)+' Md';
if(a>=1e6) return nf(v/1e6,2)+' M';
if(a>=1e3) return nf(v/1e3,1)+' k';
return nf(v,0);
}
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls = v=>v==null?'zero':v>0?'pos':v<0?'neg':'zero';

function badge(status){
if(!status) return '';
return `<span class="st st-${status}" title="${STATUS_LABEL[status]}">${STATUS_LABEL[status]}</span>`;
}
/** Affiche un DataPoint. `f` formate la valeur. */
function V(d, f=x=>nf(x), opts={}){
if(!d || d.na || d.value==null) return '<span class="na">n/d</span>';
const b = opts.badge===false ? '' : badge(d.status);
const t = d.source ? ` title="${esc(d.source)}${d.ts?' — '+esc(d.ts):''}"` : '';
return `<span${t}>${f(d.value)}</span>${b}`;
}
function ago(iso){
if(!iso) return 'horodatage inconnu';
const s = Math.floor((Date.now()-new Date(iso))/1000);
if(s<90) return 'il y a '+s+' s';
if(s<5400) return 'il y a '+Math.floor(s/60)+' min';
if(s<172800) return 'il y a '+Math.floor(s/3600)+' h';
return 'il y a '+Math.floor(s/86400)+' j';
}

/*═══════════════════════════════════════════════════════════════════════
4. MOTEUR QUANTITATIF
Tous les calculs sont réels. Aucune valeur affichée dans les vues
Portefeuille et Valorisation n'est codée en dur.
═══════════════════════════════════════════════════════════════════════*/
const Q = {
mean:a=>a.reduce((x,y)=>x+y,0)/a.length,
std(a){ if(a.length<2) return NaN;
const m=Q.mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); },
cov(a,b){ if(a.length<2) return NaN;
const ma=Q.mean(a), mb=Q.mean(b);
return a.reduce((s,_,i)=>s+(a[i]-ma)*(b[i]-mb),0)/(a.length-1); },
corr(a,b){ const s=Q.std(a)*Q.std(b); return s?Q.cov(a,b)/s:NaN; },
beta(r,m){ const v=Q.cov(m,m); return v?Q.cov(r,m)/v:NaN; },

/** Volatilité annualisée à partir de rendements périodiques. */
volAnn(r,ppy=252){ return Q.std(r)*Math.sqrt(ppy); },

/** CAGR depuis une série de valeurs de portefeuille. */
cagr(series,years){
if(series.length<2||years<=0) return NaN;
const tot = series[series.length-1]/series[0];
return tot<=0?NaN:(Math.pow(tot,1/years)-1)*100;
},
sharpe(r,rf=0,ppy=252){
const s=Q.std(r); if(!s) return NaN;
return (Q.mean(r)-rf/ppy)/s*Math.sqrt(ppy);
},
/** Sortino : ne pénalise que la volatilité baissière. */
sortino(r,rf=0,ppy=252){
const t=rf/ppy, dn=r.filter(x=>x<t).map(x=>(x-t)**2);
if(!dn.length) return Infinity;
const dd=Math.sqrt(dn.reduce((a,b)=>a+b,0)/r.length);
return dd?(Q.mean(r)-t)/dd*Math.sqrt(ppy):NaN;
},
maxDD(series){
let peak=series[0], mx=0;
for(const v of series){ if(v>peak) peak=v; const d=(peak-v)/peak; if(d>mx) mx=d; }
return mx*100;
},
/** VaR historique — quantile empirique, pas d'hypothèse de normalité. */
varHist(r,conf=0.95){
const s=[...r].sort((a,b)=>a-b);
return -s[Math.floor((1-conf)*s.length)]*100;
},
/** CVaR : perte moyenne conditionnelle au-delà de la VaR. */
cvarHist(r,conf=0.95){
const s=[...r].sort((a,b)=>a-b), n=Math.max(1,Math.floor((1-conf)*s.length));
return -Q.mean(s.slice(0,n))*100;
},
/** Alpha de Jensen, annualisé, en points de %. */
jensen(rp,rm,rf=0,ppy=252){
const b=Q.beta(rp,rm);
return ((Q.mean(rp)-rf/ppy) - b*(Q.mean(rm)-rf/ppy))*ppy*100;
},
trackingError(rp,rm,ppy=252){ return Q.volAnn(rp.map((x,i)=>x-rm[i]),ppy)*100; },
infoRatio(rp,rm,ppy=252){
const d=rp.map((x,i)=>x-rm[i]), s=Q.std(d);
return s?Q.mean(d)/s*Math.sqrt(ppy):NaN;
},

/** Cholesky sur matrice de corrélation. Retourne null si non définie positive. */
chol(M){
const n=M.length, L=Array.from({length:n},()=>new Float64Array(n));
for(let i=0;i<n;i++) for(let j=0;j<=i;j++){
let s=M[i][j];
for(let k=0;k<j;k++) s-=L[i][k]*L[j][k];
if(i===j){ if(s<=1e-12) return null; L[i][i]=Math.sqrt(s); }
else L[i][j]=s/L[j][j];
}
return L;
},
/** Deux normales standard indépendantes (Box-Muller). */
gauss2(){
let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
const r=Math.sqrt(-2*Math.log(u));
return [r*Math.cos(2*Math.PI*v), r*Math.sin(2*Math.PI*v)];
},
quantile(sorted,p){
const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}
};

<div class="f"><label for="mrf">Taux sans risque %</label><input id="mrf" type="number" step="0.25" value="3.6"></div>
<div class="f"><label for="mhz">Horizon (années)</label><input id="mhz" type="number" step="1" value="3"></div>
<div class="f"><label for="mpath">Trajectoires</label><input id="mpath" type="number" step="500" value="3000"></div>
<button class="btn go" type="submit" id="mcrun">Lancer</button>
</form>
<div id="mcout" aria-live="polite"></div>
</div>`;
wireSymbolClicks(el);
document.getElementById('mcform').onsubmit = e=>{ e.preventDefault(); runMC(); };
runMC();
}

/*── Monte Carlo : GBM à 3 facteurs (2 actifs + indice) corrélés par Cholesky.
Les corrélations actif/indice sont dérivées des bêtas observés :
ρᵢₘ = βᵢ · σₘ / σᵢ. Sans cela, l'indice serait indépendant du portefeuille
et le bêta, l'alpha, la tracking error et le ratio d'information simulés
seraient dénués de sens. ────────────────────────────────────────────────*/
function runMC(){
const g = id => parseFloat(document.getElementById(id).value);
let w0=g('mw0')/100, w1=g('mw1')/100;
const sum=w0+w1; if(sum>0){ w0/=sum; w1/=sum; } // renormalisation
const mu=[g('mu0')/100,g('mu1')/100], sg=[g('sg0')/100,g('sg1')/100];
const rho01=Math.max(-0.99,Math.min(0.99,g('mrho')));
const mub=g('mub')/100, sgb=g('sgb')/100, rf=g('mrf')/100;
const bt=[g('mb0'),g('mb1')];
const yrs=Math.max(1,g('mhz')), N=Math.max(200,Math.min(20000,g('mpath')));
const steps=Math.round(yrs*252), dt=1/252, sq=Math.sqrt(dt);
const out=document.getElementById('mcout');
const live=document.getElementById('live-status');

// ρᵢₘ = βᵢ σₘ / σᵢ, borné pour rester une corrélation valide
const rm=[0,1].map(i=>{
const r=bt[i]*sgb/sg[i];
return Math.max(-0.99,Math.min(0.99,r));
});

const L=Q.chol([[1,rho01,rm[0]],[rho01,1,rm[1]],[rm[0],rm[1],1]]);
if(!L){
out.innerHTML=`<div class="warn"><b>Jeu d'hypothèses incohérent.</b>
La matrice de corrélation implicite — ρ(actifs) = ${nf(rho01,2)},
ρ(NVDA, indice) = ${nf(rm[0],2)}, ρ(ASTS, indice) = ${nf(rm[1],2)} — n'est pas
définie positive : la décomposition de Cholesky échoue et aucune trajectoire n'est générée.
Concrètement, les bêtas et volatilités saisis décrivent un monde qui ne peut pas exister.
Baissez la corrélation entre actifs, ou réduisez un bêta, ou augmentez une volatilité.
<br><br>Le modèle refuse de produire un chiffre plutôt que d'en produire un faux.</div>`;
if(live) live.textContent='Simulation impossible : hypothèses de corrélation incohérentes.';
return;
}

const finals=[], benchFinals=[], dds=[];
const pRet=[], bRet=[]; // séries appariées pour bêta / alpha / TE / IR
let sampleP=null, sampleB=null;
const drift=[mu[0]-sg[0]**2/2, mu[1]-sg[1]**2/2], driftB=mub-sgb**2/2;

for(let n=0;n<N;n++){
let v=1, b=1, peak=1, mdd=0;
const keep=n===0, ps=keep?[1]:null, bs=keep?[1]:null;
const track=n<40; // 40 trajectoires ≈ 10k points appariés
for(let t=0;t<steps;t++){
const [z1,z2]=Q.gauss2(), [z3]=Q.gauss2();
const e0=L[0][0]*z1;
const e1=L[1][0]*z1+L[1][1]*z2;
const e2=L[2][0]*z1+L[2][1]*z2+L[2][2]*z3; // choc de l'indice, corrélé aux actifs
const r0=Math.exp(drift[0]*dt+sg[0]*sq*e0)-1;
const r1=Math.exp(drift[1]*dt+sg[1]*sq*e1)-1;
const rb=Math.exp(driftB*dt+sgb*sq*e2)-1;
const rp=w0*r0+w1*r1; // rééquilibrage quotidien aux poids cibles
v*=(1+rp); b*=(1+rb);
if(v>peak) peak=v;
const d=(peak-v)/peak; if(d>mdd) mdd=d;
if(track){ pRet.push(rp); bRet.push(rb); }
if(keep){ ps.push(v); bs.push(b); }
}
finals.push(v); benchFinals.push(b); dds.push(mdd*100);
if(keep){ sampleP=ps; sampleB=bs; }
}

const beatCount=finals.filter((x,i)=>x>benchFinals[i]).length; // appariement avant tri
const lossCount=finals.filter(x=>x<1).length;

finals.sort((a,b)=>a-b); benchFinals.sort((a,b)=>a-b); dds.sort((a,b)=>a-b);
const med=Q.quantile(finals,0.5), p10=Q.quantile(finals,0.10), p90=Q.quantile(finals,0.90);
const bmed=Q.quantile(benchFinals,0.5);
const cagr=(Math.pow(med,1/yrs)-1)*100, bcagr=(Math.pow(bmed,1/yrs)-1)*100;
const volP=Q.volAnn(pRet)*100, volB=Q.volAnn(bRet)*100;
const sharpe=Q.sharpe(pRet,rf), sortino=Q.sortino(pRet,rf);
const beta=Q.beta(pRet,bRet), alpha=Q.jensen(pRet,bRet,rf), corrPB=Q.corr(pRet,bRet);
const te=Q.trackingError(pRet,bRet), ir=Q.infoRatio(pRet,bRet);
const varP=Q.varHist(pRet), cvarP=Q.cvarHist(pRet);
const pLoss=lossCount/N*100, pBeat=beatCount/N*100;
const betaTheo=w0*bt[0]+w1*bt[1];

const K=(l,v,c='')=>`<div class="kv"><span class="k">${l}</span><span class="v ${c}">${v}</span></div>`;
out.innerHTML=`
<div class="statrow">
<div class="stat"><span class="l">MÉDIANE À ${yrs} ANS</span><span class="n">×${nf(med,2)}</span>
<span class="s">CAGR ${pct(cagr,1)}</span></div>
<div class="stat"><span class="l">P10 — SCÉNARIO BAS</span><span class="n neg">×${nf(p10,2)}</span>
<span class="s">${pct((Math.pow(p10,1/yrs)-1)*100,1)} par an</span></div>
<div class="stat"><span class="l">P90 — SCÉNARIO HAUT</span><span class="n pos">×${nf(p90,2)}</span>
<span class="s">${pct((Math.pow(p90,1/yrs)-1)*100,1)} par an</span></div>
<div class="stat"><span class="l">INDICE (MÉDIANE)</span><span class="n">×${nf(bmed,2)}</span>
<span class="s">CAGR ${pct(bcagr,1)}</span></div>
<div class="stat"><span class="l">PROBA. DE PERTE</span><span class="n">${nf(pLoss,1)} %</span>
<span class="s">valeur finale sous la mise</span></div>
<div class="stat"><span class="l">BAT L'INDICE</span><span class="n">${nf(pBeat,1)} %</span>
<span class="s">des trajectoires</span></div>
</div>
<canvas id="mccv" height="200" role="img"
aria-label="Trajectoire simulée d'exemple sur ${yrs} ans : le portefeuille termine à un multiple de ${nf(sampleP[sampleP.length-1],2)} contre ${nf(sampleB[sampleB.length-1],2)} pour l'indice. Résumé chiffré complet ci-dessus et ci-dessous."></canvas>
<div class="g g3" style="padding:9px">
<div><div style="font-size:9px;color:var(--txt3);margin-bottom:5px">PERFORMANCE</div>
${K('CAGR médian',pct(cagr,2),cls(cagr))}
${K('Volatilité ann.',nf(volP,1)+' %')}
${K('Ratio de Sharpe',nf(sharpe,2),sharpe>1?'pos':sharpe<0?'neg':'')}
${K('Ratio de Sortino',isFinite(sortino)?nf(sortino,2):'∞')}
</div>
<div><div style="font-size:9px;color:var(--txt3);margin-bottom:5px">RISQUE</div>
${K('Drawdown max médian',nf(Q.quantile(dds,0.5),1)+' %','neg')}
${K('Drawdown max P90',nf(Q.quantile(dds,0.9),1)+' %','neg')}
${K('VaR 95 % (1 jour)',nf(varP,2)+' %','neg')}
${K('CVaR 95 % (1 jour)',nf(cvarP,2)+' %','neg')}
</div>
<div><div style="font-size:9px;color:var(--txt3);margin-bottom:5px">FACE À L'INDICE</div>
${K('Bêta simulé',nf(beta,2))}
${K('Bêta théorique (Σwᵢβᵢ)',nf(betaTheo,2),'mut')}
${K('Alpha de Jensen',pct(alpha,2),cls(alpha))}
${K('Tracking error',nf(te,1)+' %')}
${K('Ratio d\'information',nf(ir,2),cls(ir))}
${K('Corrélation au marché',nf(corrPB,2),'mut')}
</div>
</div>
<div class="warn" style="margin:0 9px 9px">
<b>Ce que ces chiffres sont, et ce qu'ils ne sont pas.</b>
${nf(N,0)} trajectoires, mouvement brownien géométrique à trois facteurs, chocs corrélés par
décomposition de Cholesky, rééquilibrage quotidien. L'indice n'est pas indépendant du portefeuille :
les corrélations actif/marché sont déduites des bêtas (ρ = βσₘ/σᵢ), soit ${nf(rm[0],2)} pour NVDA
et ${nf(rm[1],2)} pour ASTS. C'est ce qui rend le bêta et l'alpha ci-dessus interprétables — le bêta
simulé de ${nf(beta,2)} recoupe le bêta théorique de ${nf(betaTheo,2)}, ce qui valide la simulation.
<br><br>
Les calculs sont exacts. Les <b>hypothèses ne le sont pas</b> : μ et σ sont saisis à la main, jamais
estimés — ce fournisseur ne livre aucune série de prix. Et un GBM suppose des rendements log-normaux
indépendants, ce qui sous-estime structurellement les queues de distribution. Sur ASTS, dont l'amplitude
52 semaines va de 36 $ à 134 $, cette sous-estimation est sévère : traitez le P10 comme un scénario
optimiste, pas comme un plancher. <span class="st st-SIMULATED">Simulé</span>
</div>`;
if(live) live.textContent=`Simulation terminée. Médiane à ${yrs} ans : ×${nf(med,2)}, CAGR ${pct(cagr,1)}. Probabilité de perte ${nf(pLoss,1)} %.`;
drawMC(sampleP,sampleB,yrs);
}

function drawMC(p,b,yrs){
const cv=document.getElementById('mccv'); if(!cv||!p) return;
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
cv.width=r.width*dpr; cv.height=200*dpr;
const x=cv.getContext('2d'); x.scale(dpr,dpr);
const W=r.width, H=200, pad=30;
x.clearRect(0,0,W,H);
const all=[...p,...b], mn=Math.min(...all), mx=Math.max(...all);
const X=i=>pad+(i/(p.length-1))*(W-pad-8);
const Y=v=>H-18-((v-mn)/(mx-mn||1))*(H-32);
x.strokeStyle='#232830'; x.lineWidth=1;
[0,0.5,1].forEach(f=>{ const v=mn+(mx-mn)*f, y=Y(v);
x.beginPath(); x.moveTo(pad,y); x.lineTo(W-8,y); x.stroke();
x.fillStyle='#8a93a0'; x.font='9px monospace'; x.textAlign='right';
x.fillText('×'+v.toFixed(2), pad-4, y+3); });
const line=(s,c,w)=>{ x.strokeStyle=c; x.lineWidth=w; x.beginPath();
s.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.stroke(); };
line(b,'#5b6672',1); line(p,'#6ba3e0',1.4);
x.fillStyle='#8a93a0'; x.font='9px monospace'; x.textAlign='left';
x.fillText('Trajectoire d\'exemple — portefeuille (bleu) contre indice (gris) sur '+yrs+' ans', pad, 11);
}

function dcfValue(p){
const {rev0,g,margin,tax,capex,da,wc,wacc,tg,netDebt,shares}=p;
if(wacc<=tg) return {err:'Le WACC doit être strictement supérieur à la croissance perpétuelle. '+
'Sinon la formule de Gordon donne une valeur terminale infinie ou négative — le modèle n\'a pas de solution.'};
let rev=rev0, pv=0; const rows=[];
for(let y=1;y<=5;y++){
rev*=(1+g);
const ebit=rev*margin, nopat=ebit*(1-tax);
const fcf=nopat + rev*da - rev*capex - rev*wc;
const df=Math.pow(1+wacc,y), d=fcf/df;
pv+=d; rows.push({y,rev,ebit,fcf,df,d});
}
const last=rows[4];
const tv=last.fcf*(1+tg)/(wacc-tg);
const pvTV=tv/Math.pow(1+wacc,5);
const ev=pv+pvTV, eq=ev-netDebt, ps=eq/shares;
return {rows,pv,tv,pvTV,ev,eq,ps,tvShare:pvTV/ev*100};
}

function runDCF(){

capex:g('d_cx')/100, da:g('d_da')/100, wc:g('d_wc')/100,
wacc:g('d_w')/100, tg:g('d_tg')/100, netDebt:g('d_nd'), shares:g('d_sh')};
const px=g('d_px'), out=document.getElementById('dcfout'), r=dcfValue(p);
const live=document.getElementById('live-status');

if(r.err){ out.innerHTML=`<div class="warn">${r.err}</div>`; if(live) live.textContent=r.err; return; }
const up=(r.ps/px-1)*100;

// Sensibilité WACC × croissance perpétuelle
const waccs=[p.wacc-0.02,p.wacc-0.01,p.wacc,p.wacc+0.01,p.wacc+0.02];
const tgs=[p.tg-0.01,p.tg-0.005,p.tg,p.tg+0.005,p.tg+0.01];
let head='<tr><th scope="col">WACC ＼ g∞</th>'+tgs.map(t=>`<th scope="col">${nf(t*100,2)} %</th>`).join('')+'</tr>';
let body='';
for(const w of waccs){
body+=`<tr><th scope="row">${nf(w*100,2)} %</th>`;
for(const t of tgs){
const c=dcfValue({...p,wacc:w,tg:t});
if(c.err){ body+='<td class="na">—</td>'; continue; }
const u=(c.ps/px-1)*100;
const bg=u>0?`rgba(47,191,107,${Math.min(0.32,Math.abs(u)/280)})`
:`rgba(224,74,74,${Math.min(0.32,Math.abs(u)/280)})`;
body+=`<td style="background:${bg}"><b>${nf(c.ps,0)}</b>
<div style="font-size:9px" class="${cls(u)}">${pct(u,0)}</div></td>`;
}
body+='</tr>';
}

const proj=r.rows.map(x=>`<tr><th scope="row" style="font-weight:400;color:var(--txt)">Année ${x.y}</th><td>${big(x.rev*1e6)}</td>

out.innerHTML=`

<div class="stat"><span class="l">VALEUR DES CAPITAUX PROPRES</span><span class="n">${big(r.eq*1e6)}</span></div>
<div class="stat"><span class="l">VALEUR PAR TITRE</span><span class="n">${nf(r.ps)}</span>
<span class="s">contre ${nf(px)} au marché</span></div>
<div class="stat"><span class="l">POTENTIEL</span><span class="n ${cls(up)}">${pct(up,1)}</span></div>
<div class="stat"><span class="l">POIDS DE LA VALEUR TERMINALE</span><span class="n">${nf(r.tvShare,0)} %</span>
<span class="s">de la VE</span></div>
</div>
<div class="g g23" style="padding:9px">
<div class="pnl"><h3>Projection des flux</h3><div class="pbody flush">
<table><caption class="sr-only">Projection des flux de trésorerie</caption><thead><tr><th scope="col">Période</th><th scope="col">CA</th><th scope="col">EBIT</th><th scope="col">FCF</th>
<th scope="col">Facteur</th><th scope="col">FCF actualisé</th></tr></thead><tbody>${proj}
<tr style="border-top:1px solid var(--line)"><th scope="row"><b>Valeur terminale</b></th>
<td colspan="3" class="mut" style="text-align:left">Gordon : FCF₅ × (1+g∞) / (WACC − g∞)</td>
<td class="mut">${nf(1/Math.pow(1+p.wacc,5),3)}</td><td><b>${big(r.pvTV*1e6)}</b></td></tr>
</tbody></table></div></div>
<div class="pnl"><h3>Lecture</h3><div class="pbody">
<div class="note" style="padding:0">
La valeur terminale pèse <b>${nf(r.tvShare,0)} %</b> de la valeur d'entreprise.
${r.tvShare>75?`Au-delà de 75 %, le modèle ne valorise plus vraiment cinq ans de flux : il valorise une
hypothèse de croissance perpétuelle. Le résultat est alors très sensible au couple WACC / g∞ — regardez
la table de sensibilité plutôt que le chiffre central.`
:`Sous 75 %, la valeur repose majoritairement sur des flux explicites, ce qui rend le modèle plus robuste.`}
<br><br>
Un DCF n'est pas un prix cible, c'est un test de cohérence : il révèle quelles hypothèses de croissance et
de marge le cours actuel implique déjà. Si atteindre le cours de marché exige une croissance que vous
jugez irréaliste, c'est l'information utile — pas la valeur par titre.
</div>
</div></div>
<div class="pnl span2"><h3>Sensibilité — WACC contre croissance perpétuelle</h3>
<div class="pbody flush"><table class="heat"><caption class="sr-only">Sensibilité de la valeur par titre au WACC et à la croissance perpétuelle</caption><thead>${head}</thead><tbody>${body}</tbody></table>

affichées et modifiables ci-dessus — aucune n'est masquée dans le code.</div></div></div>
</div>`;
if(live) live.textContent=`Modèle calculé. Valeur par titre ${nf(r.ps)}, potentiel ${pct(up,1)} face au cours de ${nf(px)}.`;
}

function drawSr(pts){
const cv=document.getElementById('srcv'); if(!cv||pts.length<2) return;
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
cv.width=r.width*dpr; cv.height=190*dpr;
const x=cv.getContext('2d'); x.scale(dpr,dpr);
const W=r.width, H=190, pl=46, pb=18;
const vs=pts.map(p=>p[1]), mn=Math.min(...vs), mx=Math.max(...vs);
const X=i=>pl+i/(pts.length-1)*(W-pl-6), Y=v=>8+(1-(v-mn)/(mx-mn||1))*(H-8-pb);
x.strokeStyle='#232830'; x.fillStyle='#8a93a0'; x.font='9px monospace'; x.textAlign='right';
[0,.5,1].forEach(f=>{ const v=mn+(mx-mn)*f, y=Y(v); x.beginPath(); x.moveTo(pl,y); x.lineTo(W-6,y); x.stroke(); x.fillText(nf(v,v>1000?0:2),pl-4,y+3); });
const up=vs[vs.length-1]>=vs[0];
x.strokeStyle=up?'#2fbf6b':'#e04a4a'; x.lineWidth=1.4; x.beginPath();
pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[1])):x.moveTo(X(i),Y(p[1]))); x.stroke();
const d=t=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'});
x.textAlign='left'; x.fillText(d(pts[0][0]),pl,H-4); x.textAlign='right'; x.fillText(d(pts[pts.length-1][0]),W-6,H-4);
}

function fmtMacro(v,f){
if(v==null) return '<span class="na">n/d</span>';
if(f==='%') return nf(v,2)+' %';
if(f==='pb') return nf(v,0)+' pb';
if(f==='k') return (v>0?'+':'')+nf(v,0)+' k';
if(f==='Md') return nf(v,0)+' Md$';
return nf(v, Math.abs(v)>=1000?0:1);
}
function dlt(v,p,f){
if(v==null||p==null) return '<span class="mut">—</span>';
let d=v-p; if(f==='%') d*=100;
const u=f==='%'?' pb':f==='Md'?' Md$':f==='pb'?' pb':'';
if(Math.abs(d)<1e-9) return '<span class="mut">=</span>';
return `<span class="${d>0?'pos':'neg'}">${d>0?'+':''}${nf(d, f==='%'||f==='pb'||f==='Md'?0:1)}${u}</span>`;
}
const dfr=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'});
function viewMacro(){
const el=document.getElementById('v-macro');
if(!MACRO){ el.innerHTML=`<div class="pnl"><div class="note">Les données macro ne sont pas encore générées. Elles apparaîtront après le prochain passage du robot GitHub (fichier <code>macro.json</code>, script <code>build_macro.py</code>).</div></div>`; return; }
const M=MACRO, today=new Date().toISOString().slice(0,10);
// ECO
const prints=(M.eco.prints||[]).map(x=>`<tr><th scope="row" style="font-weight:400;color:var(--txt);text-align:left">${esc(x.k)}</th>
<td style="font-weight:600">${fmtMacro(x.v,x.fmt)}</td><td class="mut">${fmtMacro(x.prev,x.fmt)}</td>
<td class="mut" style="font-size:10px">${esc(x.ts)}</td></tr>`).join('');
const cal=(M.eco.calendar||[]).map(c=>{ const past=c.d<today, now=c.d===today;
return `<tr style="${past?'opacity:.55':''}"><th scope="row" style="font-weight:${now?700:400};color:var(--txt)">${dfr(c.d)}</th>
<td style="text-align:left">${c.imp===3?'<b>':''}${esc(c.ev)}${c.imp===3?'</b>':''} <span class="mut">${esc(c.ctry)}</span></td>
<td class="mut" style="font-size:10px">${past?'publié':now?'<span class="pos">aujourd\'hui</span>':'à venir'}</td></tr>`; }).join('');
// WIRP
const W=M.wirp||{};
const wirp=W.error?`<div class="warn">${esc(W.error)}.${W.range&&W.range[0]!=null?` Fourchette actuelle : ${nf(W.range[0])} – ${nf(W.range[1])} %.`:''}</div>`
:`<div class="statrow" style="border:none;padding:4px 0 10px"><div class="stat"><span class="l">FOURCHETTE FED</span><span class="n">${W.range&&W.range[0]!=null?nf(W.range[0])+' – '+nf(W.range[1])+' %':'n/d'}</span></div>
<div class="stat"><span class="l">EFFR</span><span class="n">${nf(W.effr)} %</span><span class="s">${esc(W.effr_ts||'')}</span></div></div>
<table><caption class="sr-only">Probabilités implicites des réunions de la Fed</caption><thead><tr><th scope="col">Réunion</th><th scope="col">Taux implicite</th><th scope="col">Variation</th><th scope="col" style="text-align:left">Probabilité</th></tr></thead><tbody>
${(W.meetings||[]).map(r=>{ const p=r.p_cut||r.p_hike, cut=r.p_cut>0;
return `<tr><th scope="row" style="font-weight:400;color:var(--txt)">${dfr(r.d)}</th><td>${nf(r.post,3)} %</td>
<td class="${r.move_bp<0?'neg':r.move_bp>0?'pos':'mut'}">${r.move_bp>0?'+':''}${nf(r.move_bp,1)} pb</td>
<td style="text-align:left"><div style="display:flex;align-items:center;gap:6px"><div style="width:90px;height:6px;background:#1a1e23;border-radius:2px"><div style="width:${p}%;height:6px;border-radius:2px;background:${cut?'var(--neg)':'var(--pos)'}"></div></div>
<span style="font-size:10px">${p?nf(p,0)+' % '+(cut?'baisse':'hausse')+' 25 pb':'statu quo'}</span></div></td></tr>`; }).join('')}
</tbody></table><div class="note">${esc(W.src||'')}. Une probabilité de 100 % avec une variation supérieure à 25 pb signale qu'une baisse plus forte, ou plusieurs, est anticipée.</div>`;
// GC
const us=M.gc.us.pts||[], eu=M.gc.eu.pts||[];
const yv=(pts,t)=>{ const p=pts.find(x=>x.t===t); return p&&p.y!=null?p.y:null; };
const slope=(pts,a,b)=>{ const x=yv(pts,a), y=yv(pts,b); return x!=null&&y!=null?(y-x)*100:null; };
const tenors=[...new Set([...us,...eu].map(p=>p.t))];
const gcRows=tenors.map(t=>{ const u=us.find(x=>x.t===t)||{}, e=eu.find(x=>x.t===t)||{};
return `<tr><th scope="row" class="sym">${t}</th><td>${u.y!=null?nf(u.y,2)+' %':'—'}</td><td>${dlt(u.y,u.y1m,'%')}</td>
<td>${e.y!=null?nf(e.y,2)+' %':'—'}</td><td>${dlt(e.y,e.y1m,'%')}</td><td>${u.y!=null&&e.y!=null?nf((u.y-e.y)*100,0)+' pb':'—'}</td></tr>`; }).join('');
// BTMM
const bt=(M.btmm||[]).map(x=>`<tr><th scope="row" style="font-weight:400;color:var(--txt);text-align:left">${esc(x.k)}</th>
<td style="font-weight:600">${fmtMacro(x.v,x.fmt)}</td><td>${dlt(x.v,x.prev,x.fmt)}</td><td class="mut" style="font-size:10px">${esc(x.ts)}</td></tr>`).join('');
el.innerHTML=`<div class="note" style="padding:0 0 8px">Équivalents gratuits des fonctions Bloomberg <b>ECO</b>, <b>WIRP</b>, <b>GC</b> et <b>BTMM</b>. Données du ${fmtDT(M.generated_at)} — FRED, BCE, Federal Reserve, Yahoo. Mise à jour toutes les 30 min.</div>
<div class="g g2">
<div class="pnl"><h3>ECO — Derniers chiffres<span class="rt">dernier · précédent · date</span></h3><div class="pbody flush"><table><caption class="sr-only">Derniers chiffres macroéconomiques</caption><tbody>${prints||'<tr><td class="na">indisponible</td></tr>'}</tbody></table>
<div class="note">Le consensus des économistes n'est pas disponible gratuitement : seuls les chiffres publiés sont affichés.</div></div></div>
<div class="pnl"><h3>ECO — Calendrier<span class="rt">7 jours passés · 4 semaines à venir</span></h3><div class="pbody flush"><table><caption class="sr-only">Calendrier des publications</caption><tbody>${cal||'<tr><td class="na">aucune publication</td></tr>'}</tbody></table></div></div>
<div class="pnl"><h3>WIRP — Probabilités des décisions de la Fed<span class="rt">futures fed funds</span></h3><div class="pbody">${wirp}</div></div>
<div class="pnl"><h3>BTMM — Tableau de bord monétaire US<span class="rt">valeur · variation · date</span></h3><div class="pbody flush"><table><caption class="sr-only">Tableau de bord monétaire</caption><tbody>${bt}</tbody></table></div></div>
<div class="pnl span2"><h3>GC — Courbes des taux<span class="rt">aujourd'hui (trait plein) · il y a 1 mois (pointillés)</span></h3><div class="pbody">
<div class="statrow" style="border:none;padding:0 0 8px">
<div class="stat"><span class="l">US 2S10S</span><span class="n ${cls(slope(us,'2A','10A'))}">${slope(us,'2A','10A')!=null?nf(slope(us,'2A','10A'),0)+' pb':'n/d'}</span></div>
<div class="stat"><span class="l">US 3M10A</span><span class="n ${cls(slope(us,'3M','10A'))}">${slope(us,'3M','10A')!=null?nf(slope(us,'3M','10A'),0)+' pb':'n/d'}</span></div>
<div class="stat"><span class="l">EURO 2S10S</span><span class="n ${cls(slope(eu,'2A','10A'))}">${slope(eu,'2A','10A')!=null?nf(slope(eu,'2A','10A'),0)+' pb':'n/d'}</span></div>
<div class="stat"><span class="l">ÉCART US − EURO 10A</span><span class="n">${yv(us,'10A')!=null&&yv(eu,'10A')!=null?nf((yv(us,'10A')-yv(eu,'10A'))*100,0)+' pb':'n/d'}</span></div></div>
<canvas id="gccv" height="220" role="img" aria-label="Courbes des taux US et zone euro, aujourd'hui et il y a un mois"></canvas>
<table style="margin-top:8px"><caption class="sr-only">Courbes des taux par maturité</caption><thead><tr><th scope="col">Maturité</th><th scope="col">US</th><th scope="col">Var. 1 mois</th><th scope="col">Euro AAA</th><th scope="col">Var. 1 mois</th><th scope="col">Écart US − euro</th></tr></thead><tbody>${gcRows}</tbody></table>
<div class="note">${esc(M.gc.us.src)}. ${esc(M.gc.eu.src)}.</div></div></div>
</div>`;
drawGC(us,eu,tenors);
}
function drawGC(us,eu,tenors){
const cv=document.getElementById('gccv'); if(!cv) return;
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
cv.width=r.width*dpr; cv.height=220*dpr;
const x=cv.getContext('2d'); x.scale(dpr,dpr);
const W=r.width,H=220,pl=40,pb=20;
const all=[...us,...eu].flatMap(p=>[p.y,p.y1m]).filter(v=>v!=null);
if(!all.length) return;
const mn=Math.floor(Math.min(...all)*2)/2, mx=Math.ceil(Math.max(...all)*2)/2;
const X=i=>pl+i/(tenors.length-1)*(W-pl-10), Y=v=>8+(1-(v-mn)/(mx-mn||1))*(H-8-pb);
x.font='9px monospace'; x.fillStyle='#8a93a0'; x.strokeStyle='#232830';
for(let v=mn; v<=mx+1e-9; v+=0.5){ const y=Y(v); x.beginPath(); x.moveTo(pl,y); x.lineTo(W-10,y); x.stroke(); x.textAlign='right'; x.fillText(nf(v,1)+' %',pl-4,y+3); }
x.textAlign='center'; tenors.forEach((t,i)=>x.fillText(t,X(i),H-5));
const line=(pts,key,col,dash)=>{ x.strokeStyle=col; x.lineWidth=1.5; x.setLineDash(dash?[4,4]:[]); x.beginPath(); let st=false;
tenors.forEach((t,i)=>{ const p=pts.find(z=>z.t===t); if(!p||p[key]==null) return; st?x.lineTo(X(i),Y(p[key])):x.moveTo(X(i),Y(p[key])); st=true; }); x.stroke(); x.setLineDash([]); };
line(us,'y1m','#3a5a7c',true); line(eu,'y1m','#7a5a2c',true); line(us,'y','#6ba3e0',false); line(eu,'y','#e8a33d',false);
x.textAlign='left'; x.fillStyle='#6ba3e0'; x.fillText('■ US (Trésor)',pl+6,16); x.fillStyle='#e8a33d'; x.fillText('■ Zone euro AAA',pl+110,16);
}

function palMove(d){

palIdx=(palIdx+d+palList.length)%palList.length;

r.classList.toggle('sel',i===palIdx);
r.setAttribute('aria-selected', i===palIdx ? 'true':'false');
});
document.getElementById('palin').setAttribute('aria-activedescendant','pr-'+palIdx);
const s=document.querySelector('#palres .pr.sel'); if(s) s.scrollIntoView({block:'nearest'});
}

function wireSymbolClicks(root){
root.querySelectorAll('[data-sym]').forEach(e=>{

e.style.cursor='pointer';
e.onclick=ev=>{ ev.stopPropagation(); openSym(e.dataset.sym); };
e.onkeydown=ev=>{
if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); ev.stopPropagation(); openSym(e.dataset.sym); }
};
});
