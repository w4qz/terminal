<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<style>
:root{
--bg:#000; --surface:#0d0f11; --raised:#15181c; --line:#232830;
--txt:#dde3ea; --txt2:#79838f; --txt3:#4a525c;
--pos:#2fbf6b; --neg:#e04a4a; --hot:#e8a33d; --sel:#1d3a5c;
--mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px;line-height:1.35;
-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
:focus-visible{outline:1px solid #4d8fd6;outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3038}
::-webkit-scrollbar-track{background:transparent}

/* ---------- chrome ---------- */
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:0;height:30px;border-bottom:1px solid var(--line);
background:var(--surface);flex:none;padding-right:10px}
#brand{padding:0 12px;font-weight:700;letter-spacing:2px;font-size:11px;color:var(--txt)}
.navbtn{padding:0 9px;white-space:nowrap;height:30px;font-size:11px;color:var(--txt2);border-right:1px solid var(--line);
display:flex;align-items:center;gap:6px}
.navbtn:first-of-type{border-left:1px solid var(--line)}
.navbtn kbd{font-size:9px;color:var(--txt3);border:1px solid var(--line);padding:0 3px;border-radius:2px}
.navbtn:hover{background:var(--raised);color:var(--txt)}
.navbtn.on{background:var(--raised);color:var(--txt);box-shadow:inset 0 -2px 0 #4d8fd6}
#clocks{margin-left:10px;flex:1;min-width:120px;overflow:hidden;font-size:10px;color:var(--txt2);white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
#clocks .ctrk{display:inline-flex;gap:16px;padding-right:16px;animation:tape 40s linear infinite}
#clocks:hover .ctrk{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){#clocks .ctrk{animation:none}}
@media (max-width:1500px){ .navbtn kbd{display:none} }
#clocks b{color:var(--txt);font-weight:500}
#searchbtn{margin-left:14px;font-size:10px;white-space:nowrap;color:var(--txt3);border:1px solid var(--line);
padding:2px 8px;border-radius:3px}
#searchbtn:hover{color:var(--txt);border-color:#3a424c}

#main{flex:1;overflow:auto;padding:10px}
.view{display:none}
.view.on{display:block}

/* ---------- grid + panels ---------- */
.g{display:grid;gap:9px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.span2{grid-column:span 2}
@media(max-width:1100px){.g2,.g3,.g23{grid-template-columns:1fr}.span2{grid-column:span 1}}

.pnl{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.pnl>h3{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--txt2);padding:6px 9px;
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.pnl>h3 .rt{margin-left:auto;font-weight:400;letter-spacing:0;color:var(--txt3);font-size:9px}
.pbody{padding:8px 9px;overflow:auto}
.pbody.flush{padding:0}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:9px;font-weight:500;color:var(--txt3);text-align:right;padding:4px 9px;
border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);letter-spacing:.5px}
th:first-child{text-align:left}
td{padding:3px 9px;text-align:right;border-bottom:1px solid #14171b;white-space:nowrap}
td:first-child{text-align:left;color:var(--txt)}
th.symh{text-align:left;color:var(--txt);font-weight:600;font-size:12px;padding:3px 9px;
border-bottom:1px solid #14171b;position:static;letter-spacing:normal;background:none}
tbody tr:hover{background:var(--raised)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:focus-within{background:var(--sel)}
tbody tr:last-child td{border-bottom:none}
.sym{font-weight:600}
.mut{color:var(--txt2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--txt2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- data status ---------- */
.st{font-size:8px;letter-spacing:.5px;padding:0 3px;border-radius:2px;border:1px solid;
vertical-align:middle;margin-left:5px;font-weight:600;white-space:nowrap}
.st-REALTIME{color:var(--pos);border-color:#1e5c39;background:#0d2418}
.st-DELAYED_15M{color:#6ba3e0;border-color:#254a70;background:#0d1a26}
.st-EOD{color:var(--txt2);border-color:var(--line);background:var(--raised)}
.st-SNAPSHOT{color:var(--txt2);border-color:var(--line);background:var(--raised)}
.st-INDICATIVE{color:var(--hot);border-color:#6b4a15;background:#241a08}
.st-SIMULATED{color:#bb98e6;border-color:#4a3268;background:#1a1226}
.st-STALE{color:var(--neg);border-color:#5c2020;background:#240d0d}
.st-AGED{color:var(--hot);border-color:#6b4a15;background:#241a08}
.na{color:var(--txt3);font-style:italic}

/* ---------- controls ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:7px 14px;padding:8px 9px;border-bottom:1px solid var(--line);
background:var(--raised)}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f label{font-size:9px;color:var(--txt3);letter-spacing:.5px}
.f input{width:76px;background:var(--bg);border:1px solid var(--line);padding:2px 5px;
font-size:11px;text-align:right;border-radius:2px}
.f input:focus{border-color:#4d8fd6}
.f.w input{width:104px}
.btn{border:1px solid var(--line);padding:3px 11px;font-size:10px;color:var(--txt2);border-radius:2px;
align-self:flex-end;letter-spacing:.5px}
.btn:hover{background:var(--sel);color:var(--txt);border-color:#3a5a7c}
.btn.go{color:var(--txt);border-color:#3a5a7c;background:#132437}

/* ---------- kv rows ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid #14171b}
.kv:last-child{border:none}
.kv .k{color:var(--txt2);font-size:11px}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- big stat ---------- */
.stat{display:flex;flex-direction:column;gap:1px}
.stat .l{font-size:9px;color:var(--txt3);letter-spacing:.5px}
.stat .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .s{font-size:10px;color:var(--txt2)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:14px;
padding:10px 9px;border-bottom:1px solid var(--line)}

/* ---------- news ---------- */
.nw{padding:8px 9px;border-bottom:1px solid #14171b}
.nw:last-child{border:none}
.nw h4{font-size:12px;font-weight:600;margin-bottom:3px}
.nw p{font-size:11px;color:#a4adb8;line-height:1.5;margin-bottom:4px}
.nw .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:9px;color:var(--txt3)}
.nw a{color:#6ba3e0;text-decoration:none}
.nw a:hover,.nw a:focus-visible{text-decoration:underline}
.tag{font-size:9px;border:1px solid var(--line);padding:0 4px;border-radius:2px;color:var(--txt2);cursor:pointer}
.tag:hover,.tag:focus-visible{background:var(--sel);color:var(--txt)}

/* ---------- canvas ---------- */
canvas{display:block;width:100%}

/* ---------- heat ---------- */
.heat td{text-align:center;font-size:10px;padding:4px 6px}
.heat td:first-child{text-align:left;color:var(--txt2)}

/* ---------- palette ---------- */
#pal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:100;
align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.on{display:flex}
#palbox{width:min(600px,92vw);background:var(--surface);border:1px solid #3a424c;
box-shadow:0 20px 60px rgba(0,0,0,.7)}
#palin{width:100%;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
#palres{max-height:46vh;overflow:auto}
.pr{padding:7px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #14171b}
.pr.sel{background:var(--sel)}
.pr .s{font-weight:700;width:74px;flex:none}
.pr .n{color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .c{font-size:9px;color:var(--txt3);border:1px solid var(--line);padding:0 4px;border-radius:2px}
#palhint{padding:6px 14px;font-size:9px;color:var(--txt3);border-top:1px solid var(--line);
display:flex;gap:14px}

/* ---------- status bar ---------- */
#bot{height:24px;border-top:1px solid var(--line);background:var(--surface);display:flex;
align-items:center;gap:16px;padding:0 12px;font-size:10px;color:var(--txt3);flex:none}
#bot .dot{width:6px;height:6px;border-radius:50%;background:var(--txt2);display:inline-block;margin-right:5px}
#bot .dot.up{background:var(--pos)} #bot .dot.down{background:var(--neg)}
#bot b{color:var(--txt2);font-weight:500}
.note{font-size:10px;color:var(--txt2);line-height:1.55;padding:8px 9px}
.warn{border-left:2px solid var(--hot);background:#1a1408;padding:7px 9px;font-size:10px;
color:#c9b183;line-height:1.5}

/* ---------- recherche ---------- */
#sq{width:100%;padding:9px 11px;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:2px}
#sq:focus{border-color:#4d8fd6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:10px;border:1px solid var(--line);padding:2px 8px;border-radius:2px;color:var(--txt2)}
.chip.on{background:var(--sel);color:var(--txt);border-color:#3a5a7c}
.rng{display:flex;gap:4px}
.rng button{font-size:10px;border:1px solid var(--line);padding:1px 7px;border-radius:2px;color:var(--txt2)}
.rng button.on{background:var(--sel);color:var(--txt)}

/* ---------- accessibility helpers ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0,0,0,0);white-space:nowrap;border:0}
#skiplink{position:fixed;top:-40px;left:6px;z-index:200;background:#132437;color:var(--txt);
border:1px solid #3a5a7c;padding:6px 12px;border-radius:2px;font-size:11px;transition:top .12s ease}
#skiplink:focus{top:6px}
[role="button"]:focus-visible,.tag:focus-visible,.pr:focus-visible{outline:1px solid #4d8fd6;outline-offset:1px}
@media (prefers-reduced-motion: reduce){
*{animation-duration:0.001ms !important;animation-iteration-count:1 !important;
transition-duration:0.001ms !important;scroll-behavior:auto !important}
#skiplink{transition:none}
}

/* ---------- v2 : lisibilité ---------- */
:root{--txt2:#9ba5b1;--txt3:#6c7783}
th{font-size:10px;letter-spacing:.3px}
tbody th{color:var(--txt)}
.stat .l{font-size:10px}
.kv .k{font-size:11.5px}
#main>.view{max-width:1640px;margin:0 auto}
details.nfo{padding:6px 9px;font-size:10px;color:var(--txt2)}
details.nfo summary{cursor:pointer;color:var(--txt3);list-style:none;user-select:none}
details.nfo summary::before{content:'ⓘ ';color:#4d8fd6}
details.nfo[open] summary{margin-bottom:4px}
details.nfo p{line-height:1.55}
#secbar{position:sticky;top:-10px;z-index:20;margin:-10px -10px 9px;padding:7px 12px;background:rgba(13,15,17,.97);
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
#secbar .t{font-weight:700;font-size:15px;color:var(--hot)}
#secbar .px{font-size:15px;font-weight:600}
#secbar .nm{color:var(--txt2);font-size:11px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#secbar nav{margin-left:auto;display:flex;gap:2px}
#secbar nav button{font-size:10px;padding:3px 9px;border:1px solid var(--line);color:var(--txt2);letter-spacing:.5px}
#secbar nav button:hover{background:var(--sel);color:var(--txt);border-color:#3a5a7c}

/* ---------- bandeau défilant des cours ---------- */
#tape{flex:none;height:22px;overflow:hidden;border-bottom:1px solid var(--line);background:#07090b;position:relative;font-size:11px}
#tape .trk{display:inline-flex;white-space:nowrap;animation:tape 90s linear infinite;line-height:22px}
#tape:hover .trk{animation-play-state:paused}
#tape .it{padding:0 14px;cursor:pointer;border-right:1px solid #14171b}
#tape .it:hover{background:var(--raised)}
#tape .it b{color:var(--hot);font-weight:600;margin-right:6px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#tape .trk{animation:none}}
#helpbtn{margin-left:8px;width:20px;height:20px;font-size:11px;color:var(--txt3);border:1px solid var(--line);border-radius:50%;flex:none}
#helpbtn:hover{color:var(--txt)}
#helpm{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center}
#helpm .hbox{background:var(--surface);border:1px solid var(--line);width:min(900px,92vw)}
#helpm h3{display:flex;justify-content:space-between;padding:7px 10px;font-size:11px;letter-spacing:1px;border-bottom:1px solid var(--line)}
#themebtn{margin-left:6px;flex:none;font-size:10px;color:var(--txt3);border:1px solid var(--line);padding:2px 8px;border-radius:3px;white-space:nowrap}
#themebtn:hover{color:var(--txt)}
/* ---------- thème ambre façon Bloomberg ---------- */
body.amber{--bg:#000;--surface:#050505;--raised:#111;--line:#2a2210;--txt:#ffb000;--txt2:#d9962a;--txt3:#9c6d1e;--sel:#3d2a00;--hot:#ff6a00}
body.amber td,body.amber .stat .n,body.amber .kv .v,body.amber #clocks b{color:#f2f2f2}
body.amber td.pos,body.amber .n.pos,body.amber .v.pos,body.amber .pos{color:#3ddc6a}
body.amber td.neg,body.amber .n.neg,body.amber .v.neg,body.amber .neg{color:#ff4d4d}
body.amber .navbtn.on{box-shadow:inset 0 -2px 0 #ff6a00;color:#ffb000}
body.amber .pnl h3{color:#ffb000;background:#140d00}
body.amber .btn.go,body.amber .rng button.on{background:#3d2a00;border-color:#8a5a00;color:#ffcf66}
body.amber #secbar .t{color:#ff6a00}
body.amber #tape .it b{color:#ffb000}

/* ---------- mode intégré (panneau du Launchpad) ---------- */
body.embed #top,body.embed #tape,body.embed #bot{display:none}
body.embed #main{padding:6px}
body.embed #secbar{top:-6px;margin:-6px -6px 6px}

/* badge de statut sous le chiffre dans les cartouches (évite le chevauchement en panneau étroit) */
.stat .n .st{display:block;width:max-content;margin:3px 0 0;font-size:8px}
.stat{min-width:0}
</style>
</head>
<body>

<a href="#main" id="skiplink">Aller au contenu principal</a>

<div id="app">
<div id="top">
<div id="brand">TERMINAL</div>
<nav aria-label="Navigation principale" style="display:flex;height:100%">
<button class="navbtn on" data-v="mkt" aria-current="page">Marchés <kbd aria-hidden="true">M</kbd><span class="sr-only">(raccourci M)</span></button>
<button class="navbtn" data-v="wl">Watchlist <kbd aria-hidden="true">W</kbd><span class="sr-only">(raccourci W)</span></button>
<button class="navbtn" data-v="pf">Portefeuille <kbd aria-hidden="true">P</kbd><span class="sr-only">(raccourci P)</span></button>
<button class="navbtn" data-v="macro">Macro <kbd aria-hidden="true">E</kbd><span class="sr-only">(raccourci E)</span></button>
<button class="navbtn" data-v="srch">Recherche <kbd aria-hidden="true">R</kbd><span class="sr-only">(raccourci R)</span></button>
<button class="navbtn" data-v="sec">Titre <kbd aria-hidden="true">S</kbd><span class="sr-only">(raccourci S)</span></button>
<button class="navbtn" data-v="comp">Comparer <kbd aria-hidden="true">C</kbd><span class="sr-only">(raccourci C)</span></button>
<button class="navbtn" data-v="eqs">Filtre <kbd aria-hidden="true">F</kbd><span class="sr-only">(raccourci F)</span></button>
<button class="navbtn" data-v="news">News <kbd aria-hidden="true">N</kbd><span class="sr-only">(raccourci N)</span></button>
<button class="navbtn" data-v="lp">Launchpad <kbd aria-hidden="true">L</kbd><span class="sr-only">(raccourci L)</span></button>
<button class="navbtn" data-v="diag">Diagnostic <kbd aria-hidden="true">D</kbd><span class="sr-only">(raccourci D)</span></button>
</nav>
<button id="searchbtn" aria-haspopup="dialog" title="Titre ou commande Bloomberg : MC FP GP, AAPL RV, ECO, HELP">⌘K Commande</button>
<button id="helpbtn" type="button" title="Aide : liste des fonctions (touche ?)" aria-label="Aide">?</button>
<button id="themebtn" type="button" aria-pressed="false" title="Basculer le thème">Thème : bleu</button>
<div id="clocks" aria-label="Horloges des places de marché"></div>
</div>
<div id="tape" aria-label="Bandeau des cours"></div>

<main id="main" tabindex="-1">
<div class="view on" id="v-mkt" role="tabpanel" aria-label="Marchés"></div>
<div class="view" id="v-wl" role="tabpanel" aria-label="Watchlist"></div>
<div class="view" id="v-pf" role="tabpanel" aria-label="Portefeuille"></div>
<div class="view" id="v-macro" role="tabpanel" aria-label="Macro"></div>
<div class="view" id="v-srch" role="tabpanel" aria-label="Recherche"></div>
<div class="view" id="v-sec" role="tabpanel" aria-label="Titre"></div>
<div class="view" id="v-comp" role="tabpanel" aria-label="Comparer"></div>
<div class="view" id="v-eqs" role="tabpanel" aria-label="Filtre d'actions"></div>
<div class="view" id="v-news" role="tabpanel" aria-label="News"></div>
<div class="view" id="v-lp" role="tabpanel" aria-label="Launchpad"></div>
<div class="view" id="v-diag" role="tabpanel" aria-label="Diagnostic"></div>
</main>

<div id="bot">
<span><span class="dot" id="hdot" aria-hidden="true"></span><b id="hprov">—</b><span id="hup" class="sr-only"></span></span>
<span>Devise <b id="hccy">USD</b></span>
<span>Données <b id="hstat">—</b></span>
<span id="hmsg" style="margin-left:auto" aria-live="polite"></span>
</div>
</div>

<div id="pal" role="dialog" aria-modal="true" aria-label="Rechercher un titre">
<div id="palbox">
<label for="palin" class="sr-only">Rechercher un titre par ticker, nom, indice ou devise</label>
<input id="palin" placeholder="Titre ou commande Bloomberg : MC FP GP · AAPL RV · MC RMS KER COMP · ECO · HELP" autocomplete="off" spellcheck="false"
role="combobox" aria-expanded="true" aria-controls="palres" aria-autocomplete="list">
<div id="palres" role="listbox" aria-label="Résultats de recherche"></div>
<div id="palhint"><span>↑↓ naviguer</span><span>↵ exécuter</span><span>esc fermer</span><span>HELP : liste des fonctions</span><span>/ ou ⌘K : ouvrir</span></div>
</div></div>

<div id="live-status" class="sr-only" role="status" aria-live="polite"></div>

<script>
"use strict";
/*═══════════════════════════════════════════════════════════════════════
1. MODÈLE DE DONNÉE
Toute valeur qui atteint l'UI est un DataPoint. Un nombre nu ne peut pas
traverser cette couche — c'est ce qui rend le statut de donnée structurel
et non déclaratif.
═══════════════════════════════════════════════════════════════════════*/
const STATUS = {
REALTIME:'REALTIME', DELAYED_15M:'DELAYED_15M', EOD:'EOD',
SNAPSHOT:'SNAPSHOT', INDICATIVE:'INDICATIVE', SIMULATED:'SIMULATED', STALE:'STALE', AGED:'AGED'
};
const STATUS_LABEL = {
REALTIME:'Temps réel', DELAYED_15M:'Différé 15 min', EOD:'Clôture',
SNAPSHOT:'Instantané', INDICATIVE:'Indicatif', SIMULATED:'Simulé', STALE:'Périmé', AGED:'Relevé ancien'
};

function dp(value, {ts, source, status, currency='USD', unit=null}={}){
return {value, ts, source, status, currency, unit, __dp:true};
}
const NA = Object.freeze({value:null, ts:null, source:null, status:null, __dp:true, na:true});

/*═══════════════════════════════════════════════════════════════════════
2. COUCHE PROVIDER
Interface unique. L'UI ignore quel provider la sert.
═══════════════════════════════════════════════════════════════════════*/
class MarketDataProvider{
get name(){ throw new Error('not implemented'); }
async getQuote(){ throw new Error('not implemented'); }
async getFundamentals(){ throw new Error('not implemented'); }
async searchSecurity(){ throw new Error('not implemented'); }
async getMacroSeries(){ throw new Error('not implemented'); }
async health(){ throw new Error('not implemented'); }
}

/*───────────────────────────────────────────────────────────────────────
2a. SnapshotProvider — actif par défaut.
Sert des données vérifiées, horodatées et sourcées, capturées le
31/08/2026. Ne prétend jamais être du temps réel : chaque champ porte
son statut réel et son horodatage d'origine.
───────────────────────────────────────────────────────────────────────*/
const SNAP_TS = '2026-09-16T20:00:00Z';
const SA = 'StockAnalysis.com / CBOE';

class SnapshotProvider extends MarketDataProvider{
get name(){ return LIVE ? 'Pipeline GitHub Actions (MAJ '+fmtDT(LIVE.generated_at)+')' : 'Snapshot (actualisé 31/10/2026)'; }
async getQuote(sym){
const q = SNAPSHOT.quotes[sym];
if(!q) return NA;
const meta = SNAPSHOT.securities.find(s=>s.sym===sym);
return {
symbol:sym,
price:dp(q.p,{ts:q.ts,source:q.src,status:q.st,currency:meta?meta.ccy:'USD'}),
change:q.chg!=null?dp(q.chg,{ts:q.ts,source:q.src,status:q.st}):NA,
changePct:q.pct!=null
? dp(q.pct,{ts:q.ts,source:q.src,status:q.intraday?STATUS.INDICATIVE:q.st,unit:'%'})
: NA,
prevClose:q.prev!=null?dp(q.prev,{ts:q.ts,source:q.src,status:STATUS.EOD}):NA,
open:q.open!=null?dp(q.open,{ts:q.ts,source:q.src,status:q.st}):NA,
dayLow:q.lo!=null?dp(q.lo,{ts:q.ts,source:q.src,status:q.st}):NA,
dayHigh:q.hi!=null?dp(q.hi,{ts:q.ts,source:q.src,status:q.st}):NA,
volume:q.vol!=null?dp(q.vol,{ts:q.ts,source:q.src,status:q.st}):NA
};
}
async getFundamentals(sym){
const f = SNAPSHOT.fundamentals[sym];
if(!f) return null;
const wrap = {};
for(const k in f){
if(k==='src'||k==='ts') continue;
wrap[k] = f[k]==null ? NA : dp(f[k],{ts:f.ts,source:f.src,status:STATUS.SNAPSHOT});
}
return wrap;
}
async searchSecurity(q){
const s = q.trim().toLowerCase();
if(!s) return SNAPSHOT.securities.slice(0,12);
return SNAPSHOT.securities.filter(x=>
x.sym.toLowerCase().includes(s) || x.name.toLowerCase().includes(s)
).sort((a,b)=>{
const ax = a.sym.toLowerCase().startsWith(s)?0:1, bx = b.sym.toLowerCase().startsWith(s)?0:1;
return ax-bx;
}).slice(0,12);
}
async getMacroSeries(){ return SNAPSHOT.macro; }
async health(){
if(LIVE) return {up:true, latencyMs:0, rateLimitRemaining:Infinity,
note:'data.json généré le '+fmtDT(LIVE.generated_at)+' par GitHub Actions (toutes les 30 minutes). Prix : Yahoo Finance via yfinance, différés. Taux : FRED. News : flux RSS publics. Synthèse : '+(LIVE.summary?LIVE.summary.model:'désactivée')+'. Les titres en échec gardent leur dernière valeur, marquée Périmé.'};
return {up:true, latencyMs:0, rateLimitRemaining:Infinity,
note:'Source locale, actualisée le 31/10 via les newsletters FT du 20 au 30/10. S&P 500 et Nasdaq 100 à la clôture du 29/10. Nikkei, Hang Seng, FTSE, change, pétrole, or et taux 10 ans US au relevé FT du 30/10. NVDA, ASTS, Dow, Russell, VIX, DXY, TOPIX, Shanghai, STI, DAX, CAC et SX5E non couverts par les newsletters : derniers relevés conservés, marqués Périmé.'};
}
}

class HttpProvider extends MarketDataProvider{
constructor(base='/api'){ super(); this.base=base; this._lat=[]; }
async _get(path, {retries=2, timeoutMs=6000}={}){
let lastErr;
for(let i=0;i<=retries;i++){
const ctrl = new AbortController();
const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
const t0 = performance.now();
try{
const r = await fetch(this.base+path, {signal:ctrl.signal});
clearTimeout(timer);
this._lat.push(performance.now()-t0);
if(r.status===429){ // rate limit → backoff exponentiel
await new Promise(res=>setTimeout(res, 2**i * 800));
lastErr = new Error('rate limit'); continue;
}
if(!r.ok) throw new Error('HTTP '+r.status);
return await r.json();
}catch(e){
clearTimeout(timer);
lastErr = e;
if(i<retries) await new Promise(res=>setTimeout(res, 2**i * 400));
}
}
throw lastErr;
}
async health(){
try{
const h = await this._get('/health',{retries:0,timeoutMs:2500});
const avg = this._lat.length ? this._lat.reduce((a,b)=>a+b,0)/this._lat.length : 0;
return {up:true, latencyMs:Math.round(avg), rateLimitRemaining:h.rateLimitRemaining ?? null};
}catch(e){ return {up:false, latencyMs:null, rateLimitRemaining:null, error:String(e.message)}; }
}
}

/*───────────────────────────────────────────────────────────────────────
2c. Façade — routing, cache TTL, health. L'UI ne parle qu'à ceci.
───────────────────────────────────────────────────────────────────────*/
class ProviderRouter{
constructor(){
this.providers = {snapshot:new SnapshotProvider()};
this.active = 'snapshot';
this.cache = new Map();
this.ttl = {quote:15000, fundamentals:3600000, search:300000};
}
get current(){ return this.providers[this.active]; }
register(key, provider){ this.providers[key] = provider; }
async _cached(kind, key, fn){
const ck = `${this.active}:${kind}:${key}`, now = Date.now();
const hit = this.cache.get(ck);
if(hit && now - hit.t < (this.ttl[kind]||30000)) return hit.v;
const v = await fn();
this.cache.set(ck,{t:now, v});
return v;
}
getQuote(s){ return this._cached('quote', s, ()=>this.current.getQuote(s)); }
getFundamentals(s){ return this._cached('fundamentals', s, ()=>this.current.getFundamentals(s)); }
searchSecurity(q){ return this._cached('search', q, ()=>this.current.searchSecurity(q)); }
health(){ return this.current.health(); }
}

3. FORMATAGE
Rend un DataPoint. Une valeur absente s'affiche "n/d" — jamais une

═══════════════════════════════════════════════════════════════════════*/
const nf = (v,d=2)=>v==null||!isFinite(v)?'—':v.toLocaleString('fr-FR',
{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=2)=>v==null||!isFinite(v)?'—':(v>=0?'+':'')+nf(v,d)+' %';
function big(v){
if(v==null||!isFinite(v)) return '—';

if(a>=1e12) return nf(v/1e12,2)+' T';
if(a>=1e9) return nf(v/1e9,2)+' Md';
if(a>=1e6) return nf(v/1e6,2)+' M';
if(a>=1e3) return nf(v/1e3,1)+' k';
return nf(v,0);
}

const u=(typeof UNIV!=='undefined'&&UNIV)?UNIV.find(x=>x.s===sym):null; return !!(u&&u.c==='Devise'&&sym!=='DX-Y.NYB'); }

/*═══════════════════════════════════════════════════════════════════════
4. MOTEUR QUANTITATIF
Tous les calculs sont réels. Aucune valeur affichée dans les vues
Portefeuille n'est codée en dur.
═══════════════════════════════════════════════════════════════════════*/
const Q = {
mean:a=>a.reduce((x,y)=>x+y,0)/a.length,
std(a){ if(a.length<2) return NaN;
const m=Q.mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); },
cov(a,b){ if(a.length<2) return NaN;
const ma=Q.mean(a), mb=Q.mean(b);
return a.reduce((s,_,i)=>s+(a[i]-ma)*(b[i]-mb),0)/(a.length-1); },
corr(a,b){ const s=Q.std(a)*Q.std(b); return s?Q.cov(a,b)/s:NaN; },
beta(r,m){ const v=Q.cov(m,m); return v?Q.cov(r,m)/v:NaN; },

/** Volatilité annualisée à partir de rendements périodiques. */
volAnn(r,ppy=252){ return Q.std(r)*Math.sqrt(ppy); },

/** CAGR depuis une série de valeurs de portefeuille. */
cagr(series,years){
if(series.length<2||years<=0) return NaN;
const tot = series[series.length-1]/series[0];
return tot<=0?NaN:(Math.pow(tot,1/years)-1)*100;
},
sharpe(r,rf=0,ppy=252){
const s=Q.std(r); if(!s) return NaN;
return (Q.mean(r)-rf/ppy)/s*Math.sqrt(ppy);
},
/** Sortino : ne pénalise que la volatilité baissière. */
sortino(r,rf=0,ppy=252){
const t=rf/ppy, dn=r.filter(x=>x<t).map(x=>(x-t)**2);
if(!dn.length) return Infinity;
const dd=Math.sqrt(dn.reduce((a,b)=>a+b,0)/r.length);
return dd?(Q.mean(r)-t)/dd*Math.sqrt(ppy):NaN;
},
maxDD(series){
let peak=series[0], mx=0;
for(const v of series){ if(v>peak) peak=v; const d=(peak-v)/peak; if(d>mx) mx=d; }
return mx*100;
},
/** VaR historique — quantile empirique, pas d'hypothèse de normalité. */
varHist(r,conf=0.95){
const s=[...r].sort((a,b)=>a-b);
return -s[Math.floor((1-conf)*s.length)]*100;
},
/** CVaR : perte moyenne conditionnelle au-delà de la VaR. */
cvarHist(r,conf=0.95){
const s=[...r].sort((a,b)=>a-b), n=Math.max(1,Math.floor((1-conf)*s.length));
return -Q.mean(s.slice(0,n))*100;
},
/** Alpha de Jensen, annualisé, en points de %. */
jensen(rp,rm,rf=0,ppy=252){
const b=Q.beta(rp,rm);
return ((Q.mean(rp)-rf/ppy) - b*(Q.mean(rm)-rf/ppy))*ppy*100;
},
trackingError(rp,rm,ppy=252){ return Q.volAnn(rp.map((x,i)=>x-rm[i]),ppy)*100; },
infoRatio(rp,rm,ppy=252){
const d=rp.map((x,i)=>x-rm[i]), s=Q.std(d);
return s?Q.mean(d)/s*Math.sqrt(ppy):NaN;
},

/** Cholesky sur matrice de corrélation. Retourne null si non définie positive. */
chol(M){
const n=M.length, L=Array.from({length:n},()=>new Float64Array(n));
for(let i=0;i<n;i++) for(let j=0;j<=i;j++){
let s=M[i][j];
for(let k=0;k<j;k++) s-=L[i][k]*L[j][k];
if(i===j){ if(s<=1e-12) return null; L[i][i]=Math.sqrt(s); }
else L[i][j]=s/L[j][j];
}
return L;
},
/** Deux normales standard indépendantes (Box-Muller). */
gauss2(){
let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
const r=Math.sqrt(-2*Math.log(u));
return [r*Math.cos(2*Math.PI*v), r*Math.sin(2*Math.PI*v)];
},
quantile(sorted,p){
const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}
};

function squarify(items,x,y,w,h){
const out=[], tot=items.reduce((a,b)=>a+b.v,0); if(!tot||w<=0||h<=0) return out;
let rest=items.map(o=>({...o,a:o.v*w*h/tot}));
while(rest.length){
const short=Math.min(w,h)||1, worst=row=>{ const s=row.reduce((a,b)=>a+b.a,0); let mx=0, mn=Infinity; row.forEach(r=>{ mx=Math.max(mx,r.a); mn=Math.min(mn,r.a); });
return Math.max(short*short*mx/(s*s), s*s/(short*short*mn)); };
const row=[rest[0]]; let i=1;
while(i<rest.length&&worst([...row,rest[i]])<=worst(row)){ row.push(rest[i]); i++; }
const s=row.reduce((a,b)=>a+b.a,0);
if(w>=h){ const cw=s/h; let yy=y; row.forEach(r=>{ const rh=r.a/cw; out.push({...r,x,y:yy,w:cw,h:rh}); yy+=rh; }); x+=cw; w-=cw; }
else{ const rh=s/w; let xx=x; row.forEach(r=>{ const rw=r.a/rh; out.push({...r,x:xx,y,w:rw,h:rh}); xx+=rw; }); y+=rh; h-=rh; }
rest=rest.slice(i);
}
return out;
}

/** Analyse d'une allocation : risque historique + projection Monte Carlo.
 wmap = {sym: poids}, wc = poids des liquidités. */
async function pfAnalyze(wmap, wc, P, N){
const syms=Object.keys(wmap).filter(s=>wmap[s]>0);
const base=S.pfccy||'USD', hs=await Promise.all([...syms,PF_BENCH].map(s=>pfSeries(s,base)));
const bench=hs.pop();
const dates=[...bench.map.keys()].filter(d=>hs.every(h=>h.map.has(d))).sort();
if(dates.length<60) throw new Error(`historique commun trop court (${dates.length} séances)`);
const R=hs.map(h=>{ const a=[]; for(let t=1;t<dates.length;t++) a.push(h.map.get(dates[t])/h.map.get(dates[t-1])-1); return a; });
const Rb=[]; for(let t=1;t<dates.length;t++) Rb.push(bench.map.get(dates[t])/bench.map.get(dates[t-1])-1);
const rf=P.rf/100, mub=P.mub/100, T=Rb.length;
const sg=R.map(r=>Q.volAnn(r)), bt=R.map(r=>Q.beta(r,Rb)), sgb=Q.volAnn(Rb);
// Rendement attendu : MEDAF (rf + β × prime de marché), modifiable ligne à ligne.
const mu=syms.map((s,i)=>P.mu[s]!=null?P.mu[s]/100:rf+bt[i]*(mub-rf));
const w=syms.map(s=>wmap[s]);
// Portefeuille historique, rééquilibré quotidiennement aux poids actuels
const rp=Rb.map((_,t)=>w.reduce((a,wi,i)=>a+wi*R[i][t],0)+wc*rf/252);
let v=1; const curve=[1]; rp.forEach(x=>{ v*=1+x; curve.push(v); });
const yrsH=T/252;
const hist={vol:Q.volAnn(rp)*100, ret:(Math.pow(v,1/yrsH)-1)*100, sharpe:Q.sharpe(rp,rf), sortino:Q.sortino(rp,rf),
mdd:Q.maxDD(curve), var95:Q.varHist(rp), cvar95:Q.cvarHist(rp), beta:Q.beta(rp,Rb), alpha:Q.jensen(rp,Rb,rf),
te:Q.trackingError(rp,Rb), ir:Q.infoRatio(rp,Rb), corr:Q.corr(rp,Rb), from:dates[0], to:dates[dates.length-1], n:T};
// Matrice de corrélation (actifs + indice) ; rétrécie vers l'identité si non définie positive.
const all=[...R,Rb], k=all.length, C=all.map(a=>all.map(b=>a===b?1:Q.corr(a,b)));
let L=null, lam=0;
for(;lam<=0.5&&!L;lam+=0.05) L=Q.chol(C.map((row,i)=>row.map((c,j)=>i===j?1:(1-lam)*c)));
if(!L) throw new Error('corrélations inutilisables');
// Monte Carlo hebdomadaire : n actifs + indice, chocs corrélés par Cholesky.
const yrs=P.yrs, ppy=52, dt=1/ppy, sq=Math.sqrt(dt), steps=Math.round(yrs*ppy);
const sgAll=[...sg,sgb], muAll=[...mu,mub], drift=muAll.map((m,i)=>(m-sgAll[i]**2/2)*dt), rcash=Math.exp(rf*dt)-1;
const fin=[], bfin=[], dds=[]; let sample=null, bsample=null, beat=0, loss=0;
const z=new Float64Array(k), e=new Float64Array(k);
for(let n=0;n<N;n++){
let pv=1, bv=1, peak=1, mdd=0; const keep=n===0, ps=keep?[1]:null, bs=keep?[1]:null;
for(let t=0;t<steps;t++){
for(let i=0;i<k;i+=2){ const g=Q.gauss2(); z[i]=g[0]; if(i+1<k) z[i+1]=g[1]; }
for(let i=0;i<k;i++){ let s=0; for(let j=0;j<=i;j++) s+=L[i][j]*z[j]; e[i]=s; }
let r=wc*rcash;
for(let i=0;i<k-1;i++) r+=w[i]*(Math.exp(drift[i]+sgAll[i]*sq*e[i])-1);
pv*=1+r; bv*=Math.exp(drift[k-1]+sgb*sq*e[k-1]);
if(pv>peak) peak=pv; const d=(peak-pv)/peak; if(d>mdd) mdd=d;
if(keep){ ps.push(pv); bs.push(bv); }
}
if(pv>bv) beat++; if(pv<1) loss++;
fin.push(pv); bfin.push(bv); dds.push(mdd*100);
if(keep){ sample=ps; bsample=bs; }
}
fin.sort((a,b)=>a-b); bfin.sort((a,b)=>a-b); dds.sort((a,b)=>a-b);
const qt=p=>Q.quantile(fin,p);
const mc={med:qt(.5), p10:qt(.1), p90:qt(.9), bmed:Q.quantile(bfin,.5), pLoss:loss/N*100, pBeat:beat/N*100,
ddMed:Q.quantile(dds,.5), dd90:Q.quantile(dds,.9), sample, bsample, N, yrs,
expRet:(w.reduce((a,wi,i)=>a+wi*mu[i],0)+wc*rf)*100};
const divRatio=hist.vol?w.reduce((a,wi,i)=>a+wi*sg[i],0)*100/hist.vol:null;
return {syms, sg, bt, mu, w, hist, mc, shrink:lam-0.05>1e-9?lam-0.05:0, C, R, Rb, dates, wc, divRatio, base, ccys:hs.map(h=>h.ccy)};
}

function pfEvents(rows,B){

/** Performance des poids actuels sur l'historique, contre l'indice monde, et contribution de chaque ligne. */
function pfRenderPerf(hover){
const L=S.pfLast, cur=L&&L.cur, cv=document.getElementById('pfperfcv'); if(!cur||!cv) return;
const per=S.pfPerf||'1A', n=Math.min(cur.Rb.length,{'3M':63,'6M':126,'1A':252,'2A':9999}[per]), off=cur.Rb.length-n;
const rf=S.pfp.rf/100, dts=cur.dates.slice(off), pv=[1], bv=[1]; const contrib=cur.syms.map(()=>0); let cc=0;
// Attribution exacte : chaque jour, la contribution d'une ligne est pondérée par la valeur atteinte
// la veille (base 1 au départ). La somme des contributions égale donc la performance composée affichée.
for(let t=off;t<cur.Rb.length;t++){ const base=pv[pv.length-1]; let r=cur.wc*rf/252; cc+=base*cur.wc*rf/252;
cur.R.forEach((a,i)=>{ r+=cur.w[i]*a[t]; contrib[i]+=base*cur.w[i]*a[t]; });
pv.push(pv[pv.length-1]*(1+r)); bv.push(bv[bv.length-1]*(1+cur.Rb[t])); }
const pr=(pv[pv.length-1]-1)*100, br=(bv[bv.length-1]-1)*100;
const sum=document.getElementById('pfperfsum'); if(sum) sum.innerHTML=`Portefeuille <b class="${cls(pr)}">${pct(pr,1)}</b> · ACWI <b class="${cls(br)}">${pct(br,1)}</b> · écart <b class="${cls(pr-br)}">${pct(pr-br,1)}</b>`;
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1, W=r.width, H=200; cv.width=W*dpr; cv.height=H*dpr;
const x=cv.getContext('2d'); x.scale(dpr,dpr); const pl=8, prr=56, pt=10, pb=18;

x.font='9px monospace'; x.fillStyle='#8a93a0'; x.strokeStyle='#1c2127';
for(let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3, y=Y(v); x.beginPath(); x.moveTo(pl,y); x.lineTo(W-prr,y); x.stroke(); x.textAlign='left'; x.fillText(pct((v-1)*100,0),W-prr+4,y+3); }
x.strokeStyle='#4a525c'; x.beginPath(); x.moveTo(pl,Y(1)); x.lineTo(W-prr,Y(1)); x.stroke();
const line=(s,c,w)=>{ x.strokeStyle=c; x.lineWidth=w; x.beginPath(); s.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.stroke(); };
line(bv,'#8a93a0',1.2); line(pv,'#6ba3e0',1.8);
x.font='10px monospace'; x.textAlign='left'; x.fillStyle='#6ba3e0'; x.fillRect(pl+4,pt+4,12,3); x.fillText('Portefeuille',pl+20,pt+9);
x.fillStyle='#8a93a0'; x.fillRect(pl+110,pt+4,12,3); x.fillText('Indice monde (ACWI)',pl+126,pt+9); x.font='9px monospace';
const fd=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'});
x.fillStyle='#8a93a0'; x.textAlign='left'; x.fillText(fd(cur.dates[off]),pl,H-4); x.textAlign='right'; x.fillText(fd(dts[dts.length-1]),W-prr,H-4);
if(hover!=null&&hover>=0&&hover<N){ x.strokeStyle='rgba(221,227,234,.4)'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(X(hover),pt); x.lineTo(X(hover),H-pb); x.stroke(); x.setLineDash([]);
const d=hover?dts[hover-1]:cur.dates[off]; x.textAlign='left'; x.font='bold 10px monospace';
const tx=`${fd(d)}  portefeuille ${pct((pv[hover]-1)*100,1)}  ACWI ${pct((bv[hover]-1)*100,1)}`, tw=x.measureText(tx).width+10, lx=Math.min(Math.max(pl,X(hover)-tw/2),W-prr-tw);
x.fillStyle='#dde3ea'; x.fillRect(lx,pt,tw,16); x.fillStyle='#0b0e11'; x.fillText(tx,lx+5,pt+11.5); }
cv.onmousemove=ev=>{ const rr=cv.getBoundingClientRect(); pfRenderPerf(Math.round((ev.clientX-rr.left-pl)/(W-pl-prr)*(N-1))); };
cv.onmouseleave=()=>pfRenderPerf(null);
if(hover!==undefined) return;
document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{ S.pfPerf=b.dataset.pr; document.querySelectorAll('[data-pr]').forEach(x=>x.classList.toggle('on',x===b)); pfRenderPerf(); });
const items=cur.syms.map((s,i)=>[s,contrib[i]*100]).concat(cur.wc>0?[['Liquidités',cc*100]]:[]).sort((a,b)=>b[1]-a[1]);
const mx=Math.max(...items.map(i=>Math.abs(i[1])),0.01);
const cb=document.getElementById('pfcontrib');
if(cb) cb.innerHTML=`<div style="font-size:9px;color:var(--txt3);margin-bottom:4px">CONTRIBUTION À LA PERFORMANCE (${per}, en points)</div>`+items.map(([s,v])=>`<div style="display:grid;grid-template-columns:80px 1fr 64px;gap:8px;align-items:center;font-size:11px;padding:1px 0">
<span class="sym">${esc(s)}</span><div style="position:relative;height:10px;background:#14171b"><div style="position:absolute;top:0;bottom:0;${v>=0?'left:50%':'right:50%'};width:${Math.abs(v)/mx*50}%;background:${v>=0?'#2fbf6b':'#e04a4a'}"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a525c"></div></div>
<span class="${cls(v)}" style="text-align:right">${v>0?'+':''}${nf(v,1)}</span></div>`).join('')+
`<div class="note" style="padding:6px 0 0">Contributions en points de performance : leur somme (${pct(items.reduce((a,x)=>a+x[1],0),1)}) égale la performance du portefeuille sur la période. Chaque jour, la contribution d'une ligne = son poids × son rendement × la valeur atteinte la veille.</div>`;
const info=document.getElementById('pfperfinfo'); if(info) info.textContent=`en ${cur.base} · contre MSCI ACWI`;
}

/** Score 0–24 → profil, avec deux règles bloquantes (horizon court, faible tolérance aux pertes). */
function clientProfile(c){
if(!c||!c.a||c.a.some(x=>x==null)) return null;
const score=c.a.reduce((s,x)=>s+x,0), flags=[];
let prof=score<=8?'Prudent':score<=16?'Équilibré':'Dynamique';
const cap=p=>{ const o=['Prudent','Équilibré','Dynamique']; if(o.indexOf(prof)>o.indexOf(p)) prof=p; };
if(c.a[0]===0){ cap('Prudent'); flags.push('horizon inférieur à 2 ans : profil limité à Prudent'); }
if(c.a[2]===0){ cap('Prudent'); flags.push('perte acceptable inférieure à 5 % : profil limité à Prudent'); }
if(c.a[6]===0){ cap('Prudent'); flags.push('besoin de liquidité sous 12 mois : profil limité à Prudent'); }
if(c.a[3]===0&&prof==='Dynamique'){ cap('Équilibré'); flags.push('vente en cas de baisse : profil limité à Équilibré'); }
if(c.a[4]===0) flags.push('aucune expérience : produits complexes exclus, explication renforcée');
return {score, prof, maxLoss:LOSS_TOL[c.a[2]], maxVol:PROFILES[prof].maxVol, flags};
}

const STRESS=[
{k:'Crise financière',per:'oct. 2007 → mars 2009',eq:-58,bond:6,gold:23,cash:2},
{k:'Bulle internet',per:'mars 2000 → oct. 2002',eq:-49,bond:28,gold:12,cash:8},

{k:'Choc hypothétique',per:'actions −20 %, taux +1 pt',eq:-20,bond:-6,gold:5,cash:0}
];
const ASSET_CLASS={AGG:'bond',BND:'bond',IEF:'bond',TLT:'bond',IEAG:'bond','AGGH.AS':'bond','EUNA.DE':'bond',
GLD:'gold',IAU:'gold','GC=F':'gold','SGLD.L':'gold','4GLD.DE':'gold','SI=F':'gold',BIL:'cash',SHV:'cash',SGOV:'cash','XEON.DE':'cash'};
/** Choc d'une ligne : classe d'actif connue, sinon bêta × choc actions (plafonné à −95 %). */
function stressOf(sym,beta,sc){ const c=ASSET_CLASS[sym]; if(c) return sc[c];
return Math.max(-95,Math.min(150,(isFinite(beta)?beta:1)*sc.eq)); }
function stressPortfolio(A,wc,sc){ return A.syms.reduce((s,sym,i)=>s+A.w[i]*stressOf(sym,A.bt[i],sc),0)+wc*sc.cash; }

async function pfApply(name,nav){
const pr=PROFILES[name]; if(!pr||!nav) return;
if(!confirm(`Remplacer le portefeuille par l'allocation ${name} (${nf(nav/(S.pfB||1),0)} ${S.pfccy||'USD'} répartis selon le profil) ?`)) return;
const pos=[]; let used=0;
for(const [s,w] of Object.entries(pr.w)){ const h=await pfHist(s).catch(()=>null); if(!h) continue;
const px=h.meta.regularMarketPrice??h.last, fx=await pfFX(h.meta.currency).catch(()=>1), qty=Math.floor(w*nav/(px*fx)); if(qty>0){ pos.push({sym:s,qty,cost:px}); used+=qty*px*fx; } }
if(!pos.length) return alert('Cours indisponibles, réessayez.');
S.positions=pos; S.cash=Math.round((nav-used)/(S.pfB||1)*100)/100; S.cashCcy=S.pfccy||'USD'; S.pfp.mu={}; pfSave(); viewPortfolio();
}

function drawMC(p,b,yrs){
const cv=document.getElementById('mccv'); if(!cv||!p) return;
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
cv.width=r.width*dpr; cv.height=200*dpr;
const x=cv.getContext('2d'); x.scale(dpr,dpr);
const W=r.width, H=200, pad=30;
x.clearRect(0,0,W,H);
const all=[...p,...b], mn=Math.min(...all), mx=Math.max(...all);
const X=i=>pad+(i/(p.length-1))*(W-pad-8);
const Y=v=>H-18-((v-mn)/(mx-mn||1))*(H-32);
x.strokeStyle='#232830'; x.lineWidth=1;
[0,0.5,1].forEach(f=>{ const v=mn+(mx-mn)*f, y=Y(v);
x.beginPath(); x.moveTo(pad,y); x.lineTo(W-8,y); x.stroke();
x.fillStyle='#8a93a0'; x.font='9px monospace'; x.textAlign='right';
x.fillText('×'+v.toFixed(2), pad-4, y+3); });
const line=(s,c,w)=>{ x.strokeStyle=c; x.lineWidth=w; x.beginPath();
s.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.stroke(); };
line(b,'#5b6672',1); line(p,'#6ba3e0',1.4);
x.fillStyle='#8a93a0'; x.font='9px monospace'; x.textAlign='left';
x.fillText('Trajectoire d\'exemple — portefeuille (bleu) contre indice monde ACWI (gris) sur '+yrs+' ans', pad, 11);
}

// Yahoo publie des bougies forex quotidiennes peu fiables : ouverture prise à une heure arbitraire
// (corps quasi nuls) et plus hauts/plus bas pollués par des cotations aberrantes (mèches géantes).
// Le change cote 24 h/24 : l'ouverture d'une séance = clôture de la précédente ; mèches plafonnées.
function cleanFX(raw){
if(raw.length<3) return raw;
const rng=raw.map(b=>b.h-b.l).sort((a,b)=>a-b), med=rng[rng.length>>1]||0, cap=med*1.5;
const out=raw.map((b,i)=>{ const o=i?raw[i-1].c:b.o, c=b.c, top=Math.max(o,c), bot=Math.min(o,c);
let h=Math.max(b.h,top), l=Math.min(b.l,bot);
if(cap>0){ h=Math.min(h,top+cap); l=Math.max(l,bot-cap); }
return {...b,o,h,l,adj:1}; });
out.cleaned=true; return out; }
function sma(arr,n){ const out=new Array(arr.length).fill(null); let s=0;
for(let i=0;i<arr.length;i++){ s+=arr[i]; if(i>=n) s-=arr[i-n]; if(i>=n-1) out[i]=s/n; } return out; }

const closes=all.map(b=>b.c), m50=sma(closes,50).slice(off), m200=sma(closes,200).slice(off);
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1, W=r.width, H=380;
cv.width=W*dpr; cv.height=H*dpr; const x=cv.getContext('2d'); x.scale(dpr,dpr);
const hasVol=SEC.bars.some(b=>b.v>0), pr=64, pt=28, volH=SEC.vol&&hasVol?70:0, gap=SEC.vol&&hasVol?14:0, pb=18, priceH=H-pt-pb-volH-gap;
// Échelle calée sur les bougies : une moyenne mobile éloignée ne doit pas écraser le graphique.
let lo=Math.min(...bars.map(b=>b.l)), hi=Math.max(...bars.map(b=>b.h));
const padY=(hi-lo)*0.06||Math.abs(hi)*0.002||1; lo-=padY; hi+=padY;
const sym=SEC.sym, dd=v=>npx(v,sym);
const step=(W-pr-8)/n, cw=Math.max(1,Math.min(14,step*0.7));

x.font='9px monospace'; x.strokeStyle='#1c2127'; x.fillStyle='#8a93a0'; x.textAlign='left';
for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, y=Y(v); x.beginPath(); x.moveTo(8,y); x.lineTo(W-pr,y); x.stroke(); x.fillText(dd(v),W-pr+4,y+3); }
const ticks=Math.min(6,n); x.textAlign='center';
for(let k=0;k<ticks;k++){ const i=Math.round(k*(n-1)/Math.max(1,ticks-1));
x.fillText(SEC.range==='1J'?new Date(bars[i].t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):new Date(bars[i].t).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:SEC.range==='1M'||SEC.range==='3M'?undefined:'2-digit'}),X(i),H-5); }
// volume
if(SEC.vol&&bars.some(b=>b.v>0)){ const vmax=Math.max(...bars.map(b=>b.v||0))||1, vb=pt+priceH+gap+volH;
bars.forEach((b,i)=>{ if(!b.v) return; const h=b.v/vmax*volH; x.fillStyle=b.c>=b.o?'rgba(47,191,107,.35)':'rgba(224,74,74,.35)'; x.fillRect(X(i)-cw/2,vb-h,cw,h); });
x.fillStyle='#4a525c'; x.textAlign='left'; x.fillText('Volume',10,pt+priceH+gap+9); }
// chandeliers
bars.forEach((b,i)=>{ const upc=b.c>=b.o, col=upc?'#2fbf6b':'#e04a4a';
x.strokeStyle=col; x.lineWidth=1; x.beginPath(); x.moveTo(X(i),Y(b.h)); x.lineTo(X(i),Y(b.l)); x.stroke();
const yo=Y(b.o), yc=Y(b.c), top=Math.min(yo,yc), h=Math.max(1,Math.abs(yc-yo));
x.fillStyle=col; x.fillRect(X(i)-cw/2,top,cw,h); });

x.strokeStyle=col; x.lineWidth=1.3; x.beginPath(); let s=false; a.forEach((v,i)=>{ if(v==null) return; s?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)); s=true; }); x.stroke(); x.restore(); };
if(SEC.ma&&SEC.range!=='1J'){ line(m50,'#e8a33d'); line(m200,'#bb98e6'); }
const lastMA=a=>{ for(let k=a.length-1;k>=0;k--) if(a[k]!=null) return a[k]; return null; };
const out=(v)=>v!=null&&(v<lo||v>hi)?` ${v>hi?'↑':'↓'} ${dd(v)} hors cadre`:'';
const unit=SEC.range==='5A'?'semaines':'séances';
if(SEC.ma&&SEC.range!=='1J'){ const l200='— MM200 ('+unit+')'+out(lastMA(m200)), l50='— MM50'+out(lastMA(m50));
x.textAlign='right'; x.fillStyle='#bb98e6'; x.fillText(l200,W-pr-4,pt-6);
x.fillStyle='#e8a33d'; x.fillText(l50,W-pr-4-x.measureText(l200).width-12,pt-6); }
// survol
const tip=document.getElementById('sectip'), i=hover?hover.i:null, my=hover?hover.y:null;
if(i!=null&&i>=0&&i<n){ const b=bars[i];
// Réticule façon TradingView : ligne verticale sur la séance, ligne horizontale qui suit la souris.
const inP=my!=null&&my>=pt&&my<=pt+priceH;
x.strokeStyle='rgba(221,227,234,.4)'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(X(i),pt); x.lineTo(X(i),H-pb);
if(inP){ x.moveTo(8,my); x.lineTo(W-pr,my); } x.stroke(); x.setLineDash([]);
const tag=(txt,cx,cy,align)=>{ x.font='bold 10px monospace'; const w=x.measureText(txt).width+10, h=16;
const lx=align==='right'?W-pr+1:Math.max(8,Math.min(W-pr-w,cx-w/2));
x.fillStyle='#dde3ea'; x.fillRect(lx,cy-h/2,w,h); x.fillStyle='#0b0e11'; x.textAlign='left'; x.fillText(txt,lx+5,cy+3.5); x.font='9px monospace'; };
if(inP){ const v=lo+(1-(my-pt)/priceH)*(hi-lo), last=bars[n-1].c, dv=(v/last-1)*100;
tag(dd(v),0,my,'right');
x.font='9px monospace'; x.textAlign='right'; x.fillStyle=dv>=0?'#2fbf6b':'#e04a4a';
x.fillText(`${dv>=0?'+':''}${nf(dv,2)} % vs dernier`,W-pr-6,my-5); }
tag(SEC.range==='1J'?new Date(b.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):new Date(b.t).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'}),X(i),H-pb+9,'center');
const chg=i>0?(b.c/bars[i-1].c-1)*100:null;
tip.innerHTML=`<b style="color:var(--txt)">${SEC.range==='1J'?new Date(b.t).toLocaleString('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'}):new Date(b.t).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}</b> &nbsp; O ${dd(b.o)} &nbsp; H ${dd(b.h)} &nbsp; B ${dd(b.l)} &nbsp; C <b style="color:var(--txt)">${dd(b.c)}</b> ${chg!=null?`&nbsp; <span class="${cls(chg)}">${pct(chg)}</span>`:''} ${b.v?'&nbsp; Vol. '+big(b.v):''}${SEC.ma&&m50[i]?` &nbsp; <span style="color:#e8a33d">MM50 ${dd(m50[i])}</span>`:''}${SEC.ma&&m200[i]?` &nbsp; <span style="color:#bb98e6">MM200 ${dd(m200[i])}</span>`:''}`;
} else if(tip){ tip.innerHTML=''; }
const perf=(bars[n-1].c/bars[0].o-1)*100, pe=document.getElementById('secperf');
if(pe) pe.innerHTML=`${SEC.range} : <span class="${cls(perf)}">${pct(perf,1)}</span> · ${n} ${unit}`;
cv.onmousemove=ev=>{ const rr=cv.getBoundingClientRect(); const k=Math.floor((ev.clientX-rr.left-8)/step); drawCandles(k>=0&&k<n?{i:k,y:ev.clientY-rr.top}:null); };
cv.style.cursor='crosshair';
cv.onmouseleave=()=>drawCandles(null);
}
function secReading(F,px,bars){
const out=[];
if(F.pe&&F.fpe) out.push(F.fpe<F.pe?`Le PER prospectif (${nf(F.fpe,1)}) est inférieur au PER actuel (${nf(F.pe,1)}) : le consensus anticipe une hausse des bénéfices.`
:`Le PER prospectif (${nf(F.fpe,1)}) dépasse le PER actuel (${nf(F.pe,1)}) : le consensus anticipe un recul des bénéfices.`);
if(F.target&&px) out.push(`L'objectif moyen de ${F.analysts||'plusieurs'} analystes (${nf(F.target)}) implique ${pct((F.target/px-1)*100,1)} par rapport au cours${F.targetLo&&F.targetHi?`, dans une fourchette de ${nf(F.targetLo)} à ${nf(F.targetHi)}`:''}.`);
if(F.w52lo&&F.w52hi&&px){ const p=(px-F.w52lo)/(F.w52hi-F.w52lo)*100; out.push(`Le cours se situe à ${nf(Math.max(0,Math.min(100,p)),0)} % de son amplitude sur 52 semaines (${nf(F.w52lo)} – ${nf(F.w52hi)}).`); }

if(F.cash!=null&&F.debt!=null) out.push(F.cash>=F.debt?`Trésorerie nette positive (${big(F.cash-F.debt)}).`:`Endettement net de ${big(F.debt-F.cash)}.`);

}

function drawSr(pts){

const W=r.width, H=190, pl=46, pb=18;
const vs=pts.map(p=>p[1]), mn=Math.min(...vs), mx=Math.max(...vs);
const X=i=>pl+i/(pts.length-1)*(W-pl-6), Y=v=>8+(1-(v-mn)/(mx-mn||1))*(H-8-pb);

[0,.5,1].forEach(f=>{ const v=mn+(mx-mn)*f, y=Y(v); x.beginPath(); x.moveTo(pl,y); x.lineTo(W-6,y); x.stroke(); x.fillText(nf(v,v>1000?0:2),pl-4,y+3); });

pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[1])):x.moveTo(X(i),Y(p[1]))); x.stroke();

function fmtMacro(v,f){
if(v==null) return '<span class="na">n/d</span>';
if(f==='%') return nf(v,2)+' %';
if(f==='pb') return nf(v,0)+' pb';
if(f==='k') return (v>0?'+':'')+nf(v,0)+' k';
if(f==='Md') return nf(v,0)+' Md$';
return nf(v, Math.abs(v)>=1000?0:1);
}
function dlt(v,p,f){
if(v==null||p==null) return '<span class="mut">—</span>';
let d=v-p; if(f==='%') d*=100;
const u=f==='%'?' pb':f==='Md'?' Md$':f==='pb'?' pb':'';
if(Math.abs(d)<1e-9) return '<span class="mut">=</span>';
return `<span class="${d>0?'pos':'neg'}">${d>0?'+':''}${nf(d, f==='%'||f==='pb'||f==='Md'?0:1)}${u}</span>`;
}

return `<div class="mut" style="font-size:10px;margin-top:2px;line-height:1.5">Décision sur la fourchette des fed funds${rng?` (actuelle ${rng})`:''} · communiqué 14:00 New York (20:00 Paris), conférence de presse 14:30 (20:30)${[3,6,9,12].includes(mo)?' · <b>avec projections économiques et « dot plot »</b>':''}${exp?'<br>Marché (futures fed funds) : '+exp:''}</div>`; }

let palIdx=0, palList=[];
let palSeq=0, palTimer=null;
function palRender(){
const box=document.getElementById('palres');
box.innerHTML = palList.length
? palList.map((s,i)=>`<div class="pr ${i===palIdx?'sel':''}" id="pr-${i}" role="option" aria-selected="${i===palIdx}" data-i="${i}">
<span class="s">${esc(s.sym)}</span><span class="n">${esc(s.name)}</span>
<span class="c">${esc(s.cls)}</span><span class="c">${esc(s.exch)}</span></div>`).join('')
: `<div class="pr"><span class="n na">Aucun titre ne correspond dans le catalogue (${localItems().length} instruments)${WORKER_URL?' ni sur les marchés mondiaux':''}.</span></div>`;
box.querySelectorAll('.pr[data-i]').forEach(r=>r.onclick=()=>palOpen(palList[+r.dataset.i]));
const palin=document.getElementById('palin');
if(palList.length) palin.setAttribute('aria-activedescendant','pr-'+palIdx);
else palin.removeAttribute('aria-activedescendant');
}
function palOpen(it){ if(!it) return; if(it.cmd){ runCmd(it.cmd); return; } if(it.sym&&it.sym.startsWith('<')){ const i=document.getElementById('palin'); i.value=''; i.placeholder=it.exch; return; } if(it.nw){ closePal(); go('srch').then(()=>showDetail(it.sym)); } else openSym(it.sym); }
async function palSearch(q){
const t=q.trim().toLowerCase().replace(/^economics:/,''), my=++palSeq;
// 1. Catalogue local (instantané) : ~900 actions, indices, devises, matières premières, taux, crypto
let loc=localItems();
if(t){
loc=loc.filter(x=>x.s.toLowerCase().includes(t)||(x.n||'').toLowerCase().includes(t))
.sort((a,b)=>{ const r=x=>x.s.toLowerCase()===t?0:x.s.toLowerCase().startsWith(t)?1:(x.n||'').toLowerCase().startsWith(t)?2:3; return r(a)-r(b); });
}
palList=loc.slice(0,12).map(x=>({sym:x.s, name:x.n||x.s, cls:x.c, exch:(x.l&&x.l.length?x.l[0]:'catalogue'), nw:x.nw}));
{ const up=q.trim().toUpperCase(), c=parseCmd(q);
if(up==='HELP'||up==='?'){ palList=helpItems(); palIdx=0; palRender(); return; }
if(c) palList.unshift({cmd:c, sym:'▶ '+cmdLabel(c), name:FUNCS[c.f].d, cls:'Fonction', exch:'↵ exécuter'});
else if(!t) palList=helpItems().filter(h=>h.cmd).slice(0,6).concat(palList.slice(0,8)); }
palIdx=0; palRender();
// 2. Marchés mondiaux via le relais (complète la liste)
clearTimeout(palTimer);
if(!WORKER_URL||t.length<2) return;
palTimer=setTimeout(async()=>{
try{
const r=await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(q.trim())}`); const d=await r.json();
if(my!==palSeq) return;
const have=new Set(palList.map(x=>x.sym));
const rem=(d.quotes||[]).filter(x=>x.symbol&&!have.has(x.symbol)).slice(0,10)
.map(x=>({sym:x.symbol, name:x.longname||x.shortname||x.symbol, cls:x.typeDisp||x.quoteType||'—', exch:x.exchDisp||x.exchange||'monde'}));
palList=palList.concat(rem).slice(0,20); palRender();
}catch(e){}
},250);
}
function palMove(d){
if(!palList.length) return;
palIdx=(palIdx+d+palList.length)%palList.length;
document.querySelectorAll('#palres .pr').forEach((r,i)=>{
r.classList.toggle('sel',i===palIdx);
r.setAttribute('aria-selected', i===palIdx ? 'true':'false');
});
document.getElementById('palin').setAttribute('aria-activedescendant','pr-'+palIdx);
const s=document.querySelector('#palres .pr.sel'); if(s) s.scrollIntoView({block:'nearest'});
}
let palReturnFocus=null;
function openPal(){
palReturnFocus=document.activeElement;
document.getElementById('pal').classList.add('on');
const i=document.getElementById('palin'); i.value=''; i.focus(); palSearch('');
}
function closePal(){
document.getElementById('pal').classList.remove('on');
if(palReturnFocus && typeof palReturnFocus.focus==='function') palReturnFocus.focus();
}
function openSym(sym){ closePal(); S.focus=sym; go('sec'); }

x.fillStyle='#dde3ea'; x.beginPath(); x.arc(X(i),Y(p[1]),3,0,7); x.fill();

function drawComp(hover){
const cv=document.getElementById('compcv'), D=COMP.data; if(!cv||!D) return;

let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.05||1; lo-=pad; hi+=pad;
const X=i=>pl+i/(n-1)*(W-pl-pr), Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb), fp=v=>(v>=100?'+':'')+nf(v-100,1)+' %';
x.font='9px monospace'; x.strokeStyle='#1c2127'; x.fillStyle='#8a93a0';
for(let k=0;k<=5;k++){ const v=lo+(hi-lo)*k/5, y=Y(v); x.beginPath(); x.moveTo(pl,y); x.lineTo(W-pr,y); x.stroke(); x.textAlign='left'; x.fillText(fp(v),W-pr+4,y+3); }

series.forEach(s=>{ x.strokeStyle=s.col; x.lineWidth=1.6; x.beginPath(); s.vals.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.stroke(); });
// légende et étiquettes de fin

const tag=(txt,y,bg,fg)=>{ x.font='bold 10px monospace'; const w=x.measureText(txt).width+10; x.fillStyle=bg; x.fillRect(W-pr+1,y-8,w,16); x.fillStyle=fg; x.textAlign='left'; x.fillText(txt,W-pr+6,y+3.5); x.font='9px monospace'; };

x.strokeStyle='rgba(221,227,234,.4)'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(X(i),pt); x.lineTo(X(i),H-pb); if(inP){ x.moveTo(pl,my); x.lineTo(W-pr,my); } x.stroke(); x.setLineDash([]);
series.forEach(s=>{ x.fillStyle=s.col; x.beginPath(); x.arc(X(i),Y(s.vals[i]),3,0,7); x.fill(); });
if(inP) tag(fp(lo+(1-(my-pt)/(H-pt-pb))*(hi-lo)),my,'#dde3ea','#0b0e11');
const lines=[fd(dates[i]),...series.map(s=>[s,`${s.s.padEnd(9)} ${fp(s.vals[i])}`])].map(l=>l);
x.font='10px monospace'; const bw=Math.max(...lines.map(l=>x.measureText(typeof l==='string'?l:l[1]).width))+14, bh=lines.length*14+8;
const bx=X(i)+12+bw>W-pr?X(i)-bw-12:X(i)+12, by=pt+6;
x.fillStyle='rgba(11,14,17,.92)'; x.fillRect(bx,by,bw,bh); x.strokeStyle='#2a3038'; x.strokeRect(bx,by,bw,bh);
lines.forEach((l,j)=>{ x.fillStyle=typeof l==='string'?'#dde3ea':l[0].col; x.fillText(typeof l==='string'?l:l[1],bx+7,by+15+j*14); }); }
cv.style.cursor='crosshair';
cv.onmousemove=ev=>{ const rr=cv.getBoundingClientRect(), i=Math.round((ev.clientX-rr.left-pl)/(W-pl-pr)*(n-1)); drawComp(i>=0&&i<n?{i,y:ev.clientY-rr.top}:null); };

async function dvdRender(sym){
const box=document.getElementById('sec-dvd'); if(!box||!WORKER_URL) return;
let res;
try{ const r=await fetch(`${WORKER_URL}/chart?s=${encodeURIComponent(sym)}&range=max&ev=div`); const d=await r.json(); res=d.chart&&d.chart.result&&d.chart.result[0]; if(!res) throw new Error('aucune donnée'); }
catch(e){ box.innerHTML=`<h3>DVD — Dividendes</h3><div class="note">Historique indisponible (${esc(e.message)}). Si le message persiste, mettez à jour le relais Cloudflare (worker.js).</div>`; return; }
if(S.focus!==sym) return;
const ev=Object.values((res.events&&res.events.dividends)||{}).map(x=>({t:x.date*1000,a:x.amount})).sort((a,b)=>a.t-b.t);
const px=res.meta.regularMarketPrice, ccy=res.meta.currency||'';
if(!ev.length){ box.innerHTML=`<h3>DVD — Dividendes</h3><div class="note" data-keep="1">${esc(sym)} ne verse pas de dividende (aucun versement dans l'historique Yahoo).</div>`; return; }
const curY=new Date().getFullYear(), byY={}; ev.forEach(x=>{ const y=new Date(x.t).getFullYear(); byY[y]=(byY[y]||0)+x.a; });
const years=Object.keys(byY).map(Number).sort(), full=years.filter(y=>y<curY);
const ttm=ev.filter(x=>x.t>Date.now()-365*864e5).reduce((s,x)=>s+x.a,0), yld=px?ttm/px*100:null;
const freq=ev.filter(x=>x.t>Date.now()-400*864e5).length;   // versements sur ~13 mois
// Hausses consécutives : on compare le versement le plus élevé de chaque année (insensible au calendrier
// de paiement, qui peut faire tomber 3 ou 5 versements dans une même année civile).
// Médiane des versements de l'année : insensible à un dividende exceptionnel ou à une ligne erronée de Yahoo.
const pY={}; ev.forEach(x=>{ const y=new Date(x.t).getFullYear(); (pY[y]=pY[y]||[]).push(x.a); });
const mxY={}; for(const [y,a] of Object.entries(pY)){ const v=[...a].sort((p,q)=>p-q); mxY[y]=v.length%2?v[v.length>>1]:(v[v.length/2-1]+v[v.length/2])/2; }
const ys=Object.keys(mxY).map(Number).sort(); let streak=0;
let ups=0; for(let i=ys.length-1;i>0;i--){ if(ys[i]-ys[i-1]!==1) break; const r=mxY[ys[i]]/mxY[ys[i-1]]; if(r<0.995) break; if(ys[i]!==curY){ streak++; if(r>1.001) ups++; } }
// Croissance sur k années civiles réelles (et non k entrées de la liste : une suspension créerait un faux écart)
const cg=k=>{ const b=full[full.length-1], a=b-k; return byY[a]>0&&byY[b]>0?cagrOf(byY[a],byY[b],k):null; };
box.innerHTML=`<h3>DVD — Dividendes<span class="rt">${ev.length} versements depuis ${new Date(ev[0].t).getFullYear()} · ${esc(ccy)} par action</span></h3>

const ok=(v,min,max)=>(min==null||(v!=null&&v>=min))&&(max==null||(v!=null&&v>0&&v<=max));
if(!ok(cap!=null?cap/1e9:null,num('capMin'),null)||!ok(r.pe,null,num('peMax'))||!ok(r.fpe,null,num('fpeMax'))||!ok(r.div,num('divMin'),null)
||!ok(r.om,num('omMin'),null)||!ok(r.gr,num('grMin'),null)||!ok(r.roe,num('roeMin'),null)||!ok(r.de,null,num('deMax'))||!ok(up,num('upMin'),null)){
// donnée absente pour un critère actif, ou critère non rempli
const act=[['peMax',r.pe],['fpeMax',r.fpe],['divMin',r.div],['omMin',r.om],['grMin',r.gr],['roeMin',r.roe],['deMax',r.de],['upMin',up]].filter(([k])=>num(k)!=null);
if(act.some(([,v])=>v==null)) why.missing++; else why.crit++; continue; }
if(f.ts) ages.push(Date.now()-Date.parse(f.ts)); list.push(r); }
const k=EQS.sort, d=EQS.dir; list.sort((a,b)=>{ const x=a[k], y=b[k]; if(x==null) return 1; if(y==null) return -1; return typeof x==='string'?d*x.localeCompare(y):d*(x-y); });
const cols=[['s','Titre'],['sec','Secteur'],['cap','Capi. ($)'],['pe','PER'],['fpe','PER prosp.'],['div','Rdt div.'],['om','Marge op.'],['gr','Croiss. CA'],['roe','ROE'],['de','Dette/FP'],['up','Potentiel'],['pc','Var. jour']];
const fm={cap:v=>big(v),pe:v=>nf(v,1),fpe:v=>nf(v,1),div:v=>nf(v,2)+' %',om:v=>nf(v,1)+' %',gr:v=>pct(v,1),roe:v=>nf(v,1)+' %',de:v=>nf(v,0)+' %',up:v=>pct(v,1),pc:v=>pct(v)};
document.getElementById('eqcount').textContent=`${list.length} titre${list.length>1?'s':''}${list.length>200?' (200 premiers affichés)':''} · cliquez un en-tête pour trier`;
ages.sort((a,b)=>a-b); const hAge=v=>v<36e5?'moins d\'1 h':v<864e5?Math.round(v/36e5)+' h':Math.round(v/864e5)+' j';
const ex=document.getElementById('eqexpl'); if(ex) ex.innerHTML=`<b style="color:var(--txt)">${univ.length} titres${F.idx?' dans le '+esc(F.idx):' dans le catalogue'}${F.sec?' (secteur filtré à part)':''} → ${list.length} retenus.</b>
${why.noFund.length?` · <span class="neg">${why.noFund.length} sans fondamentaux lus</span> (${why.noFund.slice(0,6).map(esc).join(', ')}${why.noFund.length>6?'…':''})`:''}${why.noCap.length?` · ${why.noCap.length} sans capitalisation`:''}${why.missing?` · ${why.missing} écartés faute de donnée pour un critère (ex. pas de PER)`:''}${why.crit?` · ${why.crit} ne remplissent pas les critères`:''}.

/*── Courbes souveraines multi-pays (GC + panneau Marchés) ───────────*/
let CURVES=null, CURVES_TS=null;
async function loadCurves(){ try{ const r=await fetch('curves.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
const d=await r.json(); if(CURVES_TS===d.generated_at) return false; CURVES=d.items||{}; CURVES_TS=d.generated_at; return true; }
catch(e){ console.info('curves.json indisponible ('+e.message+')'); return false; } }
const TEN_ORD=['1M','3M','6M','1A','2A','3A','4A','5A','6A','7A','8A','9A','10A','15A','20A','25A','30A','40A'];
const GC_COL={US:'#6ba3e0',EU:'#e8a33d',DE:'#d8d36b',FR:'#4fc1c9',IT:'#2fbf6b',UK:'#e04a4a',JP:'#bb98e6',CH:'#c98a5f'};
const GC_NAME={US:'États-Unis',EU:'Zone euro AAA',DE:'Allemagne',FR:'France',IT:'Italie',UK:'Royaume-Uni',JP:'Japon',CH:'Suisse'};
const GC={sel:new Set(['US','EU','DE','UK','JP'])};
function allCurves(){ const out=[];
if(MACRO&&MACRO.gc){ if(MACRO.gc.us) out.push({k:'US',pts:MACRO.gc.us.pts||[],src:MACRO.gc.us.src,freq:'quotidien'}); if(MACRO.gc.eu) out.push({k:'EU',pts:MACRO.gc.eu.pts||[],src:MACRO.gc.eu.src,freq:'quotidien'}); }
for(const k of ['DE','FR','IT','UK','JP','CH']){ const c=CURVES&&CURVES[k]; if(c) out.push({k,pts:c.pts||[],src:c.src,freq:c.freq,stale:c.stale}); }
return out.map(c=>({...c,n:GC_NAME[c.k],col:GC_COL[c.k],pts:c.pts.filter(p=>p.y!=null)})); }
const cy=(c,t)=>{ const p=c&&c.pts.find(x=>x.t===t); return p?p.y:null; };
/** Taux le plus proche d'une maturité demandée (3M ← 1A au Japon, 30A ← 20A au Royaume-Uni…), signalé. */
function nearY(c,t){ const v=cy(c,t); if(v!=null) return {v,t,exact:true}; const i=TEN_ORD.indexOf(t);
for(let d=1;d<=2;d++) for(const j of [i-d,i+d]){ const tt=TEN_ORD[j]; const w=cy(c,tt); if(w!=null) return {v:w,t:tt,exact:false}; } return null; }
function gcHtml(){
const C=allCurves(); if(!C.length) return '<div class="note">Courbes pas encore générées.</div>';
const sel=C.filter(c=>GC.sel.has(c.k)), tenors=TEN_ORD.filter(t=>sel.some(c=>cy(c,t)!=null));
const bund=C.find(c=>c.k==='DE'), d10=(k)=>{ const a=cy(C.find(c=>c.k===k),'10A'), b=cy(bund,'10A'); return a!=null&&b!=null?(a-b)*100:null; };
const slope=c=>{ const a=cy(c,'2A'), b=cy(c,'10A'); return a!=null&&b!=null?(b-a)*100:null; };
return `<div class="ctl" style="align-items:center;margin:-9px -9px 9px;border-top:none"><span class="mut" style="font-size:10px">Pays :</span>
${C.map(c=>`<button type="button" class="chip ${GC.sel.has(c.k)?'on':''}" data-gck="${c.k}" aria-pressed="${GC.sel.has(c.k)}" style="border-color:${GC.sel.has(c.k)?c.col:'var(--line)'}"><span style="color:${c.col}">■</span> ${esc(c.n)}${c.freq==='mensuel'?' <span class="mut">(10A)</span>':''}</button>`).join('')}</div>
<div class="statrow" style="border:none;padding:0 0 8px">
${sel.filter(c=>slope(c)!=null).slice(0,4).map(c=>`<div class="stat"><span class="l">${esc(c.n.toUpperCase())} 2S10S</span><span class="n ${cls(slope(c))}">${nf(slope(c),0)} pb</span></div>`).join('')}
${d10('FR')!=null?`<div class="stat"><span class="l">SPREAD OAT − BUND 10A</span><span class="n">${nf(d10('FR'),0)} pb</span></div>`:''}
${d10('IT')!=null?`<div class="stat"><span class="l">SPREAD BTP − BUND 10A</span><span class="n">${nf(d10('IT'),0)} pb</span></div>`:''}
${d10('US')!=null?`<div class="stat"><span class="l">US − BUND 10A</span><span class="n">${nf(d10('US'),0)} pb</span></div>`:''}</div>
<canvas id="gccv" height="300" role="img" aria-label="Courbes des taux des pays sélectionnés, aujourd'hui et il y a un mois"></canvas>
<table style="margin-top:8px"><caption class="sr-only">Courbes des taux par maturité</caption><thead><tr><th scope="col">Maturité</th>${sel.map(c=>`<th scope="col"><span style="color:${c.col}">■</span> ${esc(c.n)}</th>`).join('')}</tr></thead><tbody>
${tenors.map(t=>`<tr><th scope="row" class="sym">${t}</th>${sel.map(c=>{ const p=c.pts.find(x=>x.t===t); if(!p) return '<td class="na">—</td>';
const dv=p.y1m!=null?(p.y-p.y1m)*100:null; return `<td>${nf(p.y,2)} % <span class="${cls(dv)}" style="font-size:9px">${dv!=null?(dv>0?'+':'')+nf(dv,0)+' pb':''}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table>
<div class="note">${sel.map(c=>{ const ts=c.pts.map(p=>p.ts).filter(Boolean).sort().pop(); const old=ts&&c.freq==='quotidien'&&(Date.now()-new Date(ts))/864e5>7; return `<b style="color:${c.col}">${esc(c.n)}</b>${ts?` (au ${new Date(ts+'T12:00:00').toLocaleDateString('fr-FR')}${old?' — <span class="neg">données anciennes</span>':''})`:''} : ${esc(c.src||'')}${c.freq==='mensuel'?' (seul le 10 ans est disponible gratuitement)':''}${c.stale?' — <span class="neg">source en échec, dernière courbe conservée</span>':''}`; }).join(' · ')}. Variation sur 1 mois en points de base. Trait plein : aujourd'hui ; pointillés : il y a 1 mois.</div>`;
}
function wireGC(root){ root.querySelectorAll('[data-gck]').forEach(b=>b.onclick=()=>{ const k=b.dataset.gck; GC.sel.has(k)?GC.sel.delete(k):GC.sel.add(k); if(!GC.sel.size) GC.sel.add(k);
const box=document.getElementById('gcbody'); box.innerHTML=gcHtml(); wireGC(box); drawGC(); }); }
function drawGC(hover){
const cv=document.getElementById('gccv'); if(!cv) return;
const C=allCurves().filter(c=>GC.sel.has(c.k)&&c.pts.length), tenors=TEN_ORD.filter(t=>C.some(c=>cy(c,t)!=null)); if(!tenors.length) return;
const yrs=t=>t.endsWith('M')?parseInt(t)/12:parseInt(t);
const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1, H=300; cv.width=r.width*dpr; cv.height=H*dpr;
const x=cv.getContext('2d'); x.scale(dpr,dpr); const W=r.width, pl=52, pr=96, pb=24, pt=30;
// Échelle des maturités en racine carrée : les maturités courtes restent lisibles sans écraser le long terme.
const s0=Math.sqrt(yrs(tenors[0])), s1=Math.sqrt(yrs(tenors[tenors.length-1]));
const X=t=>pl+(s1>s0?(Math.sqrt(yrs(t))-s0)/(s1-s0):0.5)*(W-pl-pr);
const all=C.flatMap(c=>c.pts.flatMap(p=>[p.y,p.y1m])).filter(v=>v!=null);
let lo=Math.min(...all), hi=Math.max(...all); const pad=Math.max(0.15,(hi-lo)*0.08); lo-=pad; hi+=pad;
const span=hi-lo, stp=span>4?1:span>2?0.5:span>1?0.25:0.1; lo=Math.floor(lo/stp)*stp; hi=Math.ceil(hi/stp)*stp;
const Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
x.font='10px monospace'; x.strokeStyle='#1c2127'; x.fillStyle='#8a93a0'; x.lineWidth=1;
for(let v=lo; v<=hi+1e-9; v+=stp){ const y=Y(v); x.beginPath(); x.moveTo(pl,y); x.lineTo(W-pr,y); x.stroke(); x.textAlign='right'; x.fillText(nf(v,stp<0.5?2:1)+' %',pl-6,y+3); }
x.textAlign='center'; let lastLx=-99; tenors.forEach((t,i)=>{ x.strokeStyle='#14171b'; x.beginPath(); x.moveTo(X(t),pt); x.lineTo(X(t),H-pb); x.stroke(); const w=x.measureText(t).width; if(X(t)-lastLx>w+6||i===tenors.length-1&&X(t)-lastLx>w/2+4){ x.fillStyle='#8a93a0'; x.fillText(t,X(t),H-7); lastLx=X(t); } });
// Légende
let lx=pl; x.textAlign='left'; x.font='10px monospace';
C.forEach(c=>{ x.fillStyle=c.col; x.fillRect(lx,11,14,3); const t=c.n+(c.pts.length===1?` (${c.pts[0].t})`:''); x.fillText(t,lx+18,16); lx+=x.measureText(t).width+34; });
x.fillStyle='#6c7783'; x.fillText('—— aujourd\'hui   - - - il y a 1 mois',Math.max(lx,W-pr-250),16);
// Courbes
C.forEach(c=>{ const P=tenors.map(t=>c.pts.find(p=>p.t===t)).filter(Boolean);
if(P.length>1){ for(const [key,dash] of [['y1m',true],['y',false]]){ x.strokeStyle=c.col; x.globalAlpha=dash?0.4:1; x.lineWidth=dash?1.2:2; x.setLineDash(dash?[4,4]:[]); x.beginPath(); let st=false;
P.forEach(p=>{ if(p[key]==null) return; st?x.lineTo(X(p.t),Y(p[key])):x.moveTo(X(p.t),Y(p[key])); st=true; }); x.stroke(); } x.setLineDash([]); x.globalAlpha=1;
P.forEach(p=>{ x.fillStyle=c.col; x.beginPath(); x.arc(X(p.t),Y(p.y),2.2,0,7); x.fill(); }); }
else if(P.length===1){ const p=P[0], cx=X(p.t), cy2=Y(p.y); x.fillStyle=c.col; x.beginPath(); x.moveTo(cx,cy2-6); x.lineTo(cx+6,cy2); x.lineTo(cx,cy2+6); x.lineTo(cx-6,cy2); x.closePath(); x.fill();
if(p.y1m!=null){ x.strokeStyle=c.col; x.globalAlpha=0.5; x.setLineDash([2,2]); x.beginPath(); x.moveTo(cx,Y(p.y1m)); x.lineTo(cx,cy2); x.stroke(); x.setLineDash([]); x.globalAlpha=1; } } });
// Étiquettes de fin de courbe, écartées pour ne pas se chevaucher
const tags=C.map(c=>{ const P=c.pts.filter(p=>tenors.includes(p.t)); const last=P.reduce((a,p)=>yrs(p.t)>yrs(a.t)?p:a,P[0]); return {c,v:last.y,y:Y(last.y)}; }).sort((a,b)=>a.y-b.y);
for(let i=1;i<tags.length;i++) if(tags[i].y-tags[i-1].y<15) tags[i].y=tags[i-1].y+15;
x.font='bold 10px monospace'; tags.forEach(g=>{ const t=`${g.c.k} ${nf(g.v,2)} %`, w=x.measureText(t).width+8; x.fillStyle=g.c.col; x.fillRect(W-pr+6,g.y-8,w,16); x.fillStyle='#0b0e11'; x.textAlign='left'; x.fillText(t,W-pr+10,g.y+3.5); });
x.font='10px monospace';
if(hover){ const t=hover.t, my=hover.y, inP=my>=pt&&my<=H-pb;
x.strokeStyle='rgba(221,227,234,.4)'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(X(t),pt); x.lineTo(X(t),H-pb); if(inP){ x.moveTo(pl,my); x.lineTo(W-pr,my); } x.stroke(); x.setLineDash([]);
if(inP){ const v=lo+(1-(my-pt)/(H-pt-pb))*(hi-lo); x.font='bold 10px monospace'; const tx=nf(v,2)+' %', w=x.measureText(tx).width+8; x.fillStyle='#dde3ea'; x.fillRect(pl-w-2,my-8,w,16); x.fillStyle='#0b0e11'; x.textAlign='left'; x.fillText(tx,pl-w+2,my+3.5); x.font='10px monospace'; }
const L=[[`Maturité ${t}`,'#dde3ea']]; C.forEach(c=>{ const p=c.pts.find(z=>z.t===t); if(!p) return; x.fillStyle='#dde3ea'; x.beginPath(); x.arc(X(t),Y(p.y),3.5,0,7); x.fill(); x.fillStyle=c.col; x.beginPath(); x.arc(X(t),Y(p.y),2.5,0,7); x.fill();
L.push([`${c.n.padEnd(14)} ${nf(p.y,2)} %${p.y1m!=null?`  ${p.y-p.y1m>=0?'+':''}${nf((p.y-p.y1m)*100,0)} pb / 1 mois`:''}`,c.col]); });
const bw=Math.max(...L.map(l=>x.measureText(l[0]).width))+16, bh=L.length*15+8, bx=X(t)+14+bw>W-pr?X(t)-bw-14:X(t)+14;
x.fillStyle='rgba(11,14,17,.94)'; x.fillRect(bx,pt+4,bw,bh); x.strokeStyle='#2a3038'; x.strokeRect(bx,pt+4,bw,bh);
L.forEach(([s,c],j)=>{ x.fillStyle=c; x.textAlign='left'; x.fillText(s,bx+8,pt+20+j*15); }); }
cv.style.cursor='crosshair';
cv.onmousemove=ev=>{ const rr=cv.getBoundingClientRect(), mx=ev.clientX-rr.left; const t=tenors.reduce((a,b)=>Math.abs(X(b)-mx)<Math.abs(X(a)-mx)?b:a); drawGC({t,y:ev.clientY-rr.top}); };
cv.onmouseleave=()=>drawGC(null);
}
