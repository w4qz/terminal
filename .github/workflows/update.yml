# À placer dans le dépôt sous : .github/workflows/update.yml
name: Mise à jour des données (rapide)

on:
  schedule:
    - cron: "5,35 * * * *"    # secours si le relais Cloudflare ne déclenche pas (déclenchement principal : relais, */10 * * * *)
  workflow_dispatch:          # bouton « Run workflow » (manuel) ou relais Cloudflare (auto = true)
    inputs:
      auto:
        description: "Lancement automatique par le relais Cloudflare (ne force pas les données quotidiennes)"
        required: false
        default: "false"

permissions:
  contents: write             # autorise le robot à publier ses fichiers

concurrency:
  group: update-fast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer prix, taux et news
        id: prices
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FT_MYFT_RSS: ${{ secrets.FT_MYFT_RSS }}
        run: python scripts/update_data.py

      - name: Catalogue et carte des marchés (cours de ~900 titres)
        id: universe
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_universe.py

      - name: Onglet Macro (ECO, WIRP, GC, BTMM)
        id: macro
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_macro.py

      - name: Courbes des taux souveraines (GC)
        id: curves
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WEBSTAT_API_KEY: ${{ secrets.WEBSTAT_API_KEY }}
        run: python scripts/build_curves.py

      - name: Carte — points chauds et recherche
        id: geo
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto != 'true' }}
        run: python scripts/build_geo.py

      - name: Monde — BRI, FMI, COT, Polymarket, catastrophes naturelles
        id: world
        continue-on-error: true
        timeout-minutes: 4
        env:
          WORLD_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto != 'true' }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: python scripts/build_world.py

      - name: Publier les fichiers
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          git config user.name  "terminal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data.json ft.json universe.json constituents.json macro.json curves.json geo.json world.json"
          # Seuls les fichiers produits par CE robot sont publiés : l'autre robot ne voit jamais
          # ses fichiers récents écrasés par une copie ancienne.
          mkdir -p "$RUNNER_TEMP/out"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/out/"; done
          for i in 1 2 3 4; do
            if git fetch origin main && git reset --hard origin/main; then
              cp "$RUNNER_TEMP"/out/* . 2>/dev/null || true
              # status.json (onglet Diagnostic) : on met à jour nos étapes, on garde celles de l'autre robot
              python3 - <<'PY'
          import json, os, datetime
          names = {"prices": "prix, taux et news", "universe": "catalogue", "macro": "macro", "curves": "courbes souveraines", "geo": "carte", "world": "monde (BRI, FMI, COT, Polymarket, catastrophes)"}
          steps = json.loads(os.environ.get("STEPS_JSON") or "{}")
          try:
              st = json.load(open("status.json", encoding="utf-8"))
          except Exception:
              st = {}
          st.setdefault("steps", {})
          for sid, label in names.items():
              if sid in steps:
                  st["steps"][label] = steps[sid].get("outcome")
          st["finished_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          st["run"] = os.environ.get("GITHUB_RUN_ID")
          json.dump(st, open("status.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
              for f in $FILES status.json; do [ -f "$f" ] && git add "$f"; done
              if git diff --staged --quiet; then echo "Rien de nouveau à publier"; exit 0; fi
              git commit -m "Données $(date -u +'%Y-%m-%d %H:%M') UTC" && git push origin HEAD:main && exit 0
            fi
            echo "Publication refusée (tentative $i), nouvel essai…"; sleep $((i * 7))
          done
          exit 1
