# À placer dans le dépôt sous : .github/workflows/update.yml
name: Mise à jour des données

on:
  schedule:
    - cron: "0,30 * * * *"    # toutes les 30 minutes (h00 et h30 UTC)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # autorise le robot à committer data.json

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer prix, taux et news
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FT_MYFT_RSS: ${{ secrets.FT_MYFT_RSS }}
        run: python scripts/update_data.py

      - name: Construire le catalogue de recherche
        continue-on-error: true      # un échec ici ne bloque pas les prix
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_universe.py

      - name: Construire l'onglet Macro (ECO, WIRP, GC, BTMM)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_macro.py

      - name: Publier data.json
        run: |
          git config user.name  "terminal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data.json universe.json constituents.json macro.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "Données $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
